<style>
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --fg:#1D1D1F; --fg2:#6E6E73; --fg3:#AEAEB2; --line:#E5E5EA; --fill:#F2F2F7;
  --blue:#0071E3; --up:#DC2F3D; --down:#1F6FE5;
  --buy:#167A40; --buy-bg:#E8F7EE; --sell:#D22F3C; --sell-bg:#FDEBEC;
  --wait:#975A00; --wait-bg:#FFF4E0; --info:#1B64DA; --info-bg:#EAF2FE;
  /* 글자: 6단계 · 굵기 700/600/400 · 기준 17px(rem이라 시스템 글자 크기를 따라감) */
  --t-display:calc(36rem/17); --t-title:calc(24rem/17); --t-heading:calc(20rem/17); --t-body:1rem; --t-detail:calc(16rem/17); --t-small:calc(15rem/17);
  /* 간격 */
  --gap-eyebrow:4px; --gap-sub:8px; --gap-text:4px; --gap-inner:16px;
  --pad-card:18px; --gap-caption:8px; --gap-block:20px; --gap-section:28px; --gutter:22px;
  --r-card:20px; --r-control:12px; --r:var(--r-card);
  --ease:cubic-bezier(.32,.72,0,1);      /* 시트·화면 전환 곡선 (튕기지 않음) */
  --ease-back:cubic-bezier(.34,1.4,.64,1); /* 끌다 놓아 제자리로 돌아올 때만 살짝 튕김 */
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --bar:rgba(245,245,247,.92); --tab:rgba(255,255,255,.94); --thumb:#FFFFFF; --sheet:#FFFFFF; --sheet-list:#F5F5F7; --field:rgba(118,118,128,.12); --toast:rgba(29,29,31,.94);
  color-scheme:light;
}
/* 다크 모드: 아이폰 설정을 따라감 (애플 다크 팔레트) */
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#1C1C1E; --fg:#F5F5F7; --fg2:#98989D; --fg3:#8E8E93; --line:#38383A; --fill:#2C2C2E;
    --blue:#0A84FF; --up:#FF5A66; --down:#4C9AFF;
    --buy:#30D158; --buy-bg:#0F2E1B; --sell:#FF6961; --sell-bg:#3A1416;
    --wait:#FFB340; --wait-bg:#3A2A0E; --info:#64A8FF; --info-bg:#132A4A;
    --bar:rgba(22,22,24,.92); --tab:rgba(28,28,30,.94); --thumb:#636366; --sheet:#1C1C1E; --sheet-list:#2C2C2E; --field:rgba(118,118,128,.24); --toast:rgba(58,58,60,.96);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:106.25%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:var(--t-body);line-height:1.45;word-break:keep-all;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
html,body{touch-action:manipulation}   /* 두 번 탭 확대 막기 */
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
input,select,textarea{font-size:max(16px,1em)}   /* 16px보다 작으면 iOS가 입력할 때 화면을 확대한다 */
b,strong{font-weight:600}
button{cursor:pointer;border:0;background:none;padding:0;-webkit-user-select:none;user-select:none}
:focus{outline:none} :focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:10px}
.wrap{max-width:640px;margin:0 auto;padding:0 max(var(--gutter),env(safe-area-inset-right,0px)) 120px max(var(--gutter),env(safe-area-inset-left,0px))}

/* 화면 전환 (아이폰처럼: 새 화면은 오른쪽에서, 뒤 화면은 살짝 물러나며 어두워짐) */
html,body{overflow-x:clip}
#app{position:relative;z-index:2;background:var(--bg);min-height:100vh;min-height:100dvh;transform-origin:50% 50%}

.ghost.top{z-index:4;box-shadow:-8px 0 24px rgba(0,0,0,.08)}

.shade{position:fixed;inset:0;z-index:3;background:rgba(0,0,0,.1);pointer-events:none;opacity:0}
body.sheet-open{background:#1D1D1F}
.v-push{animation:push .38s var(--ease) both}
.v-pop{animation:pop .34s var(--ease) both}
.v-fade{animation:fade .24s var(--ease-out) both}

@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 누름 반응 */
.press{transition:transform .16s var(--ease-out),background-color .16s,opacity .16s}

.text-btn{min-height:44px;display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-size:var(--t-body);font-weight:600;margin-right:-6px;padding:0 6px}

.swipe.gone{transition:height .3s var(--ease),opacity .3s}
.minus{width:0;height:24px;flex:none;border-radius:50%;background:var(--sell);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-right:-12px;transform:scale(.4);opacity:0;transition:width .3s var(--ease),margin .3s var(--ease),transform .3s var(--ease),opacity .2s}
.minus::before{content:"";width:11px;height:2.5px;border-radius:2px;background:#fff}

.row .head .dist{color:var(--fg2);margin-left:6px;font-variant-numeric:tabular-nums} .today .gate{margin-top:var(--gap-sub);padding-top:var(--gap-sub);border-top:1px solid var(--line);font-size:var(--t-small);color:var(--fg2);line-height:1.5} .today .gate b{color:var(--fg);font-weight:600} .row .head{flex-wrap:nowrap;min-width:0} .row .head .pill{flex:none} .row .head .act1{font-size:var(--t-detail);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

.sec-title{font-size:var(--t-heading);font-weight:600;line-height:1.3;color:var(--fg);margin:var(--gap-section) var(--pad-card) var(--gap-caption);display:flex;justify-content:space-between;align-items:baseline;gap:12px}

<script>
"use strict";
/* ───────── 저장 (이 기기에만) ───────── */
const LS = {
  get(k, d=null){ try{ const v = localStorage.getItem(k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
/* 2026-10-23: 매크로 앱 (오동엔진). 탭 = 오늘 · 일정 · 기준 · 설정. 동현·수학·오동 엔진은 없앰 */
const HOME = "today";
const S = { token: LS.get("tok", ""), repo: LS.get("repo", "odh2838-art/timing-agent"),
  tab: HOME, detail: null, dash: LS.get("dash"), csv: null, alerts: null, err: "", busy: null, loading: true, dirty: false };
let REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
try{ matchMedia("(prefers-reduced-motion: reduce)").addEventListener("change", e => REDUCED = e.matches); }catch(e){}

/* ───────── GitHub ───────── */
const enc = p => p.split("/").map(encodeURIComponent).join("/");
async function gh(path, opt={}){
  let res;
  try{ res = await fetch("https://api.github.com/repos/" + S.repo + path, {
    ...opt, cache:"no-store", signal: opt.signal || (AbortSignal.timeout ? AbortSignal.timeout(15000) : undefined),
    headers:{ "Authorization":"Bearer " + S.token, "X-GitHub-Api-Version":"2022-11-28",
              "Accept": opt.raw ? "application/vnd.github.raw+json" : "application/vnd.github+json",
              ...(opt.body ? {"Content-Type":"application/json"} : {}) }
  }); }catch(e){ throw new Error("연결할 수 없어요 · 인터넷을 확인해 주세요"); }
  if (res.status === 429 || (res.status === 403 && res.headers.get("x-ratelimit-remaining") === "0")) throw new Error("요청이 많아요 · 잠시 뒤 다시 해 주세요");
  if (res.status === 401){ const e = new Error("토큰이 맞지 않거나 만료됐어요"); e.auth = true; throw e; }
  if (res.status === 403) throw new Error("토큰 권한이 부족해요 · Contents·Actions 읽기/쓰기 허용");
  if (res.status === 404) { const e = new Error("없음"); e.nf = true; throw e; }
  if (res.status === 409) throw new Error("다른 곳에서 먼저 바뀌었어요 · 다시 시도해 주세요");
  if (!res.ok) throw new Error("잠시 문제가 있어요 · 다시 시도해 주세요");
  if (res.status === 204) return null;
  return opt.raw ? (opt.blob ? res.blob() : res.text()) : res.json();
}
async function readJSON(path, d){ try{ return JSON.parse(await gh("/contents/" + enc(path) + "?ref=main", {raw:true})); }catch(e){ if (e.nf) return d; throw e; } }


/* ───────── 점검 실행 ───────── */
async function dispatch(cmd, symbol){
  const since = Date.now() - 5000;
  await gh("/actions/workflows/agent.yml/dispatches", { method:"POST", body: JSON.stringify({ ref:"main", inputs: symbol ? {cmd, symbol} : {cmd} }) });
  return since;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function waitRun(since, label){
  S.busy = label; toast(label + " · 1분 정도", true); syncBusy();
  let id = null, errs = 0;
  for (let i=0;i<60;i++){
    await sleep(i < 6 ? 3000 : 5000);
    try{
      const j = await gh("/actions/runs?event=workflow_dispatch&per_page=5"); errs = 0;
      const run = id ? j.workflow_runs.find(r => r.id === id) : j.workflow_runs.find(r => Date.parse(r.created_at) >= since - 60000);   // 폰 시계가 조금 빨라도 찾게
      if (!run) continue;
      id = run.id;
      if (run.status === "completed"){
        S.busy = null; syncBusy();
        if (run.conclusion === "success"){ await refresh(); toast("다시 계산했어요"); }
        else toast("계산하지 못했어요. 설정 > 고급 > 실행 기록을 확인해 주세요.");
        return;
      }
    }catch(e){ if (++errs >= 3){ S.busy = null; syncBusy(); toast(e.message); return; } }   // 계속 실패하면 5분 기다리지 않고 알림
  }
  S.busy = null; syncBusy(); toast("아직 계산 중이에요. 잠시 뒤 새로고침해 주세요.");
}
function syncBusy(){ document.querySelectorAll("[data-busy]").forEach(b => b.disabled = !!S.busy); }

/* ───────── 데이터 ───────── */
async function refresh(){   // 화면의 자료는 그대로 두고 뒤에서 받아서, 성공했을 때만 바꿈 (오프라인이면 그대로)
  S.err = ""; S.loading = false;
  try{ await loadMac(); }catch(e){ if (S.mac) toast(e.message); else { S.macL = false; } }
  if (!S.dirty && !document.querySelector(".sheet-bg")) render("none");
}
/* 화면 확대 막기 (iOS는 user-scalable=no를 무시하므로 손가락 두 개 확대를 직접 막는다). 차트 안의 확대·축소는 그대로 */
["gesturestart", "gesturechange", "gestureend"].forEach(t => document.addEventListener(t, e => { if (!e.target.closest?.(".plot, .pro-box")) e.preventDefault(); }, {passive: false}));
/* 손가락 두 개: 차트 밖이면 화면 확대를 막고, 차트 안이면 화면이 위아래로 움직이지 않게 막아 차트 확대·축소로 쓴다 */
if (/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)){
  document.addEventListener("touchstart", e => { if (e.touches.length > 1) e.preventDefault(); }, {passive: false});
  document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, {passive: false});
}

/* ───────── 공통 ───────── */
const $app = document.getElementById("app");
// 엔진 문장에서 사람 이름·규칙 번호는 화면에 안 보여요 (예전 결과 파일 대비)
const esc = s => String(s ?? "").replace(/\u0044ONS|\uB3C8\uC2A4|@?\u0064ons_korea/gi, "오동엔진").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = v => { if (v == null || !isFinite(v)) return "-"; const r = +(+v).toFixed(1); return (r > 0 ? "+" : r < 0 ? "−" : "") + Math.abs(r).toFixed(1) + "%"; };
const CHEV = `<svg class="chev" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>`;
const BACK = `<svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2L2 10l8 8"/></svg>`;

/* 화면 그리기: how = push | pop | fade | none */
function render(how = "fade"){
  const tb = document.getElementById("tabbar");
  tb.hidden = !S.token;
  tb.classList.toggle("away", !!S.dhd);
  document.querySelectorAll(".tabbar button").forEach(b => { b.classList.toggle("on", b.dataset.tab === S.tab); b.toggleAttribute("aria-current", b.dataset.tab === S.tab); if (b.dataset.tab === S.tab) b.setAttribute("aria-current", "page"); });
  tb.inert = !!S.dhd;   // 화면 밖으로 내려간 탭바에 포커스가 가지 않게
  LS.set("view", { tab: S.tab, dhd: S.dhd, t: Date.now() });   // 다시 열거나 새 버전으로 바뀌어도 보던 곳으로
  const keep = how === "none" ? scrollY : 0;
  const slide = (how === "push" || how === "pop") && !REDUCED;
  const ghost = slide ? snapshot() : null;
  try{
    if (!S.token) renderSetup();
    else if (S.dhd && String(S.dhd).startsWith("m:")) renderMacDetail(String(S.dhd).slice(2));
    else if (S.tab === "cal") renderCal();
    else if (S.tab === "rules") renderRules();
    else if (S.tab === "settings") renderSettings();
    else { S.tab = "today"; S.dhd = null; renderMac(); }
  }catch(e){   // 자료 한 곳이 이상해도 앱 전체가 멈추지 않게: 전환 화면을 걷고 홈으로
    console.error(e); ghost?.remove(); S.dhd = null; S.tab = HOME; try{ renderMac(); }catch(_){} toast("이 화면을 열지 못했어요");
    bindNavbar(); return;
  }
  $app.classList.remove("v-push","v-pop","v-fade");
  if (how === "fade" && !REDUCED){ void $app.offsetWidth; $app.classList.add("v-fade"); }
  if (how === "none") scrollTo(0, keep); else if (how === "pop") scrollTo(0, S.listY || 0); else scrollTo(0, 0);
  bindNavbar();
  if (ghost) slidePages(how, ghost);
}
/* 지금 화면을 통째로 떼어 고정 (전환하는 동안 뒤/앞 화면 역할).
   복사하지 않고 옮기므로 손가락이 닿아 있던 요소도 그대로 살아 있다. */
function snapshot(){
  const g = document.createElement("div"); g.className = "ghost"; g.setAttribute("aria-hidden", "true");
  g.style.top = $app.getBoundingClientRect().top + "px";
  while ($app.firstChild) g.appendChild($app.firstChild);
  document.body.appendChild(g); return g;
}
const PAGE_MS = 500, PAGE_EASE = "cubic-bezier(.32,.72,0,1)";
function slidePages(how, ghost, from = 0){
  const shade = document.createElement("div"); shade.className = "shade"; document.body.appendChild(shade);
  const W = innerWidth, o = { duration: PAGE_MS * (1 - from), easing: PAGE_EASE, fill: "forwards" };
  let anims;
  if (how === "push"){   // 새 화면이 위로 덮으며 들어옴
    $app.classList.add("over");
    anims = [ $app.animate([{transform:`translateX(${W}px)`}, {transform:"none"}], o),
              ghost.animate([{transform:"none"}, {transform:`translateX(${-W*.3}px)`}], o),
              shade.animate([{opacity:0}, {opacity:1}], o) ];
  } else {               // 앞 화면이 오른쪽으로 빠지고 뒤 화면이 돌아옴
    ghost.classList.add("top");
    anims = [ ghost.animate([{transform:`translateX(${W*from}px)`}, {transform:`translateX(${W}px)`}], o),
              $app.animate([{transform:`translateX(${-W*.3*(1-from)}px)`}, {transform:"none"}], o),
              shade.animate([{opacity:1-from}, {opacity:0}], o) ];
  }
  Promise.all(anims.map(a => a.finished)).then(() => { anims.forEach(a => a.cancel()); ghost.remove(); shade.remove(); $app.classList.remove("over"); });
}
/* 기록 깊이: 항목마다 n(바닥에서 몇 번째)을 넣어 탭·상세·사용법을 오가도 '뒤로'가 어긋나지 않게 */
const hN = () => +(history.state?.n || 0);
function hPush(v){ try{ history.pushState({ v, n: hN() + 1 }, ""); }catch(e){} }
let skipPop = 0, popFix = null, BACK_ANIM = false;
function histTo(n, v){   // 기록을 깊이 n(맨 위 항목 v)으로 맞춘다
  const cur = hN();
  try{
    if (cur === n){ if (n) history.replaceState({ v, n }, ""); }
    else if (cur < n){ for (let k = cur + 1; k <= n; k++) history.pushState({ v: k === n ? v : "t", n: k }, ""); }
    else { skipPop++; popFix = n ? () => { try{ history.replaceState({ v, n }, ""); }catch(e){} } : null; history.go(n - cur); }
  }catch(e){}
}
function go(how, fn){ if (how === "push"){ S.listY = scrollY; hPush("d"); } S.dirty = false; try{ S.chart?.destroy?.(); }catch(e){} S.chart = null; clearInterval(S.tfTimer); fn(); render(how); }
/* 시스템 '뒤로'(안드로이드 제스처·버튼, 브라우저 뒤로): 시트 → 상세 → 다른 탭 순서로 한 단계씩 닫는다 */
addEventListener("popstate", () => {
  if (skipPop){ skipPop--; const f = popFix; popFix = null; f?.(); return; }
  if (SWIPING) return;
  document.querySelectorAll(".ghost").forEach(g => { if (!g.getAnimations().length) g.remove(); });   // 전환이 끝났는데 남은 화면 조각 (터치가 막히는 원인)
  const sh = document.querySelector(".sheet-bg:not(.closing)");
  if (sh){ sh._close?.(true); return; }
  const how = BACK_ANIM ? "pop" : "none"; BACK_ANIM = false;   // 앱의 뒤로 버튼이면 밀리는 전환, 시스템 제스처면 그대로 (두 번 밀리지 않게)
  if (S.tab === "guide" && S.guideFrom){ const g = S.guideFrom; S.guideFrom = null; go("fade", () => { S.tab = g.tab; S.dhd = g.dhd || null; }); return; }   // 사용법을 연 곳으로
  if (S.dhd){ go(how, () => S.dhd = null); return; }
  if (S.tab !== HOME) go("fade", () => { S.tab = HOME; });
});

/* 큰 제목이 지나가면 위쪽 바를 불투명하게 */
let navObs;
function bindNavbar(){
  navObs?.disconnect();
  const bar = $app.querySelector(".navbar"), anchor = $app.querySelector("[data-anchor]");
  if (!bar || !anchor) return;
  const big = anchor.querySelector(".big") || anchor;
  navObs = new IntersectionObserver(([e]) => bar.classList.toggle("solid", e.intersectionRatio < 1), {rootMargin:"-52px 0px 0px 0px", threshold:[0, 1]});
  navObs.observe(big);
}

function renderSetup(msg){
  $app.innerHTML = `<div class="wrap" style="padding-top:48px">
    <h1 class="big">rooru.invest</h1>
    <p class="note" style="margin:var(--gap-sub) 0 var(--gap-section)">금리·유가·물가·신용·심리로 지금 시장이 어떤지 알려 드려요 (오동엔진). 이 앱은 내 GitHub 저장소(timing-agent, 숫자를 계산해 두는 곳)에 연결해서 써요.</p>
    <div class="card stack">
      <div class="field"><label for="tok">GitHub 토큰</label><input id="tok" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…" enterkeyhint="go" value="${esc(S.tokDraft || "")}">${msg ? `<p class="ferr" role="alert">${esc(msg)}</p>` : ""}</div>
      <button class="btn primary press" id="go" disabled>연결</button>
      <a class="tlink" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">토큰 만들기 ›</a>
    </div>
    <p class="note" style="margin:12px 4px 0;line-height:1.5">토큰 = 앱이 내 저장소를 읽고 계산을 시작할 수 있게 하는 열쇠예요.<br>① 토큰 만들기 › Fine-grained token<br>② 저장소: timing-agent 하나만 선택<br>③ 권한: Contents · Actions 읽기/쓰기</p>
    <p class="note" style="margin:16px 4px">이 기기에만 저장돼요.</p>
    <details class="adv"><summary class="press">고급 설정 ›</summary><div class="card stack" style="margin-top:var(--gap-sub)"><div class="field"><label for="repo">자료 저장소</label><input id="repo" value="${esc(S.repo)}" autocapitalize="off" spellcheck="false"></div></div></details>
  </div>`;
  const $go = document.getElementById("go"), $t = document.getElementById("tok");
  $t.onkeydown = e => { if (e.key === "Enter") $go.click(); };
  const sync = () => { $go.disabled = !$t.value.trim(); }; $t.oninput = sync; sync();
  $go.onclick = async () => {
    const t = $t.value.trim(), r = document.getElementById("repo").value.trim();
    if (!t){ $t.focus(); return; }
    $go.disabled = true; $go.innerHTML = `<span class="spin"></span>연결 중`;
    S.token = t; S.repo = r;
    try{ await gh(""); LS.set("tok", t); LS.set("repo", r); S.tab = HOME; S.loading = true; render("fade"); refresh(); }
    catch(e){ S.token = ""; S.tokDraft = t; renderSetup(e.nf ? "저장소를 찾을 수 없어요 · 토큰의 저장소 권한을 확인해 주세요" : e.message); }
  };
}



/* 왼쪽 가장자리에서 밀면 뒤로: 손가락을 따라 앞 화면이 밀리고 뒤 화면이 드러남.
   아이폰(홈 화면 앱엔 시스템 뒤로가 없음)에서만. 안드로이드는 시스템 뒤로 제스처가 같은 자리를 써서 둘이 부딪히면 화면이 멈춘다 */
let SWIPING = false;

/* 아래에서 올라오는 창: 같은 곡선(.32,.72,0,1)으로 열림 0.4초 · 닫힘 0.28초(끌다 놓으면 손가락 속도를 이어받아 0.12~0.28초)
   닫는 길 네 가지: ✕ · 바깥 터치 · 아래로 끌기(높이 1/3 또는 빠른 튕김) · Escape. 목록이 맨 위일 때만 끌려 내려간다. */
function openSheet(label, inner){

/* 일정 한 줄: 한국 시간 날짜·시각 하나로 (발표 시각이 있으면 그 날짜) */
function calKst(c){
  const m = /^(\d{1,2})\/(\d{1,2}) (\d{1,2}:\d{2})/.exec(c.time || "");
  if (!m) return { d: c.d, hm: "" };
  const y = +c.d.slice(0, 4) + (+m[1] < +c.d.slice(5, 7) ? 1 : 0);
  return { d: `${y}-${m[1].padStart(2, "0")}-${m[2].padStart(2, "0")}`, hm: m[3] };
}
function calRow(c){
  const k = calKst(c), today = new Intl.DateTimeFormat("sv-SE", {timeZone: "Asia/Seoul"}).format(new Date()), dd = Math.round((Date.parse(k.d) - Date.parse(today)) / 864e5);
  return `<div class="row"><span class="mc-ci" aria-hidden="true">${CAL_ICON[c.kind] || "📅"}</span><div class="main"><div class="mc-n">${esc(c.name)}</div><div class="sub">${esc(mDay(k.d))}${k.hm ? " " + esc(k.hm) : ""}${c.note ? " · " + esc(c.note) : ""}</div></div><span class="sub">${dd === 0 ? "오늘" : dd === 1 ? "내일" : dd > 0 ? dd + "일 뒤" : ""}</span></div>`;
}

    <p class="note" style="margin:var(--gap-caption) var(--pad-card) 0">알림은 꺼져 있어요. 앱을 열면 최신 숫자를 받아요.</p>
    <details class="adv"><summary class="press">고급 설정 ›</summary>
    <div class="list" style="margin-top:var(--gap-sub)">
      <div class="row"><div class="main"><div class="sub">자료 저장소</div><b>${esc(S.repo)}</b></div></div>
      <a class="row press" href="https://github.com/${esc(S.repo)}/actions" target="_blank" rel="noopener"><span class="main" style="color:var(--blue)">실행 기록 보기</span>${CHEV}</a>
    </div>
    <div class="list" style="margin-top:var(--gap-block)">
      <button class="row press" id="out"><span class="main" style="color:var(--sell)">토큰 지우기</span></button>
    </div>
    <p class="note" style="margin:var(--gap-caption) var(--pad-card) 0">토큰은 이 기기에만 저장돼요. 지워도 다시 넣으면 그대로 돌아와요.</p>
    </details>
    <p class="note" style="margin:18px 4px">오동엔진 기준으로 계산한 결과예요. 투자 판단은 직접 하세요.</p>
  </div>`;
  document.getElementById("out").onclick = () => { LS.del("tok"); LS.del("dash"); S.token = ""; render("fade"); };
  bindNavbar();
}

let toastT;

/* 새 버전이 올라오면 다시 불러오기 (홈 화면에 추가한 앱은 예전 화면을 오래 들고 있음) */
async function checkVersion(){
  try{
    const mine = document.querySelector('meta[name="app-version"]')?.content;
    const t = await (await fetch(location.pathname + "?v=" + Date.now(), {cache:"no-store"})).text();
    const v = (t.match(/name="app-version" content="([^"]+)"/) || [])[1];
    const busy = S.dirty || S.busy || document.querySelector(".sheet-bg");   // 입력 중·계산 기다리는 중엔 미룸 (다음에 돌아올 때 바꿈)
    let tried = ""; try{ tried = sessionStorage.getItem("verTry") || ""; }catch(e){}
    if (v && mine && v !== mine && !busy && tried !== v){ try{ sessionStorage.setItem("verTry", v); }catch(e){} toast("새 버전으로 바꾸는 중"); setTimeout(() => location.replace(location.pathname + "?v=" + encodeURIComponent(v)), 600); }   // 같은 버전으로 한 번만 (캐시가 늦어도 계속 새로고침하지 않게)
  }catch(e){}
}
addEventListener("visibilitychange", () => { if (!document.hidden) checkVersion(); });
setTimeout(checkVersion, 1500);
try{ LS.set("swipeHint", (LS.get("swipeHint", 0) || 0) + 1); }catch(e){}
function toast(msg, spin){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.setAttribute("aria-live","polite");
  t.innerHTML = (spin ? `<span class="spin"></span>` : "") + `<span>${esc(msg)}</span>`;
  document.body.appendChild(t); clearTimeout(toastT);
  if (!spin) toastT = setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 260); }, 3600);
}

document.querySelectorAll(".tabbar button").forEach(b => b.onclick = () => {
  if (S.tab === b.dataset.tab && !S.dhd){ scrollTo({top:0, behavior: REDUCED ? "auto" : "smooth"}); return; }  // 같은 탭 다시 누르면 맨 위로
  S.guideFrom = null; histTo(b.dataset.tab === HOME ? 0 : 1, "t");   // 탭을 바꾸면 기록은 '홈' 또는 '홈 + 그 탭' 한 칸만
  go("fade", () => { S.tab = b.dataset.tab; S.dhd = null; });
});
addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.token && !S.busy) refresh(); });
{ const v = LS.get("view");   // 보던 탭은 늘, 상세 화면은 10분 안에 다시 열었을 때만
  if (v && ["today", "cal", "rules", "settings"].includes(v.tab)){ S.tab = v.tab;
    if (Date.now() - (v.t || 0) < 6e5){ S.dhd = String(v.dhd || "").startsWith("m:") ? v.dhd : null; }
    histTo((S.tab !== HOME ? 1 : 0) + (S.dhd ? 1 : 0), S.dhd ? "d" : "t"); } }   // 다시 열 때마다 기록이 쌓이지 않게 깊이를 맞춤
render("none");   // 첫 화면이 자료를 받으니 시작할 때 refresh는 따로 안 함 (같은 요청 두 번, 오류 두 번 나오던 것)
</script>
</body>
</html>
