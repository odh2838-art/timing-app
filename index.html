<style>
:root{

  /* 글자: 5단계 34·22·17·15·13 (탭 막대 글자와 그래프 눈금만 예외) · 굵기 700/600/400 · 기준 17px(rem이라 시스템 글자 크기를 따라감) */
  --t-display:calc(34rem/17); --t-title:calc(22rem/17); --t-title2:calc(22rem/17); --t-heading:calc(22rem/17); --t-foot:calc(13rem/17); --t-body:1rem; --t-detail:1rem; --t-small:calc(15rem/17);

  --ease-out:cubic-bezier(.2,.8,.2,1);
  --bar:rgba(245,245,247,.92); --tab:rgba(255,255,255,.94); --thumb:#FFFFFF; --sheet:#FFFFFF; --sheet-list:#F5F5F7; --field:rgba(118,118,128,.12); --toast:rgba(29,29,31,.94);
  color-scheme:light;

.navbar{position:sticky;top:0;z-index:15;margin:0 calc(-1*max(var(--gutter),env(safe-area-inset-left,0px))) 0;padding:0 max(var(--gutter),env(safe-area-inset-right,0px)) 0 max(var(--gutter),env(safe-area-inset-left,0px));height:52px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:transparent;transition:background-color .2s,box-shadow .2s}

.row+.row{position:relative} .row+.row::before{content:"";position:absolute;top:0;left:var(--pad-card);right:0;height:1px;transform:scaleY(.5);transform-origin:top;background:var(--line);pointer-events:none}

@keyframes rowin{from{opacity:0;transform:translateY(-10px)}}
.row .main{flex:1;min-width:0} a.row{text-decoration:none;color:inherit}

.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--tab);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--line);display:flex;justify-content:center;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20;transition:transform .3s var(--ease)}

"use strict";
/* ───────── 저장 (이 기기에만) ───────── */
const LS = {
  get(k, d=null){ try{ const v = localStorage.getItem(k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
/* 2026-10-23: 매크로 앱 (오동엔진). 탭 = 오늘 · 일정 · 기준 · 설정. 동현·수학·오동 엔진은 없앰 */
const HOME = "today";
const REPO_RE = /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/;
const S = { token: LS.get("tok", ""), repo: (r => REPO_RE.test(r) && !/\.\./.test(r) ? r : "odh2838-art/timing-agent")(String(LS.get("repo", "odh2838-art/timing-agent"))),
  tab: HOME, detail: null, dash: LS.get("dash"), csv: null, alerts: null, err: "", busy: null, loading: true, dirty: false };
let REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
try{ matchMedia("(prefers-reduced-motion: reduce)").addEventListener("change", e => REDUCED = e.matches); }catch(e){}

/* ───────── GitHub ───────── */
const enc = p => p.split("/").map(encodeURIComponent).join("/");
async function gh(path, opt={}){
  let res;
  try{ res = await fetch("https://api.github.com/repos/" + S.repo + path, {
    ...opt, cache:"no-store", signal: opt.signal || (AbortSignal.timeout ? AbortSignal.timeout(15000) : undefined),
    headers:{ "Authorization":"Bearer " + S.token, "X-GitHub-Api-Version":"2022-11-28",
              "Accept": opt.raw ? "application/vnd.github.raw+json" : "application/vnd.github+json",
              ...(opt.body ? {"Content-Type":"application/json"} : {}) }
  }); }catch(e){ throw new Error("연결할 수 없어요 · 인터넷을 확인해 주세요"); }
  if (res.status === 429 || (res.status === 403 && res.headers.get("x-ratelimit-remaining") === "0")) throw new Error("요청이 많아요 · 잠시 뒤 다시 해 주세요");
  if (res.status === 401){ const e = new Error("토큰이 맞지 않거나 만료됐어요"); e.auth = true; throw e; }
  if (res.status === 403) throw new Error("토큰 권한이 부족해요 · Contents·Actions 읽기/쓰기 허용");
  if (res.status === 404) { const e = new Error("없음"); e.nf = true; throw e; }
  if (res.status === 409) throw new Error("다른 곳에서 먼저 바뀌었어요 · 다시 시도해 주세요");
  if (!res.ok) throw new Error("GitHub 응답 오류 · 잠시 뒤 다시 시도해 주세요");
  if (res.status === 204) return null;

  for (const h of [...$app.querySelectorAll(".wrap > .sec-title")]){
    const name = h.textContent.trim(), d = document.createElement("details"), sm = document.createElement("summary");
    d.className = "rsec"; d.open = S.rulesOpen.has(name);
    sm.className = "press"; sm.innerHTML = `<h2>${esc(name)}</h2><span class="dchev" aria-hidden="true">›</span>`;
    h.before(d); d.appendChild(sm); h.remove();
    let n = d.nextElementSibling;
    while (n && !n.classList.contains("sec-title") && !n.classList.contains("rnote")){ const nx = n.nextElementSibling; d.appendChild(n); n = nx; }
    d.ontoggle = () => { d.open ? S.rulesOpen.add(name) : S.rulesOpen.delete(name); };
  }
  bindNavbar();
}

function renderSettings(){
  $app.innerHTML = `<div class="wrap"><div class="navbar"><div class="side"></div><span class="mini">설정</span><div class="side r"></div></div>
    <div class="title-block" data-anchor><h1 class="big">설정</h1></div>
    <div class="sec-title" role="heading" aria-level="2">자동 계산 (한국 시간)</div>
    <div class="list">
      <div class="row"><div class="main"><b>매크로 숫자</b><div class="sub">06:40 미국장 마감 뒤 (화~토) · 16:10 한국장 마감 뒤 · 22:50 미국 지표 발표 뒤 (월~금)</div></div></div>
      <div class="row"><div class="main"><b>주도섹터</b><div class="sub">매크로 숫자와 같은 시각에 계산 · 한국은 네이버, 미국은 야후 자료 · 시세는 1분마다</div></div></div>
      <div class="row"><div class="main"><b>아침 브리핑</b><div class="sub">화~토 07:40쯤 (전날 밤 미국장 정리) · BofA 지표·CPI 예상·FedWatch</div></div></div>
    </div>
    <p class="note" style="margin:var(--gap-caption) var(--pad-card) 0">알림은 준비 중이에요. 지금은 앱을 열 때마다 최신 숫자를 받아요.</p>
    <details class="adv"><summary class="press">고급 설정 <span class="dchev" aria-hidden="true">›</span></summary>
    <div class="list" style="margin-top:var(--gap-sub)">
      <div class="row"><div class="main"><div class="sub">자료 저장소</div><b>${esc(S.repo)}</b></div></div>
      <a class="row press" href="https://github.com/${esc(S.repo)}/actions" target="_blank" rel="noopener"><span class="main" style="color:var(--blue)">실행 기록 보기</span>${CHEV}</a>
    </div>
    <div class="list" style="margin-top:var(--gap-block)">
      <button class="row press" id="out"><span class="main" style="color:var(--danger)">토큰 지우기</span></button>
    </div>
    <p class="note" style="margin:var(--gap-caption) var(--pad-card) 0">토큰은 이 기기에만 저장돼요. 지워도 다시 넣으면 그대로 돌아와요.</p>
    </details>
    <p class="note" style="margin:18px 4px">오동엔진 기준으로 계산한 결과예요. 투자 판단은 직접 하세요.</p>
  </div>`;
  document.getElementById("out").onclick = () => { LS.del("tok"); LS.del("dash"); S.token = ""; render("fade"); };
  bindNavbar();
}

let toastT;
/* 용어를 누르면 뜻 (카드 전체 버튼보다 먼저 받음) */
function showTerm(el){
  document.querySelectorAll(".gpop").forEach(x => x.remove());
  const r = el.getBoundingClientRect(), W = Math.min(300, innerWidth - 32), p = document.createElement("div");
  p.className = "gpop"; p.setAttribute("role", "status"); p.innerHTML = `<b>${esc(el.dataset.g)}</b><span>${esc(GL[el.dataset.g] || "")}</span>`;
  p.style.width = W + "px"; p.style.left = Math.max(16, Math.min(innerWidth - W - 16, r.left + r.width / 2 - W / 2)) + "px";
  document.body.appendChild(p);
  const below = r.bottom + 8 + p.offsetHeight < innerHeight - 90;   // 탭 막대에 가리면 위로
  p.style.top = (below ? r.bottom + 8 : r.top - 8 - p.offsetHeight) + scrollY + "px";
}
addEventListener("scroll", () => document.querySelectorAll(".gpop").forEach(x => x.remove()), {passive: true});
document.addEventListener("click", e => { if (!e.target.closest?.(".term[data-g], .gpop")) document.querySelectorAll(".gpop").forEach(x => x.remove()); }, true);
document.addEventListener("click", e => { const t = e.target.closest?.(".term[data-g]"); if (t){ e.preventDefault(); e.stopPropagation(); showTerm(t); } }, true);
document.addEventListener("keydown", e => { const t = e.target.closest?.(".term[data-g]"); if (t && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); e.stopPropagation(); showTerm(t); } }, true);

/* 새 버전이 올라오면 다시 불러오기 (홈 화면에 추가한 앱은 예전 화면을 오래 들고 있음) */
async function checkVersion(){
  try{
    const mine = document.querySelector('meta[name="app-version"]')?.content;
    const t = await (await fetch(location.pathname + "?v=" + Date.now(), {cache:"no-store"})).text();
    const v = (t.match(/name="app-version" content="([^"]+)"/) || [])[1];
    const busy = S.dirty || S.busy;   // 입력 중·계산 기다리는 중엔 미룸 (다음에 돌아올 때 바꿈)
    let tried = ""; try{ tried = sessionStorage.getItem("verTry") || ""; }catch(e){}
    if (v && mine && v !== mine && !busy && tried !== v){ try{ sessionStorage.setItem("verTry", v); }catch(e){} toast("새 버전으로 바꾸는 중"); setTimeout(() => location.replace(location.pathname + "?v=" + encodeURIComponent(v)), 600); }   // 같은 버전으로 한 번만 (캐시가 늦어도 계속 새로고침하지 않게)
  }catch(e){}
}
addEventListener("visibilitychange", () => { if (!document.hidden) checkVersion(); });
setTimeout(checkVersion, 1500);
try{ LS.set("swipeHint", (LS.get("swipeHint", 0) || 0) + 1); }catch(e){}
function toast(msg, spin){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.setAttribute("aria-live","polite");
  t.innerHTML = (spin ? `<span class="spin"></span>` : "") + `<span>${esc(msg)}</span>`;
  document.body.appendChild(t); clearTimeout(toastT); toast.last = t;
  if (!spin) toastT = setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 260); }, Math.max(3600, String(msg).length * 90));
}

document.querySelectorAll(".tabbar button").forEach(b => b.onclick = () => {
  if (S.tab === b.dataset.tab && !S.dhd){ scrollTo({top:0, behavior: REDUCED ? "auto" : "smooth"}); return; }  // 같은 탭 다시 누르면 맨 위로
  S.guideFrom = null; histTo(b.dataset.tab === HOME ? 0 : 1, "t");   // 탭을 바꾸면 기록은 '홈' 또는 '홈 + 그 탭' 한 칸만
  go("fade", () => { S.tab = b.dataset.tab; S.dhd = null; });
});
addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.token && !S.busy) refresh(); });
{ const v = LS.get("view");   // 보던 탭은 늘, 상세 화면은 10분 안에 다시 열었을 때만
  if (v && ["today", "cal", "rules", "settings"].includes(v.tab)){ S.tab = v.tab;
    if (Date.now() - (v.t || 0) < 6e5){ S.dhd = String(v.dhd || "").startsWith("m:") ? v.dhd : null; }
    histTo((S.tab !== HOME ? 1 : 0) + (S.dhd ? 1 : 0), S.dhd ? "d" : "t"); } }   // 다시 열 때마다 기록이 쌓이지 않게 깊이를 맞춤
render("none");   // 첫 화면이 자료를 받으니 시작할 때 refresh는 따로 안 함 (같은 요청 두 번, 오류 두 번 나오던 것)
</script>
</body>
</html>
