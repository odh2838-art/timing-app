<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#F5F5F7">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>rooru.invest</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --fg:#1D1D1F; --fg2:#6E6E73; --fg3:#AEAEB2; --line:#E5E5EA; --fill:#F2F2F7;
  --blue:#0071E3; --up:#F04452; --down:#3182F6;
  --buy:#1B8A4A; --buy-bg:#E8F7EE; --sell:#D22F3C; --sell-bg:#FDEBEC;
  --wait:#B26A00; --wait-bg:#FFF4E0; --info:#1B64DA; --info-bg:#EAF2FE;
  /* 글자: 6단계 · 굵기 700/600/400 · 기준 17px(rem이라 시스템 글자 크기를 따라감) */
  --t-display:calc(36rem/17); --t-title:calc(24rem/17); --t-heading:calc(20rem/17); --t-body:1rem; --t-detail:calc(16rem/17); --t-small:calc(15rem/17);
  /* 간격 */
  --gap-eyebrow:4px; --gap-sub:8px; --gap-text:4px; --gap-inner:16px;
  --pad-card:18px; --gap-caption:8px; --gap-block:20px; --gap-section:28px; --gutter:22px;
  --r-card:20px; --r-control:12px; --r:var(--r-card);
  --ease:cubic-bezier(.32,.72,0,1);      /* 시트·화면 전환 곡선 (튕기지 않음) */
  --ease-back:cubic-bezier(.34,1.4,.64,1); /* 끌다 놓아 제자리로 돌아올 때만 살짝 튕김 */
  --ease-out:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:17px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:var(--t-body);line-height:1.45;word-break:keep-all;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
b,strong{font-weight:600}
button{cursor:pointer;border:0;background:none;padding:0;-webkit-user-select:none;user-select:none}
:focus{outline:none} :focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:10px}
.wrap{max-width:640px;margin:0 auto;padding:0 max(var(--gutter),env(safe-area-inset-right,0px)) 120px max(var(--gutter),env(safe-area-inset-left,0px))}

/* 화면 전환 (아이폰처럼: 새 화면은 오른쪽에서, 뒤 화면은 살짝 물러나며 어두워짐) */
html,body{overflow-x:clip}
#app{position:relative;z-index:2;background:var(--bg);min-height:100vh;min-height:100dvh;transform-origin:50% 50%}
.ghost{position:fixed;left:0;right:0;z-index:1;background:var(--bg);pointer-events:none;min-height:100vh}
.ghost.top{z-index:4;box-shadow:-8px 0 24px rgba(0,0,0,.08)}
#app.over{box-shadow:-8px 0 24px rgba(0,0,0,.08)}
.shade{position:fixed;inset:0;z-index:3;background:rgba(0,0,0,.1);pointer-events:none;opacity:0}
body.sheet-open{background:#1D1D1F}
.v-push{animation:push .38s var(--ease) both}
.v-pop{animation:pop .34s var(--ease) both}
.v-fade{animation:fade .24s var(--ease-out) both}
@keyframes push{from{transform:translateX(28%);opacity:.0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translateX(-12%);opacity:.0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 누름 반응 */
.press{transition:transform .16s var(--ease-out),background-color .16s,opacity .16s}
.press:active{transform:scale(.97)}
.row.press:active{transform:none;background:var(--fill)}

/* 큰 제목 + 스크롤하면 나타나는 작은 제목 */
.navbar{position:sticky;top:0;z-index:15;margin:0 calc(-1*max(var(--gutter),env(safe-area-inset-left,0px))) 0;padding:0 max(var(--gutter),env(safe-area-inset-right,0px)) 0 max(var(--gutter),env(safe-area-inset-left,0px));height:52px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:transparent;transition:background-color .2s,box-shadow .2s}
.navbar.solid{background:rgba(245,245,247,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--line)}
.navbar .mini{position:absolute;left:50%;transform:translate(-50%,4px);font-size:var(--t-body);font-weight:600;opacity:0;transition:opacity .2s,transform .2s var(--ease-out);white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.navbar.solid .mini{opacity:1;transform:translate(-50%,0)}
.navbar .side{min-width:44px;display:flex;align-items:center}
.navbar .side.r{justify-content:flex-end}
.big{font-size:var(--t-display);font-weight:700;letter-spacing:-.03em;margin:0;line-height:1.1;text-wrap:balance}
.sub{color:var(--fg2);font-size:var(--t-small)}
.title-block .sub{display:block;margin-top:var(--gap-sub)}
.title-block{padding:var(--gap-eyebrow) 0 var(--gap-block)}
.icon-btn{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:2px;color:var(--blue);font-size:var(--t-body)}
.text-btn{min-height:44px;display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-size:var(--t-body);font-weight:600;margin-right:-6px;padding:0 6px}
.text-btn:disabled{opacity:.45}
.pill-btn{min-height:36px;background:var(--card);border-radius:999px;padding:6px 14px;font-size:var(--t-small);font-weight:600;color:var(--blue);box-shadow:0 0 0 1px var(--line) inset;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill-btn.primary{background:var(--blue);color:#fff;box-shadow:none}
.pill-btn:disabled{opacity:.45}

.card{background:var(--card);border-radius:var(--r-card);padding:var(--pad-card)}
.stack{display:flex;flex-direction:column;gap:var(--gap-block)}
.regimes{display:flex;gap:var(--gap-sub);flex-wrap:wrap;margin-bottom:var(--gap-block)}
.regime{display:flex;align-items:center;gap:var(--gap-sub);background:var(--card);border-radius:999px;padding:var(--gap-sub) 14px;font-size:var(--t-small)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.list{background:var(--card);border-radius:var(--r-card);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:var(--pad-card);width:100%;text-align:left;min-height:44px}
.row+.row{box-shadow:0 -1px 0 var(--line)}
/* 밀어서 삭제 · 편집 */
.swipe{position:relative;overflow:hidden;background:var(--card)}
.swipe+.swipe::before{content:"";position:absolute;top:0;left:var(--pad-card,18px);right:0;height:1px;background:var(--line);z-index:2;pointer-events:none}
.swipe>.row{background:var(--card);position:relative;z-index:1;transition:transform .35s var(--ease);will-change:transform}
.swipe .act{visibility:hidden;position:absolute;right:0;top:0;bottom:0;min-width:88px;background:var(--sell);color:#fff;font-weight:600;font-size:var(--t-body);display:flex;align-items:center;justify-content:flex-end;padding-right:22px}
.swipe.gone{transition:height .3s var(--ease),opacity .3s}
.minus{width:0;height:24px;flex:none;border-radius:50%;background:var(--sell);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-right:-12px;transform:scale(.4);opacity:0;transition:width .3s var(--ease),margin .3s var(--ease),transform .3s var(--ease),opacity .2s}
.minus::before{content:"";width:11px;height:2.5px;border-radius:2px;background:#fff}
.editing .minus{width:24px;margin-right:0;transform:none;opacity:1}
.editing .px .spark{display:none}
.enter{animation:rowin .5s var(--ease) both}
@keyframes rowin{from{opacity:0;transform:translateY(-10px)}}
.row .main{flex:1;min-width:0} a.row{text-decoration:none;color:inherit}
.row .name{font-size:var(--t-body);font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:nowrap;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .head{flex-wrap:nowrap;min-width:0} .row .head .pill{flex:none} .row .head .act1{font-size:var(--t-detail);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sumline{font-size:var(--t-heading);font-weight:700;margin:0 4px var(--gap-inner)}
.row .tk{font-size:var(--t-small);font-weight:400;color:var(--fg2)}
.row .head{font-size:var(--t-detail);margin-top:var(--gap-text);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .px{text-align:right;flex:none;display:flex;align-items:center;gap:10px}
.row .px b{display:block;font-size:var(--t-body);font-weight:600}
.spark{width:56px;height:28px;flex:none}
.chev{color:var(--fg3);flex:none}
.chg{font-size:var(--t-small);font-weight:600}
.up{color:var(--up)} .down{color:var(--down)}
.tag{display:inline-flex;align-items:center;font-size:var(--t-small);font-weight:600;border-radius:6px;padding:0 7px;line-height:1.45;white-space:nowrap}
.t-buy{background:var(--buy-bg);color:var(--buy)} .t-sell{background:var(--sell-bg);color:var(--sell)}
.t-wait{background:var(--wait-bg);color:var(--wait)} .t-dark{background:var(--fill);color:var(--fg)}
.t-info{background:var(--info-bg);color:var(--info)}
.readout .mk{font-weight:600} .c-info{color:var(--info)}
.c-buy{color:var(--buy)} .c-sell{color:var(--sell)} .c-wait{color:var(--wait)} .c-hold{color:var(--fg)}
.empty{text-align:center;padding:44px 20px;color:var(--fg2)}
.empty{font-size:var(--t-detail)}
.empty b{display:block;color:var(--fg);font-size:var(--t-heading);font-weight:600;line-height:1.3;margin-bottom:var(--gap-sub)}
.sec-title{font-size:var(--t-heading);font-weight:600;line-height:1.3;color:var(--fg);margin:var(--gap-section) var(--pad-card) var(--gap-caption);display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec-title .sub{font-weight:400}

/* 뼈대 (불러오는 동안) */
.sk{background:linear-gradient(90deg,#ECECF0 0%,#F6F6F8 40%,#ECECF0 80%);background-size:200% 100%;animation:sh 1.3s linear infinite;border-radius:8px}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}

/* 아래로 당겨 새로고침 */
.ptr{height:0;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;color:var(--fg2);transition:height .3s var(--ease)}
.ptr .spin{border-color:rgba(0,0,0,.12);border-top-color:var(--fg2)}

.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--line);display:flex;justify-content:center;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20;transition:transform .3s var(--ease)}
.tabbar.away{transform:translateY(110%)}
.tabbar button{flex:1;max-width:160px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--fg3);transition:color .15s}
.tabbar button.on{color:var(--blue)}
.tabbar svg{width:24px;height:24px;transition:transform .2s var(--ease-out)}
.tabbar button:active svg{transform:scale(.88)}

/* 상세 */
.hero .bigpx{font-size:var(--t-title);font-weight:700;line-height:1.25;letter-spacing:-.02em;margin-top:var(--gap-inner);display:flex;align-items:baseline;gap:10px}
.grade{display:flex;align-items:center;gap:14px}


.mkt{display:flex;flex-direction:column;gap:12px}
.mtabs{display:flex;gap:18px;font-size:var(--t-heading);font-weight:700}
.mtabs button{color:var(--fg3);padding:0} .mtabs button.on{color:var(--fg)}
.mh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.mv{font-size:var(--t-title);font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.mv .chg{font-size:var(--t-body);font-weight:600}
.mhl{font-size:var(--t-heading);font-weight:700;line-height:1.35;letter-spacing:-.01em}
.wash{margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--buy-bg);color:var(--buy);display:flex;flex-direction:column;gap:3px}
.fgx{padding:0 0 2px}
.fgx .fgw{background:var(--fill);color:var(--fg)}
.fgbar{position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--down),var(--line) 50%,var(--up));margin-top:2px}
.fgbar i{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--card);border:3px solid var(--fg);box-sizing:border-box}
.fgends{display:flex;justify-content:space-between;font-size:12px;color:var(--fg2);margin-top:6px}
.wash span{color:var(--fg);font-size:var(--t-sub, 13px);line-height:1.45;opacity:.85}
.mread{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--t-body)}
.mbar{display:flex;gap:6px} .mbar i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.mbar i.b-good{background:var(--buy)} .mbar i.b-weak{background:var(--sell)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:12px;box-shadow:0 -1px 0 var(--line)}
.mrow b{font-size:var(--t-body)} .mval{display:flex;align-items:center;gap:8px;font-weight:700;font-size:var(--t-heading);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{font-size:var(--t-small);font-weight:600;padding:3px 9px;border-radius:7px;background:var(--fill);color:var(--fg2)}
.badge.b-good{background:var(--buy-bg);color:var(--buy)} .badge.b-weak{background:var(--sell-bg);color:var(--sell)}
.madv{padding-top:4px}
.act .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:var(--t-small);font-weight:700;padding:3px 10px;border-radius:999px}
.p-buy{background:var(--buy-bg);color:var(--buy)} .p-wait{background:var(--wait-bg);color:var(--wait)} .p-sell{background:var(--sell-bg);color:var(--sell)} .p-hold{background:var(--fill);color:var(--fg)}
.act .ttl{margin-top:10px}
.dist{margin-top:14px}
.dist .track{position:relative;height:8px;border-radius:4px;background:var(--fill)}
.dist .seg-z{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--buy);opacity:.55}
.dist .dot{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--fg);box-shadow:0 0 0 3px var(--card)}
.dist .dl{display:flex;justify-content:space-between;gap:8px;font-size:var(--t-small);color:var(--fg2);margin-top:8px}
.nxt{margin-top:12px;font-size:var(--t-body);line-height:1.45;display:flex;flex-direction:column;gap:2px} .nxt .sub{font-size:var(--t-small)}
.act .exec{font-size:var(--t-small);font-weight:600;color:var(--fg2)}
.ameta{margin-top:10px;font-size:var(--t-small);color:var(--fg2)}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;padding-top:14px;box-shadow:0 -1px 0 var(--line)}
.kv div{display:flex;flex-direction:column;gap:3px;min-width:0}
.kv span{font-size:var(--t-small);color:var(--fg2);white-space:nowrap} .kv small{font-size:12px;color:var(--fg2);white-space:nowrap;font-variant-numeric:tabular-nums} .kv b{font-size:var(--t-body);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-i .nh{flex-wrap:wrap}
.patn{padding:0 10px;margin-top:var(--gap-inner);font-size:var(--t-small);line-height:1.5}
.cset{margin-top:var(--gap-inner);padding:0 10px}
.cset>summary{list-style:none;cursor:pointer;font-size:var(--t-small);color:var(--blue);font-weight:600;padding:6px 0}
.cset>summary::-webkit-details-marker{display:none}
.act .cap,.notes .cap{font-size:var(--t-small);font-weight:600;color:var(--fg2)}
.act .ttl{font-size:var(--t-title);font-weight:700;line-height:1.3;letter-spacing:-.01em}
.act.a-buy .ttl{color:var(--buy)} .act.a-sell .ttl{color:var(--sell)}
.act .dt{font-size:var(--t-body);color:var(--fg2);margin-top:6px}
.act .meta{font-size:var(--t-small);color:var(--fg2);margin-top:var(--gap-sub)}
.note-i{padding:12px 0;display:flex;flex-direction:column;gap:4px;font-size:var(--t-body);line-height:1.5}
.note-i+.note-i{box-shadow:0 -1px 0 var(--line)}
.note-i .nh{display:flex;gap:8px;align-items:center}
.note-i .adv{font-weight:600}
details.more{margin-top:var(--gap-section)}
details.more>summary{list-style:none;cursor:pointer;padding:14px var(--pad-card);color:var(--blue);font-weight:600;font-size:var(--t-body)}
details.more>summary::-webkit-details-marker{display:none}
.grade .badge{flex:none;width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px}
.grade .lbl{font-size:var(--t-title);font-weight:700;letter-spacing:-.02em;line-height:1.25}
.grade .setup{font-size:var(--t-detail);color:var(--fg2);margin-top:var(--gap-sub)}
.b-buy{background:var(--buy-bg)} .b-wait{background:var(--wait-bg)} .b-sell{background:var(--sell-bg)}
.chart{padding:var(--pad-card) var(--gap-sub) var(--pad-card)}
.plot{touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:grab}
.plot:active{cursor:grabbing}
.plot svg{display:block}
.seg{position:relative;display:flex;background:var(--fill);border-radius:10px;padding:3px;margin:0 10px var(--gap-inner)}
.seg button{flex:1;position:relative;z-index:1;min-height:36px;font-size:var(--t-small);font-weight:600;color:var(--fg)}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:0;background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.12);transition:transform .32s var(--ease),width .32s var(--ease),opacity .2s}
.inds{display:flex;gap:var(--gap-sub);flex-wrap:wrap;padding:0 10px;margin-top:var(--gap-inner)}
.chip{min-height:36px;padding:0 14px;border-radius:999px;background:var(--fill);font-size:var(--t-small);font-weight:600;color:var(--fg2);transition:background-color .2s,color .2s,transform .16s var(--ease-out)}
.chip[aria-pressed=true]{background:var(--info-bg);color:var(--info)}
.chart .readout{display:flex;gap:12px;font-size:var(--t-small);color:var(--fg2);padding:0 10px var(--gap-sub);min-height:calc(2 * 1.45 * var(--t-small) + var(--gap-sub));align-content:flex-start;align-items:baseline;flex-wrap:wrap;row-gap:0}
.chart .readout b{color:var(--fg)}
.chart .draw{animation:fade .5s var(--ease-out) both}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--t-small);color:var(--fg2);margin-top:var(--gap-sub);padding:0 10px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.plan{display:grid;grid-template-columns:1fr auto auto;gap:12px 14px;font-variant-numeric:tabular-nums;align-items:baseline}
.plan .k{color:var(--fg)} .plan .v{font-weight:600;text-align:right} .plan .p{font-size:var(--t-small);color:var(--fg2);text-align:right;min-width:56px}
.plan .mode{grid-column:1/-1;font-size:var(--t-small);color:var(--fg2);font-weight:600}
.plan .rr{grid-column:1/-1;box-shadow:0 -1px 0 var(--line);padding-top:12px;display:flex;justify-content:space-between;font-weight:600}
.items{display:flex;flex-direction:column}
.item{display:flex;gap:10px;padding:12px 0;font-size:var(--t-body)}
.item+.item{box-shadow:0 -1px 0 var(--line)}

@keyframes tin{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}

.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;flex:none;display:inline-block}

<script>
"use strict";
/* ───────── 저장 (이 기기에만) ───────── */
const LS = {
  get(k, d=null){ try{ const v = localStorage.getItem(k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const S = { token: LS.get("tok", ""), repo: LS.get("repo", "odh2838-art/timing-agent"),
  tab: "home", detail: null, dash: LS.get("dash"), csv: null, alerts: null, err: "", busy: null, loading: true, dirty: false };
const CSV_PATH = "종목.csv";
const HEAD = ["시장","티커","이름","박스하단","박스상단","저항","1차매수일","1차가격","2차매수일","2차가격","3차매수일","3차가격","조절분상태","조절분매도일","메모"];
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ───────── GitHub ───────── */
const enc = p => p.split("/").map(encodeURIComponent).join("/");
async function gh(path, opt={}){
  const res = await fetch("https://api.github.com/repos/" + S.repo + path, {
    ...opt, cache:"no-store",
    headers:{ "Authorization":"Bearer " + S.token, "X-GitHub-Api-Version":"2022-11-28",
              "Accept": opt.raw ? "application/vnd.github.raw+json" : "application/vnd.github+json",
              ...(opt.body ? {"Content-Type":"application/json"} : {}) }
  });
  if (res.status === 401) throw new Error("토큰이 만료됐거나 잘못됐습니다. 설정에서 새 토큰을 넣어 주세요.");
  if (res.status === 403) throw new Error("토큰 권한이 부족합니다. Contents·Actions 읽기/쓰기를 허용해 주세요.");
  if (res.status === 404) { const e = new Error("없음"); e.nf = true; throw e; }
  if (res.status === 409) throw new Error("다른 곳에서 먼저 바뀌었습니다. 다시 시도해 주세요.");
  if (!res.ok) throw new Error("GitHub 응답 " + res.status);
  if (res.status === 204) return null;
  return opt.raw ? res.text() : res.json();
}
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")), c => c.charCodeAt(0)));
const b64enc = s => { const b = new TextEncoder().encode(s); let x=""; for (let i=0;i<b.length;i+=0x8000) x += String.fromCharCode.apply(null, b.subarray(i,i+0x8000)); return btoa(x); };
async function readJSON(path, d){ try{ return JSON.parse(await gh("/contents/" + enc(path) + "?ref=main", {raw:true})); }catch(e){ if (e.nf) return d; throw e; } }

/* ───────── CSV ───────── */
function parseCSV(t){
  const rows=[]; let row=[], f="", q=false;
  for (let i=0;i<t.length;i++){
    const c=t[i];
    if (q){ if (c==='"'){ if (t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if (c==='"') q=true;
    else if (c===','){ row.push(f); f=""; }
    else if (c==='\n' || c==='\r'){ if (c==='\r' && t[i+1]==='\n') i++; row.push(f); f=""; if (row.some(x=>x!=="")) rows.push(row); row=[]; }
    else f+=c;
  }
  row.push(f); if (row.some(x=>x!=="")) rows.push(row);
  return rows;
}
const cell = v => /[",\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
const csvText = (head, rows) => [head, ...rows.map(r => head.map(h => r[h] ?? ""))].map(r => r.map(x => cell(String(x))).join(",")).join("\n") + "\n";
async function loadCSV(){
  const j = await gh("/contents/" + enc(CSV_PATH) + "?ref=main");
  let txt = b64dec(j.content); const bom = txt.charCodeAt(0) === 0xFEFF; if (bom) txt = txt.slice(1);
  const rows = parseCSV(txt); const head = rows.shift() || HEAD;
  S.csv = { sha:j.sha, bom, head, rows: rows.map(r => Object.fromEntries(head.map((h,i)=>[h, (r[i]??"").trim()]))) };
  return S.csv;
}
async function saveCSV(msg){
  const c = S.csv; const txt = (c.bom ? "﻿" : "") + csvText(c.head, c.rows);
  const r = await gh("/contents/" + enc(CSV_PATH), { method:"PUT", body: JSON.stringify({ message: msg, content: b64enc(txt), sha: c.sha, branch:"main" }) });
  c.sha = r.content.sha;
}
const symOf = (mk, tk) => mk === "코스피" ? tk + ".KS" : mk === "코스닥" ? tk + ".KQ" : tk;

/* ───────── 점검 실행 ───────── */
async function dispatch(cmd, symbol){
  const since = Date.now() - 5000;
  await gh("/actions/workflows/agent.yml/dispatches", { method:"POST", body: JSON.stringify({ ref:"main", inputs: symbol ? {cmd, symbol} : {cmd} }) });
  return since;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function waitRun(since, label){
  S.busy = label; toast(label + " · 보통 2–3분", true); syncBusy();
  let id = null;
  for (let i=0;i<60;i++){
    await sleep(i < 3 ? 4000 : 8000);
    try{
      const j = await gh("/actions/runs?event=workflow_dispatch&per_page=5");
      const run = id ? j.workflow_runs.find(r => r.id === id) : j.workflow_runs.find(r => Date.parse(r.created_at) >= since);
      if (!run) continue;
      id = run.id;
      if (run.status === "completed"){
        S.busy = null; syncBusy();
        if (run.conclusion === "success"){ await refresh(); toast("점검을 마쳤습니다"); }
        else toast("점검이 실패했습니다. 설정 → GitHub 실행 기록에서 확인해 주세요.");
        return;
      }
    }catch(e){}
  }
  S.busy = null; syncBusy(); toast("아직 진행 중입니다. 잠시 뒤 당겨서 새로고침해 주세요.");
}
function syncBusy(){ document.querySelectorAll("[data-busy]").forEach(b => b.disabled = !!S.busy); }

/* ───────── 데이터 ───────── */
async function refresh(){
  S.err = "";
  try{
    const [d] = await Promise.all([readJSON("상태/대시보드.json", {stocks:{}, regimes:{}}), loadCSV()]);
    S.dash = d; S.alerts = null; LS.set("dash", d);
  }catch(e){ S.err = e.message; }
  S.loading = false;
  if (!S.dirty) render("none");   // 입력 중이면 화면을 덮어쓰지 않는다
}
async function catalog(){
  const c = LS.get("catalog");
  if (c && Date.now() - c.t < 7*864e5) return c.rows;
  const rows = await readJSON("상태/종목사전.json", []);
  if (rows.length) LS.set("catalog", {t:Date.now(), rows});
  return rows;
}
const ALIAS = {"엔비디아":"NVDA","애플":"AAPL","테슬라":"TSLA","마이크로소프트":"MSFT","마소":"MSFT","아마존":"AMZN","알파벳":"GOOGL","구글":"GOOGL","메타":"META","페이스북":"META","넷플릭스":"NFLX","브로드컴":"AVGO","에이엠디":"AMD","팔란티어":"PLTR","티에스엠씨":"TSM","대만반도체":"TSM","코스트코":"COST","일라이릴리":"LLY","릴리":"LLY","노보노디스크":"NVO","버크셔":"BRK-B","제이피모건":"JPM","비자":"V","마스터카드":"MA","월마트":"WMT","오라클":"ORCL","어도비":"ADBE","세일즈포스":"CRM","인텔":"INTC","퀄컴":"QCOM","마이크론":"MU","에이에스엠엘":"ASML","슈퍼마이크로":"SMCI","코인베이스":"COIN","스타벅스":"SBUX","나이키":"NKE","디즈니":"DIS","코카콜라":"KO","펩시":"PEP","맥도날드":"MCD","아이온큐":"IONQ","로켓랩":"RKLB","유니티":"U","쇼피파이":"SHOP","우버":"UBER","에어비앤비":"ABNB","로빈후드":"HOOD","소파이":"SOFI","리비안":"RIVN","루시드":"LCID","크라우드스트라이크":"CRWD","스노우플레이크":"SNOW","팔로알토":"PANW","암":"ARM","델":"DELL","아이비엠":"IBM","시스코":"CSCO","보잉":"BA","캐터필러":"CAT","엑슨모빌":"XOM","셰브론":"CVX","화이자":"PFE","모더나":"MRNA","존슨앤존슨":"JNJ","유나이티드헬스":"UNH","버티브":"VRT","비스트라":"VST","컨스텔레이션":"CEG","마이크로스트래티지":"MSTR","스트래티지":"MSTR","앱러빈":"APP","써클":"CRCL"};

/* ───────── 공통 ───────── */
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isKR = m => m === "코스피" || m === "코스닥";
const num = (v, mk) => v == null || isNaN(v) ? "-" : (isKR(mk) ? Math.round(v).toLocaleString("ko-KR") : (+v).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2}));
const pct = v => v == null || isNaN(v) ? "-" : (v > 0 ? "+" : "") + v.toFixed(1) + "%";
const strip = s => String(s).replace(/\*\*/g, "");
const TONE_DOT = {buy:"var(--buy)", sell:"var(--sell)", wait:"var(--wait)", hold:"var(--fg3)"};
const REG_DOT = {"양호":"var(--buy)", "보통":"var(--wait)", "약세":"var(--sell)"};
const GRADE_ICON = {"진입 좋음":"🎯", "진입 보통":"👀", "진입 대기":"⏳", "진입 나쁨":"✋"};
const CHEV = `<svg class="chev" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>`;

/* 화면 그리기: how = push | pop | fade | none */
function render(how = "fade"){
  const tb = document.getElementById("tabbar");
  tb.hidden = !S.token;
  tb.classList.toggle("away", !!S.detail);
  document.querySelectorAll(".tabbar button").forEach(b => b.classList.toggle("on", b.dataset.tab === S.tab));
  const keep = how === "none" ? scrollY : 0;
  const slide = (how === "push" || how === "pop") && !REDUCED;
  const ghost = slide ? snapshot() : null;
  if (!S.token) renderSetup();
  else if (S.detail) renderDetail(S.detail);
  else if (S.tab === "alerts") renderAlerts();
  else if (S.tab === "settings") renderSettings();
  else renderHome();
  $app.classList.remove("v-push","v-pop","v-fade");
  if (how === "fade" && !REDUCED){ void $app.offsetWidth; $app.classList.add("v-fade"); }
  if (how === "none") scrollTo(0, keep); else if (how === "pop") scrollTo(0, S.listY || 0); else scrollTo(0, 0);
  bindNavbar();
  if (ghost) slidePages(how, ghost);
}
/* 지금 화면을 통째로 떼어 고정 (전환하는 동안 뒤/앞 화면 역할).
   복사하지 않고 옮기므로 손가락이 닿아 있던 요소도 그대로 살아 있다. */
function snapshot(){
  const g = document.createElement("div"); g.className = "ghost"; g.setAttribute("aria-hidden", "true");
  g.style.top = $app.getBoundingClientRect().top + "px";
  while ($app.firstChild) g.appendChild($app.firstChild);
  document.body.appendChild(g); return g;
}
const PAGE_MS = 500, PAGE_EASE = "cubic-bezier(.32,.72,0,1)";
function slidePages(how, ghost, from = 0){
  const shade = document.createElement("div"); shade.className = "shade"; document.body.appendChild(shade);
  const W = innerWidth, o = { duration: PAGE_MS * (1 - from), easing: PAGE_EASE, fill: "forwards" };
  let anims;
  if (how === "push"){   // 새 화면이 위로 덮으며 들어옴
    $app.classList.add("over");
    anims = [ $app.animate([{transform:`translateX(${W}px)`}, {transform:"none"}], o),
              ghost.animate([{transform:"none"}, {transform:`translateX(${-W*.3}px)`}], o),
              shade.animate([{opacity:0}, {opacity:1}], o) ];
  } else {               // 앞 화면이 오른쪽으로 빠지고 뒤 화면이 돌아옴
    ghost.classList.add("top");
    anims = [ ghost.animate([{transform:`translateX(${W*from}px)`}, {transform:`translateX(${W}px)`}], o),
              $app.animate([{transform:`translateX(${-W*.3*(1-from)}px)`}, {transform:"none"}], o),
              shade.animate([{opacity:1-from}, {opacity:0}], o) ];
  }
  Promise.all(anims.map(a => a.finished)).then(() => { anims.forEach(a => a.cancel()); ghost.remove(); shade.remove(); $app.classList.remove("over"); });
}
function go(how, fn){ if (how === "push") S.listY = scrollY; S.dirty = false; fn(); render(how); }

/* 큰 제목이 지나가면 위쪽 바를 불투명하게 */
let navObs;
function bindNavbar(){
  navObs?.disconnect();
  const bar = $app.querySelector(".navbar"), anchor = $app.querySelector("[data-anchor]");
  if (!bar || !anchor) return;
  navObs = new IntersectionObserver(([e]) => bar.classList.toggle("solid", !e.isIntersecting), {rootMargin:"-52px 0px 0px 0px"});
  navObs.observe(anchor);
}

function stockList(){
  const st = S.dash?.stocks || {};
  const ord = {buy:0, sell:1, wait:2, hold:3};
  const near = d => { const z = (d?.zones || []).find(z => z.label !== "지지" && z.state === "above"); return z ? Math.abs(z.dist) : 99; };

function spark(bars, chg){
  const c = (bars||[]).slice(-40).map(b => b[4]); if (c.length < 2) return "";
  const lo = Math.min(...c), hi = Math.max(...c), w=56, h=28;
  const p = c.map((v,i) => (i/(c.length-1)*w).toFixed(1) + "," + (h-2-(v-lo)/((hi-lo)||1)*(h-4)).toFixed(1)).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${p}" fill="none" stroke="${c[c.length-1]>=c[0]?"#F04452":"#3182F6"}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
/* 목록용 짧은 할 일: '대기 · 148.18 오면 1차 40% 매수' → '148.18 오면 1차 40% · −2.6%' */
const shortAct = a => {
  const t = a.title || "", m = t.match(/^대기 · ([\d,.]+) 오면/);
  if (m) return /^지금보다/.test(a.detail || "") ? `${m[1]}까지 ${a.detail.replace("지금보다 ", "").replace(/^([+-]?\d{2,})\.\d%$/, "$1%")}` : `${m[1]} 오면 매수`;

  if (w) return `이번 주 ${w[1]} 위면 매수`;
  return t.replace(/ 매수/, "").replace(/ \(절반만\)/, " 절반");
};

/* 종목 줄: 왼쪽으로 밀면 삭제 버튼, 끝까지 밀면 바로 삭제 */
let openRow = null;
function closeSwipes(except){ $app.querySelectorAll(".swipe>.row").forEach(r => { if (r !== except){ r.style.transform = ""; const a = r.parentElement.querySelector(".act"); a.style.width = ""; clearTimeout(a._h); a._h = setTimeout(() => a.style.visibility = "", 360); } }); if (!except) openRow = null; }
function bindSwipes(list){
  $app.querySelectorAll(".swipe").forEach(sw => {
    const row = sw.querySelector(".row"), act = sw.querySelector(".act"), sym = sw.dataset.sym;
    let x0 = null, y0 = 0, base = 0, dx = 0, dir = null, swiped = 0;
    const set = (t, anim) => { row.style.transition = anim ? "" : "none"; act.style.transition = anim ? "width .35s var(--ease)" : "none"; row.style.transform = t ? `translateX(${t}px)` : ""; act.style.width = Math.max(88, -t) + "px";
      clearTimeout(act._h); if (t) act.style.visibility = "visible"; else act._h = setTimeout(() => act.style.visibility = "", anim ? 360 : 0); };
    sw.addEventListener("touchstart", e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; dx = 0; dir = null; base = openRow === row ? -88 : 0; }, {passive:true});
    sw.addEventListener("touchmove", e => {
      if (x0 == null) return; const t = e.touches[0]; dx = t.clientX - x0;
      if (!dir){ if (Math.abs(dx) < 8 && Math.abs(t.clientY - y0) < 8) return; dir = Math.abs(dx) > Math.abs(t.clientY - y0) ? "h" : "v"; if (dir === "h") closeSwipes(row); }
      if (dir !== "h") return;
      e.preventDefault(); const W = sw.clientWidth; let tx = Math.min(0, base + dx); if (tx < -W) tx = -W;
      set(tx < 0 ? tx : 0, false);
    }, {passive:false});
    sw.addEventListener("touchend", () => {
      if (dir !== "h"){ x0 = null; return; }
      x0 = null; swiped = Date.now(); const W = sw.clientWidth, tx = Math.min(0, base + dx);
      if (-tx > W * 0.55) removeRow(sw, sym);                     // 끝까지 밀었으면 바로 삭제
      else if (-tx > 44){ set(-88, true); openRow = row; }         // 버튼이 보이게 멈춤
      else { set(0, true); if (openRow === row) openRow = null; }
    });
    row.addEventListener("click", e => {
      if (Date.now() - swiped < 400) return;                     // 방금 민 손가락이 만든 탭은 무시
      if (e.target.closest(".minus")){ e.stopPropagation(); closeSwipes(row); set(-88, true); openRow = row; return; }
      if (openRow){ e.preventDefault(); closeSwipes(); return; }  // 열린 줄이 있으면 닫기만
      go("push", () => S.detail = sym);
    });
    row.addEventListener("keydown", e => { if (e.key === "Enter") row.click(); });
    act.onclick = () => removeRow(sw, sym);
  });
}
/* 줄이 왼쪽으로 빠지고 접히듯 사라진 뒤, 실제 삭제는 뒤에서 */
function removeRow(sw, sym){
  const row = sw.querySelector(".row"), h = sw.offsetHeight;
  row.style.transition = REDUCED ? "none" : ""; row.style.transform = `translateX(-100%)`;
  sw.querySelector(".act").style.width = "100%";
  sw.style.height = h + "px"; sw.classList.add("gone");
  requestAnimationFrame(() => requestAnimationFrame(() => { sw.style.height = "0px"; sw.style.opacity = "0"; }));
  setTimeout(() => sw.remove(), REDUCED ? 0 : 320);
  openRow = null;
  removeStock(sym).catch(e => { toast(e.message); refresh(); });
}
async function removeStock(sym){
  await loadCSV(); const gone = S.csv.rows.find(v => symOf(v["시장"], v["티커"]) === sym);
  const name = S.dash?.stocks?.[sym]?.name || gone?.["이름"] || sym;
  S.csv.rows = S.csv.rows.filter(v => symOf(v["시장"], v["티커"]) !== sym);
  await saveCSV(`앱: ${name} 삭제`);
  if (gone){ const bin = LS.get("removed", {}); bin[sym] = gone; LS.set("removed", bin); }
  if (S.dash?.stocks) delete S.dash.stocks[sym];
  toast(name + " 삭제 · 다시 추가하면 기록도 돌아와요");
}

/* ───────── 차트: 기간 · 끌어서 이동 · 벌려서 확대 · 길게 눌러 가격 · 보조지표 ─────────
   bars: [날짜, 시, 고, 저, 종, 50일선, 200일선, 거래량]  (EMA·볼린저·일목·RSI는 여기서 계산) */
const PERIODS = [["1개월",22],["3개월",66],["6개월",130],["1년",250],["2년",500]];
const AUX = new Set(["TP1","TP2","분할청산 · 14선","분할청산 · 21선","최종 청산 @SR","상승 모멘텀 종료","하락 모멘텀 종료","W 바닥 돌파","갭 발생","모멘텀 BUY","PEG 발생","PEG 되돌림 매수","PEG 재돌파"]);   // 검증에서 평소와 같았던 표시는 기본으로 숨김
const easy = w => String(w).replace(/(\d+)일선/g, "$1일 평균선").replace("돌파 자리", "돌파선");
const isAux = t => AUX.has(t) || t.includes("삼각형") || t.includes("쐐기");
const IND_LIST = [["ma","이평선"],["ch","20일 채널"],["ich","일목"],["vol","거래량"],["pat","청산·패턴"]];   // 지표견이 쓰는 도구만
const IND = Object.assign({ma:true, ch:false, ich:false, vol:true, pat:false}, LS.get("ind", {})); IND.bb = false; IND.rsi = false;
const COL = {up:"#F04452", down:"#3182F6", e21:"#FF9F0A", s50:"#30B566", s200:"#8E5CF6", bb:"#1B64DA", grid:"#E5E5EA", axis:"#8E8E93"};

function calcInd(bars){
  const n = bars.length, c = bars.map(b => b[4]), h = bars.map(b => b[2]), l = bars.map(b => b[3]);
  const ema = (k) => { const a = 2/(k+1), o = []; let e = null; c.forEach((v,i) => { e = e == null ? v : v*a + e*(1-a); o.push(i >= k-1 ? e : null); }); return o; };
  const sma = (k) => { const o = []; let s = 0; c.forEach((v,i) => { s += v; if (i >= k) s -= c[i-k]; o.push(i >= k-1 ? s/k : null); }); return o; };
  const mid = (k, i) => { if (i < k-1) return null; let H = -Infinity, L = Infinity; for (let j = i-k+1; j <= i; j++){ H = Math.max(H, h[j]); L = Math.min(L, l[j]); } return (H+L)/2; };
  const m20 = sma(20), bbU = [], bbL = [];
  c.forEach((v,i) => { if (m20[i] == null){ bbU.push(null); bbL.push(null); return; } let q = 0; for (let j = i-19; j <= i; j++) q += (c[j]-m20[i])**2; const sd = Math.sqrt(q/20); bbU.push(m20[i]+2*sd); bbL.push(m20[i]-2*sd); });
  const ten = c.map((_,i) => mid(9,i)), kij = c.map((_,i) => mid(26,i)), sB = c.map((_,i) => mid(52,i));
  const D = 25;   // 선행 스팬: 현재 봉을 1로 세어 26번째 = 25칸 앞 (일목 표준, 트레이딩뷰와 같음)
  const spanA = c.map((_,i) => i >= D && ten[i-D] != null && kij[i-D] != null ? (ten[i-D]+kij[i-D])/2 : null);
  const spanB = c.map((_,i) => i >= D ? sB[i-D] : null);
  const rsi = []; let ag = 0, al = 0;
  c.forEach((v,i) => { if (i === 0){ rsi.push(null); return; } const d = v - c[i-1], g = Math.max(d,0), lo = Math.max(-d,0);
    if (i <= 14){ ag += g/14; al += lo/14; rsi.push(i === 14 ? 100 - 100/(1 + ag/(al||1e-9)) : null); }
    else { ag = (ag*13 + g)/14; al = (al*13 + lo)/14; rsi.push(100 - 100/(1 + ag/(al||1e-9))); } });
  const chU = h.map((_,i) => i >= 20 ? Math.max(...h.slice(i-20, i)) : null), chL = l.map((_,i) => i >= 20 ? Math.min(...l.slice(i-20, i)) : null);   // 어제까지 20일 채널
  const nh = h.map((v,i) => i >= 60 && v >= Math.max(...h.slice(i-60, i)));   // 60일 신고가 (지표견 차트의 빨간 점)
  return { e21: ema(21), s50: bars.map(b => b[5]), s200: bars.map(b => b[6]), m20, bbU, bbL, spanA, spanB, rsi, chU, chL, nh };
}

function mountChart(box, s){
  const bars = s.bars || [], N = bars.length;
  if (N < 10){ box.innerHTML = `<div class="empty">차트 자료가 없습니다</div>`; return; }
  const hasVol = bars.some(b => b[7] != null);
  const ind = calcInd(bars), idx = {}; bars.forEach((b,i) => idx[b[0]] = i);
  const pdef = Math.min(N, (PERIODS.find(p => p[0] === LS.get("period")) || PERIODS[1])[1]);
  const V = { n: pdef, end: N - 1 };
  box.innerHTML = `
    <div class="seg" role="tablist" aria-label="기간">${PERIODS.filter(p => p[1] <= N + 10).map(([t,k]) => `<button role="tab" data-k="${Math.min(k,N)}">${t}</button>`).join("")}<span class="thumb"></span></div>
    <div class="readout" aria-live="polite"></div>
    <div class="plot"></div>
    ${s.pattern ? `<div class="patn"><b>${esc(s.pattern.lines[0].replace("모양 · ", ""))}</b> <span class="sub">${s.pattern.grade === "정식" ? "" : "· 참고(" + esc(s.pattern.reasons.join(", ")) + ")"}</span><div class="sub">패턴 돌파는 10번 중 6번 다시 안으로 → 참고만</div></div>` : ""}
    <details class="cset"><summary class="press">선·표시 설정</summary>
    <div class="inds" style="padding:0">${IND_LIST.filter(([k]) => k !== "vol" || hasVol).map(([k,t]) => `<button class="chip press" data-ind="${k}" aria-pressed="${!!IND[k]}">${t}</button>`).join("")}</div>
    <div class="legend" style="padding:0"></div></details>`;
  const $plot = box.querySelector(".plot"), $read = box.querySelector(".readout"), $seg = box.querySelector(".seg"), $leg = box.querySelector(".legend");
  const hint = "▲▼ 길게 눌러 확인";
  let cross = null, geo = null;

  const segSync = (animate = true) => {
    const btns = [...$seg.querySelectorAll("button")], k = Math.round(V.n);
    const on = btns.find(b => +b.dataset.k === k && Math.round(V.end) === N - 1);
    btns.forEach(b => b.setAttribute("aria-selected", b === on));
    const th = $seg.querySelector(".thumb");
    if (!on){ th.style.opacity = 0; return; }
    th.style.transition = animate && !REDUCED ? "" : "none";
    th.style.opacity = 1; th.style.width = on.offsetWidth + "px"; th.style.transform = `translateX(${on.offsetLeft - 3}px)`;
  };
  const legend = () => {
    const it = [];
    if (IND.ma) it.push(["21일 평균선", COL.e21], ["50일 평균선", COL.s50], ["200일 평균선", COL.s200]);
    if (IND.ch) it.push(["20일 채널", COL.bb]);
    if (IND.ich) it.push(["일목 구름", "#30B566"]);
    it.push(["매수 구간", "rgba(27,138,74,.35)"]);
    if (s.sr_line) it.push(["SR 손절선", "#8B5E3C"]);
    if (s.wall) it.push(["위쪽 벽", "#D22F3C"]);
    $leg.innerHTML = it.map(([t,c]) => `<span><i style="background:${c}"></i>${t}</span>`).join("");
  };
  const clamp = () => { V.n = Math.max(15, Math.min(N, V.n)); V.end = Math.max(V.n - 1, Math.min(N - 1, V.end)); };

  function draw(){
    clamp();
    const W = Math.max(280, Math.round($plot.clientWidth || 320)), L = 2, R = isKR(s.market) ? 76 : 62;
    const H0 = Math.round(W * 0.78), HV = IND.vol && hasVol ? 64 : 0, HR = IND.rsi ? 76 : 0, AX = 24, T = 28;
    const H = H0 + HV + HR + AX, cw = (W - L - R) / V.n, start = V.end - V.n + 1;
    const i0 = Math.max(0, Math.floor(start)), i1 = Math.min(N - 1, Math.ceil(V.end));
    const x = i => L + (i - start + 0.5) * cw;
    let lo = Infinity, hi = -Infinity;
    for (let i = i0; i <= i1; i++){ lo = Math.min(lo, bars[i][3]); hi = Math.max(hi, bars[i][2]);
      if (IND.bb && ind.bbU[i] != null){ lo = Math.min(lo, ind.bbL[i]); hi = Math.max(hi, ind.bbU[i]); } }
    const zones = (s.zones || []).filter(z => z.label !== "지지");
    [s.wall?.v, ...zones.flatMap(z => [z.lo, z.hi])].forEach(v => { if (v != null && v > lo * 0.94 && v < hi * 1.05){ lo = Math.min(lo, v); hi = Math.max(hi, v); } });
    const pad = (hi - lo) * 0.07; lo -= pad; hi += pad;
    const y = v => T + (hi - v) / (hi - lo) * (H0 - T - 6);
    let g = `<defs><clipPath id="cp"><rect x="${L}" y="0" width="${W - L - R}" height="${H}"/></clipPath></defs>`;
    const lastY = y(s.price ?? bars[N-1][4]), zt = (s.zones || []).find(z => z.label !== "지지" && z.state === "above"), ztY = zt ? y(zt.hi) : -999;
    for (let k = 0; k <= 3; k++){ const v = lo + (hi - lo) * (k + .5) / 4; if (Math.abs(y(v) - lastY) < 16 || Math.abs(y(v) - ztY) < 16) continue; g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${COL.grid}" stroke-width=".6"/><text x="${W-R+6}" y="${y(v)+4}" font-size="13" fill="${COL.axis}">${num(v, s.market)}</text>`; }
    let p = `<g clip-path="url(#cp)">`;
    zones.forEach(z => { if (z.hi >= lo && z.lo <= hi) p += `<rect x="${L}" y="${y(z.hi)}" width="${W-L-R}" height="${Math.max(2, y(z.lo) - y(z.hi))}" fill="#1B8A4A" opacity=".12"/>`; });
    const path = (arr, col, w = 1.5, dash = "") => { let d = ""; for (let i = Math.max(0, i0 - 1); i <= Math.min(N - 1, i1 + 1); i++){ if (arr[i] == null){ continue; } d += (d ? "L" : "M") + x(i).toFixed(1) + " " + y(arr[i]).toFixed(1); } return d ? `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" ${dash ? `stroke-dasharray="${dash}"` : ""}/>` : ""; };
    if (IND.ich){
      for (let i = Math.max(1, i0); i <= i1; i++){ const a0 = ind.spanA[i-1], b0 = ind.spanB[i-1], a1 = ind.spanA[i], b1 = ind.spanB[i]; if ([a0,b0,a1,b1].some(v => v == null)) continue;
        p += `<path d="M${x(i-1)} ${y(a0)}L${x(i)} ${y(a1)}L${x(i)} ${y(b1)}L${x(i-1)} ${y(b0)}Z" fill="${a1 >= b1 ? "#30B566" : "#F04452"}" opacity=".1"/>`; }
    }
    if (IND.bb){
      let up = "", dn = ""; for (let i = i0; i <= i1; i++){ if (ind.bbU[i] == null) continue; up += (up ? "L" : "M") + x(i) + " " + y(ind.bbU[i]); dn = "L" + x(i) + " " + y(ind.bbL[i]) + dn; }
      if (up) p += `<path d="${up}${dn.replace(/^L/, "L")}Z" fill="${COL.bb}" opacity=".06"/>` + path(ind.bbU, COL.bb, 1) + path(ind.bbL, COL.bb, 1) + path(ind.m20, COL.bb, 1, "3 3");
    }
    if (IND.ch) p += path(ind.chU, "#1B64DA", 1, "4 3") + path(ind.chL, "#1B64DA", 1, "4 3");
    if (IND.pat && s.pattern){   // 진행 중인 패턴: 인식할 때 고정한 위·아래 선
      const pl_ = pts => pts.filter(q => q[0] in idx).map(q => `${x(idx[q[0]])},${y(q[1])}`).join(" ");
      [s.pattern.upper, s.pattern.lower].forEach(ln => { const ps = pl_(ln || []); if (ps.split(" ").length === 2) p += `<polyline points="${ps}" fill="none" stroke="#8E5CF6" stroke-width="1.2" stroke-dasharray="${s.pattern.grade === "정식" ? "0" : "4 3"}" opacity=".8"/>`; });
    }
    if (s.wall?.v) p += `<line x1="${L}" x2="${W-R}" y1="${y(s.wall.v)}" y2="${y(s.wall.v)}" stroke="#D22F3C" stroke-width=".9" stroke-dasharray="4 3"/>`;
    if (s.vcp?.vcp && s.vcp.pivot) p += `<line x1="${L}" x2="${W-R}" y1="${y(s.vcp.pivot)}" y2="${y(s.vcp.pivot)}" stroke="#1B64DA" stroke-width=".9" stroke-dasharray="2 3"/>`;
    if (IND.ma) p += path(ind.s200, COL.s200, 2) + path(ind.s50, COL.s50, 1.6) + path(ind.e21, COL.e21, 1.4);
    if (s.sr_line){   // 트레일링 스탑(SR): 보유 중일 때만, 계단선
      let d = ""; for (let i = i0; i <= i1; i++){ const v = s.sr_line[i]; if (v == null) continue; const X = x(i) - cw/2, Y = y(v); d += (d ? `L${X} ${Y}` : `M${X} ${Y}`) + `L${X + cw} ${Y}`; }
      if (d) p += `<path d="${d}" fill="none" stroke="#8B5E3C" stroke-width="1.3"/>`;
    }
    const bw = Math.max(1, cw * 0.7);
    for (let i = i0; i <= i1; i++){ const b = bars[i], col = b[4] >= b[1] ? COL.up : COL.down, top = y(Math.max(b[1], b[4])), bh = Math.max(1, Math.abs(y(b[1]) - y(b[4])));
      p += `<line x1="${x(i)}" x2="${x(i)}" y1="${y(b[2])}" y2="${y(b[3])}" stroke="${col}" stroke-width="${cw > 6 ? 1 : .8}"/><rect x="${x(i) - bw/2}" y="${top}" width="${bw}" height="${bh}" fill="${col}"${s.live && i === N - 1 ? ' opacity=".5"' : ""}/>`; }
    for (let i = i0; i <= i1; i++) if (ind.nh[i]) p += `<circle cx="${x(i)}" cy="${y(bars[i][2]) - 5}" r="1.8" fill="${COL.up}" opacity=".8"/>`;
    zones.forEach(z => { if (z.lo <= hi && z.lo >= lo) p += `<text x="${L+6}" y="${Math.min(H0-8, y(z.lo) + 16)}" font-size="13" font-weight="600" fill="#1B8A4A" stroke="#fff" stroke-width="3" paint-order="stroke">${esc(z.label)} 구간</text>`; });
    /* 신호 말풍선 (보이는 것 중 최근 6개, 겹치지 않게) */
    const C = {buy:["#E8F7EE","#1B8A4A"], sell:["#FDEBEC","#D22F3C"], info:["#EAF2FE","#1B64DA"]}, boxes = [];
    const hit = a => boxes.some(b => a.x < b.x + b.w + 4 && b.x < a.x + a.w + 4 && a.y < b.y + b.h + 3 && b.y < a.y + a.h + 3);
    const chip = (i, text, tone, below) => {
      const [bg, fg] = C[tone] || C.info, w = text.length * 12 + 12, hh = 20, cx = Math.max(L + w/2, Math.min(W - R - w/2 - 2, x(i)));
      let by = below ? y(bars[i][3]) + 16 : y(bars[i][2]) - 16 - hh;
      for (let k = 0; k < 8 && hit({x:cx - w/2, y:by, w, h:hh}); k++) by += below ? hh + 4 : -(hh + 4);
      by = Math.max(2, Math.min(H0 - hh - 2, by));
      if (hit({x:cx - w/2, y:by, w, h:hh})) return;   // 자리가 없으면 겹쳐 그리지 않고 건너뜀
      boxes.push({x:cx - w/2, y:by, w, h:hh});
      p += `<line x1="${x(i)}" x2="${x(i)}" y1="${below ? y(bars[i][3]) + 1 : y(bars[i][2]) - 1}" y2="${below ? by : by + hh}" stroke="${fg}" stroke-width=".8" opacity=".5"/><rect x="${cx - w/2}" y="${by}" width="${w}" height="${hh}" rx="6" fill="${bg}"/><text x="${cx}" y="${by + 14.5}" font-size="12" font-weight="600" fill="${fg}" text-anchor="middle">${esc(text)}</text>`;
    };
    {  // 차트를 가리지 않게: 표시는 봉 위아래 작은 점(▲ 매수 쪽, ▼ 주의 쪽), 글자는 가장 최근 2개만. 날짜를 짚으면 그날 표시가 위에 나옴
      const vis = (s.marks || []).filter(m => m[0] in idx && idx[m[0]] >= i0 && idx[m[0]] <= i1 && (IND.pat || !isAux(m[1])));
      const stack = {};
      vis.forEach(m => { const i = idx[m[0]], [, fg] = C[m[2]] || C.info, up = m[2] === "sell", k = i + (up ? "u" : "d"), o = (stack[k] = (stack[k] || 0) + 1) - 1;
        const yy = up ? y(bars[i][2]) - 7 - o * 8 : y(bars[i][3]) + 7 + o * 8, r_ = Math.max(2.4, Math.min(4, cw * 0.35));
        p += up ? `<path d="M${x(i) - r_} ${yy - r_} L${x(i) + r_} ${yy - r_} L${x(i)} ${yy + r_ * .6}Z" fill="${fg}"/>` : `<path d="M${x(i) - r_} ${yy + r_} L${x(i) + r_} ${yy + r_} L${x(i)} ${yy - r_ * .6}Z" fill="${fg}"/>`; });
      vis.slice(-1).forEach(m => chip(idx[m[0]], m[1], m[2], m[2] !== "sell"));   // 글자는 가장 최근 1개만
    }
    if (s.vcp?.vcp && i1 === N - 1 && !(s.marks || []).some(m => m[1] === "VCP 형성" && idx[m[0]] >= N - 15)) chip(N - 1, "VCP 형성", "info", false);
    p += `</g>`;
    g += p;
    const last = s.price ?? bars[N-1][4], lc = (s.chg ?? 0) >= 0 ? COL.up : COL.down;
    if (last >= lo && last <= hi) g += `<line x1="${L}" x2="${W-R}" y1="${y(last)}" y2="${y(last)}" stroke="${lc}" stroke-width=".6" opacity=".5"/><rect x="${W-R+2}" y="${y(last)-11}" width="${R-2}" height="22" rx="6" fill="${lc}"/><text x="${W-R+7}" y="${y(last)+5}" font-size="13" font-weight="600" fill="#fff">${num(last, s.market)}</text>`;
    { const z = (s.zones || []).find(z => z.label !== "지지" && z.state === "above");   // 다음 살 가격: 오른쪽에 초록 꼬리표
      if (z && z.hi >= lo && z.hi <= hi && Math.abs(y(z.hi) - y(last)) > 24) g += `<line x1="${L}" x2="${W-R}" y1="${y(z.hi)}" y2="${y(z.hi)}" stroke="#1B8A4A" stroke-width=".8" stroke-dasharray="3 3"/><rect x="${W-R+2}" y="${y(z.hi)-11}" width="${R-2}" height="22" rx="6" fill="#1B8A4A"/><text x="${W-R+7}" y="${y(z.hi)+5}" font-size="13" font-weight="600" fill="#fff">${num(z.hi, s.market)}</text>`; }
    /* 거래량 */
    let yo = H0;
    if (HV){ let vm = 0; for (let i = i0; i <= i1; i++) vm = Math.max(vm, bars[i][7] || 0);
      g += `<line x1="${L}" x2="${W-R}" y1="${yo}" y2="${yo}" stroke="${COL.grid}"/><text x="${W-R+6}" y="${yo+18}" font-size="13" fill="${COL.axis}">거래량</text><g clip-path="url(#cp)">`;
      for (let i = i0; i <= i1; i++){ const v = bars[i][7] || 0, hh = vm ? v / vm * (HV - 10) : 0; g += `<rect x="${x(i) - bw/2}" y="${yo + HV - hh}" width="${bw}" height="${hh}" fill="${bars[i][4] >= bars[i][1] ? COL.up : COL.down}" opacity=".45"/>`; }
      g += `</g>`; yo += HV; }
    if (HR){ const ry = v => yo + 8 + (100 - v) / 100 * (HR - 14);

    /* 날짜 */
    const span = i1 - i0, fmt = i => { const d = bars[i][0]; return span > 200 ? `${d.slice(2,4)}.${+d.slice(5,7)}` : `${+d.slice(5,7)}/${+d.slice(8)}`; };
    [[i0, "start", Math.max(L, x(i0))], [Math.round((i0 + i1) / 2), "middle", x(Math.round((i0 + i1) / 2))], [i1, "end", Math.min(W - R, x(i1))]].forEach(([i, a, xx]) => g += `<text x="${xx}" y="${H - 6}" font-size="13" fill="${COL.axis}" text-anchor="${a}">${fmt(i)}</text>`);

      if (yy >= 0 && yy <= H0) g += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#1D1D1F" stroke-width=".7" stroke-dasharray="2 2"/><circle cx="${x(i)}" cy="${yy}" r="3.5" fill="#1D1D1F"/><rect x="${W-R+2}" y="${yy-11}" width="${R-2}" height="22" rx="6" fill="#1D1D1F"/><text x="${W-R+7}" y="${yy+5}" font-size="13" font-weight="600" fill="#fff">${num(b[4], s.market)}</text>`;

      { const dm = (s.marks || []).filter(m => m[0] === b[0]); if (dm.length) $read.innerHTML += dm.map(m => `<span class="mk c-${m[2] === "buy" ? "buy" : m[2] === "sell" ? "sell" : "info"}">${esc(m[1])}</span>`).join(""); }
    } else {
      const a = bars[i0][0], z = bars[i1][0];
      $read.innerHTML = `<span><b>${a.replace(/-/g, ".")} – ${z.slice(5).replace("-", ".")}${s.live && i1 === N - 1 ? " 장중" : ""}</b></span><span>${hint}</span>`;
    }
    $plot.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="일봉 차트" font-family="Pretendard Variable,-apple-system,sans-serif">${g}</svg>`;
    geo = { L, cw, start, W };
  }
  let raf = 0; const redraw = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); segSync(false); }); };
  const tween = (n1, e1) => {   // 기간 버튼·두 번 탭: 부드럽게 옮겨 간다
    if (REDUCED){ V.n = n1; V.end = e1; draw(); segSync(); return; }
    const n0 = V.n, e0 = V.end, t0 = performance.now(), D = 380, ease = t => 1 - Math.pow(1 - t, 3);
    const step = now => { const t = Math.min(1, (now - t0) / D), k = ease(t); V.n = n0 + (n1 - n0) * k; V.end = e0 + (e1 - e0) * k; draw(); if (t < 1) requestAnimationFrame(step); else segSync(); };
    requestAnimationFrame(step);
  };
  $seg.onclick = e => { const b = e.target.closest("button"); if (!b) return; const k = +b.dataset.k; LS.set("period", b.textContent); tween(k, N - 1); };
  box.querySelector(".inds").onclick = e => { const b = e.target.closest("[data-ind]"); if (!b) return; const k = b.dataset.ind; IND[k] = !IND[k]; LS.set("ind", IND); b.setAttribute("aria-pressed", IND[k]); legend(); draw(); };

  /* 손가락 조작 */
  const pts = new Map(); let drag = null, pinch = null, hold = 0, inertia = 0, lastTap = 0;
  const idxAt = cx => { const r = $plot.getBoundingClientRect(), px = (cx - r.left) * (geo.W / r.width); return Math.round(geo.start + (px - geo.L) / geo.cw - 0.5); };
  $plot.addEventListener("pointerdown", e => {
    cancelAnimationFrame(inertia); pts.set(e.pointerId, {x:e.clientX, y:e.clientY}); $plot.setPointerCapture(e.pointerId);

    } else if (pts.size === 2){
      clearTimeout(hold); cross = null; const [a, b] = [...pts.values()];
      const mid = (a.x + b.x) / 2; pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y), n0: V.n, c: geo.start + (((mid - $plot.getBoundingClientRect().left) * geo.W / $plot.getBoundingClientRect().width) - geo.L) / geo.cw, mid };

    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (pinch && pts.size === 2){
      const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y), r = $plot.getBoundingClientRect();
      V.n = pinch.n0 * pinch.d0 / Math.max(20, d); clamp();
      const cw = (geo.W - geo.L - (isKR(s.market) ? 76 : 62)) / V.n, mx = ((a.x + b.x) / 2 - r.left) * geo.W / r.width;
      V.end = pinch.c - (mx - geo.L) / cw + V.n - 1; redraw(); return;
    }

  });
  const up = e => {
    pts.delete(e.pointerId); clearTimeout(hold);

      if (drag.cross){ cross = null; draw(); }

        const [a, b] = [drag.hist[0], drag.hist[drag.hist.length - 1]], r = $plot.getBoundingClientRect();
        let v = -((b[0] - a[0]) / Math.max(1, b[1] - a[1])) / geo.cw * (geo.W / r.width); let t = performance.now();
        if (!REDUCED && Math.abs(v) > 0.002){ const step = now => { const dt = now - t; t = now; V.end += v * dt; v *= Math.pow(0.94, dt / 16); const e0 = V.end; clamp(); draw(); if (Math.abs(v) > 0.0008 && V.end === e0) inertia = requestAnimationFrame(step); else segSync(); }; inertia = requestAnimationFrame(step); }
        else segSync();

        const now = performance.now(); if (now - lastTap < 300){ tween(pdef, N - 1); lastTap = 0; } else lastTap = now;
      }
      drag = null;
    }
  };
  $plot.addEventListener("pointerup", up); $plot.addEventListener("pointercancel", up);
  $plot.addEventListener("pointerleave", e => { if (e.pointerType === "mouse" && !pts.size){ cross = null; redraw(); } });
  $plot.addEventListener("wheel", e => { e.preventDefault(); const r = $plot.getBoundingClientRect(), c = idxAt(e.clientX);

    else { const f = Math.exp(e.deltaY * 0.002), n1 = Math.max(15, Math.min(N, V.n * f)); const frac = (c - (V.end - V.n + 1)) / V.n; V.n = n1; V.end = c - frac * n1 + n1 - 1; }
    redraw(); }, {passive:false});
  legend(); draw(); segSync(false);
  return { redraw: () => { draw(); segSync(false); } };
}

/* 왼쪽 가장자리에서 밀면 뒤로: 손가락을 따라 앞 화면이 밀리고 뒤 화면이 드러남 */
(() => {
  let x0 = null, y0 = 0, on = false, ghost = null, shade = null, last = [], detailY = 0, sym = null, cur = 0;
  addEventListener("touchstart", e => { const t = e.touches[0]; x0 = (S.detail && t.clientX < 24 && !document.querySelector(".sheet-bg") && !REDUCED) ? t.clientX : null; y0 = t.clientY; on = false; last = [[t.clientX, e.timeStamp]]; }, {passive:true});
  addEventListener("touchmove", e => {
    if (x0 == null) return; const t = e.touches[0], dx = t.clientX - x0, W = innerWidth;
    if (!on){
      if (Math.abs(t.clientY - y0) > Math.abs(dx)){ x0 = null; return; }
      if (dx < 8) return;
      on = true; sym = S.detail; detailY = scrollY;
      ghost = snapshot(); ghost.classList.add("top");
      S.listY = S.listY || 0; S.detail = null; render("none"); scrollTo(0, S.listY);
      shade = document.createElement("div"); shade.className = "shade"; document.body.appendChild(shade);
    }
    const p = Math.max(0, Math.min(1, dx / W)); cur = Math.max(0, dx);
    ghost.style.transform = `translateX(${dx}px)`; $app.style.transform = `translateX(${-W*.3*(1-p)}px)`; shade.style.opacity = 1 - p;
    last.push([t.clientX, e.timeStamp]); if (last.length > 5) last.shift();
  }, {passive:true});
  addEventListener("touchend", () => {
    if (!on){ x0 = null; return; }
    x0 = null; on = false;
    const W = innerWidth, a = last[0], b = last[last.length - 1], v = (b[0] - a[0]) / Math.max(1, b[1] - a[1]);
    const p = Math.min(1, cur / W);
    ghost.style.transform = ""; $app.style.transform = ""; shade.remove();
    if (p > 0.35 || v > 0.4) slidePages("pop", ghost, p);          // 끝까지 넘김
    else {                                                          // 제자리로
      const o = { duration: 300, easing: PAGE_EASE, fill: "forwards" }, sh = document.createElement("div"); sh.className = "shade"; document.body.appendChild(sh);
      const an = [ ghost.animate([{transform:`translateX(${p*W}px)`}, {transform:"none"}], o), $app.animate([{transform:`translateX(${-W*.3*(1-p)}px)`}, {transform:`translateX(${-W*.3}px)`}], o), sh.animate([{opacity:1-p}, {opacity:1}], o) ];
      Promise.all(an.map(x => x.finished)).then(() => {   // 떼어 둔 상세 화면을 그대로 되돌림 (입력·차트 상태 유지)

        document.getElementById("tabbar").classList.add("away"); bindNavbar(); scrollTo(0, detailY);

/* 아래에서 올라오는 창: 같은 곡선(.32,.72,0,1)으로 열림 0.4초 · 닫힘 0.28초(끌다 놓으면 손가락 속도를 이어받아 0.12~0.28초)
   닫는 길 네 가지: ✕ · 바깥 터치 · 아래로 끌기(높이 1/3 또는 빠른 튕김) · Escape. 목록이 맨 위일 때만 끌려 내려간다. */
function openSheet(label, inner){
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  bg.innerHTML = `<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}"><div class="grab" aria-hidden="true"></div>
    <div class="sheet-top"><h3>${esc(label)}</h3><button class="icon-btn press" data-x aria-label="닫기" style="margin-right:-12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>${inner}</div>`;
  document.body.appendChild(bg); document.body.style.overflow = "hidden"; document.body.classList.add("sheet-open");
  const sheet = bg.querySelector(".sheet"), scrim = bg.querySelector(".scrim");
  const H = () => sheet.getBoundingClientRect().height;
  const move = (y, dur, curve) => {
    const t = REDUCED ? "none" : (dur ? `transform ${dur}ms ${curve}` : "none");
    sheet.style.transition = t; scrim.style.transition = REDUCED ? "none" : (dur ? `opacity ${dur}ms ${curve}` : "none");
    sheet.style.transform = `translateY(${y}px)`; scrim.style.opacity = Math.max(0, 1 - y / H());
    const p = Math.max(0, 1 - y / H());   // 창이 올라온 만큼 뒤 화면이 작아지고 모서리가 둥글어짐
    $app.style.transition = t.replace("transform", "transform") ; $app.style.transformOrigin = `50% ${scrollY + innerHeight / 2}px`;
    $app.style.transform = p ? `scale(${1 - 0.06 * p})` : ""; $app.style.borderRadius = p ? `${14 * p}px` : ""; $app.style.overflow = p ? "hidden" : "";
  };
  requestAnimationFrame(() => requestAnimationFrame(() => move(0, 400, "var(--ease)")));
  let closed = false;
  const close = (v = 0) => {
    if (closed) return; closed = true;
    const cur = new DOMMatrix(getComputedStyle(sheet).transform).m42, rest = H() - cur;
    const dur = v > 0 ? Math.max(120, Math.min(280, rest / v)) : 280;
    move(H(), dur, "var(--ease)"); document.body.style.overflow = "";
    removeEventListener("keydown", onKey);
    setTimeout(() => { bg.remove(); document.body.classList.remove("sheet-open"); $app.style.transition = ""; $app.style.transform = ""; $app.style.borderRadius = ""; $app.style.overflow = ""; }, REDUCED ? 0 : dur);
  };
  const onKey = e => { if (e.key === "Escape") close(); };
  addEventListener("keydown", onKey);
  scrim.onclick = () => close();
  bg.querySelector("[data-x]").onclick = () => close();
  /* 끌기 */
  let y0 = null, dy = 0, dragging = false, samples = [];
  const scroller = () => sheet.querySelector(".results");
  sheet.addEventListener("touchstart", e => { y0 = e.touches[0].clientY; dy = 0; dragging = false; samples = [[y0, e.timeStamp]]; }, {passive:true});
  sheet.addEventListener("touchmove", e => {
    if (y0 == null) return;
    const y = e.touches[0].clientY; dy = y - y0;
    const sc = scroller(), inList = sc && sc.contains(e.target);
    if (!dragging){
      if (dy > 4 && (!inList || sc.scrollTop <= 0)) dragging = true;   // 목록이 맨 위일 때만 창이 내려감
      else if (Math.abs(dy) > 4){ y0 = null; return; }                  // 아니면 목록 스크롤
    }
    if (dragging){ e.preventDefault(); move(Math.max(0, dy), 0); samples.push([y, e.timeStamp]); if (samples.length > 5) samples.shift(); }
  }, {passive:false});
  sheet.addEventListener("touchend", () => {
    if (!dragging){ y0 = null; return; }
    const [a, b] = [samples[0], samples[samples.length - 1]], v = (b[0] - a[0]) / Math.max(1, b[1] - a[1]); // px/ms
    y0 = null; dragging = false;
    if (dy > H() / 3 || v > 0.5) close(v > 0 ? v : 0);
    else move(0, 400, "var(--ease-back)");   // 제자리로 돌아올 때만 살짝 튕김
  });
  return { bg, sheet, close };
}

const ICON = {entry:"✅", breakout:"🚀", arrive:"📍", breakdown:"🚫", trim:"✂️", rebuy:"🔁", momentum:"📉", fail:"↩️", news:"⚡", entry_hold:"⏸️", trim14:"✂️", trim21:"✂️", final:"🛑", overheat:"🔥", reclaim21:"🔁", arrive_deep:"🎯", leader:"👑", st:"🧪", pull_buy:"🪃", vcp_buy:"🌀", dnend_buy:"🌤️", sc:"🌊", wash:"🧯", reclaim:"🔓", wallbreak:"🧱", reclaim50:"🔁", entry_weak:"⚠️"};

function scorecard(list){
  const stat = (arr, k) => { const v = arr.map(h => h[k]).filter(x => x != null); if (!v.length) return null;
    return { n: v.length, avg: v.reduce((a,b) => a+b, 0) / v.length, win: v.filter(x => x > 0).length / v.length * 100 }; };

function groupByDay(list){
  const kst = new Date(Date.now() + 9 * 3600e3), today = kst.toISOString().slice(0, 10), y = new Date(kst - 864e5).toISOString().slice(0, 10);
  const lab = d => d === today ? "오늘" : d === y ? "어제" : (() => { const t = new Date(d + "T00:00:00"); return `${t.getMonth() + 1}월 ${t.getDate()}일 (${"일월화수목금토"[t.getDay()]})`; })();
  const out = [];
  list.forEach(h => { const d = String(h.t).slice(0, 10), last = out[out.length - 1]; if (last && last[2] === d) last[1].push(h); else out.push([lab(d), [h], d]); });
  return out;
}

function actCard(s, pl, mk){

  if (tone === "wait" && z){
    const lo = Math.min(z.hi, pl?.stop ?? z.lo) * 0.995, hi = s.price * 1.01, pos = v => Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
    bar = `<div class="dist"><div class="track"><span class="seg-z" style="left:${pos(z.lo)}%;width:${pos(z.hi) - pos(z.lo)}%"></span><span class="dot now" style="left:${pos(s.price)}%"></span></div>
      <div class="dl"><span class="c-buy">${esc(z.label)} ${num(z.hi, mk)}</span><span><b>${pct(z.dist)}</b> 남음</span><span>지금 ${num(s.price, mk)}</span></div></div>`;
  }
  const rel = v => pl && pl.entry && v ? pct((v / pl.entry - 1) * 100) : "";
  const rrw = pl?.rr == null ? "" : pl.rr >= 2 ? "좋음" : pl.rr >= 1 ? "보통" : "낮음";
  const kv = pl ? [["살 가격", num(pl.entry, mk), "", Math.abs(pl.entry / s.price - 1) < 0.002 ? "지금 가격" : pct((pl.entry / s.price - 1) * 100)],
    [(pl.mode || "").startsWith("보유") ? "50일선" : "손절가", num(pl.stop, mk), "c-sell", [rel(pl.stop), pl.stop_judge].filter(Boolean).join(" · ")],
    ["목표", num(pl.target, mk), "c-buy", rel(pl.target)],
    ["손익비", pl.rr == null ? "-" : "1 : " + pl.rr.toFixed(1), "", rrw]] : [];
  const ex = a.exec, cv = s.conv, kr = /\.K[SQ]$/.test(s.symbol || "") || ["코스피", "코스닥"].includes(s.market);
  // 이평선 배열을 쉬운 말로 (정배열 = 추세 좋음, 역배열 = 추세 나쁨, 꼬임 = 방향 정하는 중)
  const AL = {"정배열": "추세 좋음", "역배열": "추세 나쁨", "꼬임": "방향 정하는 중"};
  const al = !cv?.align ? "" : cv.align.prev === "꼬임" && cv.align.now === "정배열" ? "추세 막 좋아짐"
    : cv.align.prev === "정배열" && cv.align.now === "꼬임" ? "추세 약해지는 중"
    : cv.align.prev === "꼬임" && cv.align.now === "역배열" ? "추세 막 나빠짐"
    : cv.align.prev === "역배열" && cv.align.now === "꼬임" ? "추세 나아지는 중" : (AL[cv.align.now] || "");
  const rsw = s.rs_rank != null ? `힘 상위 ${Math.max(1, Math.round(100 - s.rs_rank))}%` : "";
  const meta = [kr && cv ? `확신 ${cv.grade}${cv.reasons?.length ? " (" + cv.reasons.join("·") + ")" : ""}` : "", al, rsw, s.leader ? "👑 하락장 주도주" : ""].filter(Boolean).join(" · ");
  return `<div class="card act a-${esc(tone)}" role="status"><div class="r1"><span class="pill p-${esc(tone)}">${pill}</span>${ex ? `<span class="exec">${esc(ex[0])}${ex[1] ? ` · ${esc(ex[1])}` : ""}</span>` : ""}</div>
    <div class="ttl">${esc(title)}</div>${a.detail && tone !== "wait" ? `<div class="dt">${esc(a.detail)}</div>` : ""}${bar}
    ${meta ? `<div class="ameta">${esc(meta)}</div>` : ""}
    ${a.next ? `<div class="nxt"><span class="sub">다음 확인</span>${esc(a.next)}</div>` : ""}
    ${kv.length ? `<div class="kv">${kv.map(([k, v, c, sm]) => `<div><span>${k}</span><b class="${c}">${v}</b>${sm ? `<small>${esc(sm)}</small>` : ""}</div>`).join("")}</div>` : ""}</div>`;
}
/* 최근 표시: 같은 뜻이면 한 줄로 묶음 */
function notesCard(ns){
  const g = [];
  ns.slice(0, 5).forEach(x => { const o = g.find(y => y.advice === x.advice); o ? o.items.push(x) : g.push({advice: x.advice, score: x.score, items: [x]}); });
  return `<div class="card notes"><div class="cap">최근 차트 표시</div>${g.slice(0, 3).map(o => `<div class="note-i"><div class="nh">${o.items.map(x => `<span class="tag t-${x.tone === "buy" ? "buy" : x.tone === "sell" ? "sell" : "info"}">${esc(x.label)}<span style="font-weight:400;opacity:.75;margin-left:5px">${esc(x.date.slice(5).replace("-", "/"))}</span></span>`).join("")}</div><div class="adv">${esc(o.advice)}${Math.abs(o.score) >= 1 ? ` <span class="sub" style="font-weight:400">(검증 ${o.score > 0 ? "+" : "−"}${Math.abs(o.score).toFixed(1)}%p)</span>` : ""}</div></div>`).join("")}</div>`;
}
/* 새 버전이 올라오면 다시 불러오기 (홈 화면에 추가한 앱은 예전 화면을 오래 들고 있음) */
async function checkVersion(){
  try{
    const mine = document.querySelector('meta[name="app-version"]')?.content;
    const t = await (await fetch(location.pathname + "?v=" + Date.now(), {cache:"no-store"})).text();
    const v = (t.match(/name="app-version" content="([^"]+)"/) || [])[1];
    if (v && mine && v !== mine && !S.dirty){ toast("새 버전으로 바꾸는 중"); setTimeout(() => location.reload(), 600); }
  }catch(e){}
}
addEventListener("visibilitychange", () => { if (!document.hidden) checkVersion(); });
setTimeout(checkVersion, 1500);
try{ LS.set("swipeHint", (LS.get("swipeHint", 0) || 0) + 1); }catch(e){}
function toast(msg, spin){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.setAttribute("aria-live","polite");
  t.innerHTML = (spin ? `<span class="spin"></span>` : "") + `<span>${esc(msg)}</span>`;
  document.body.appendChild(t); clearTimeout(toastT);
  if (!spin) toastT = setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 260); }, 3600);
}

document.querySelectorAll(".tabbar button").forEach(b => b.onclick = () => {
  if (S.tab === b.dataset.tab && !S.detail){ scrollTo({top:0, behavior: REDUCED ? "auto" : "smooth"}); return; }  // 같은 탭 다시 누르면 맨 위로
  go("fade", () => { S.tab = b.dataset.tab; S.detail = null; });
});
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (S.detail && S.chart) S.chart.redraw(); }, 150); });
addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.token && !S.busy) refresh(); });
/* 열어 둔 동안 2분마다 새 시세 확인 (엔진이 장중 30분마다 갱신). 바뀐 게 있을 때만, 목록 화면에서만 다시 그린다 —
   상세 화면에서 차트를 보고 있으면 덮어쓰지 않고 다음에 열 때 반영 */
setInterval(async () => {
  if (document.hidden || !S.token || S.busy || S.dirty) return;
  try{
    const d = await readJSON("상태/대시보드.json", null);
    if (!d || d.updated === S.dash?.updated) return;
    S.dash = d; LS.set("dash", d);
    if (!S.detail && S.tab === "home") render("none");
  }catch(e){}
}, 120000);
render("none");
if (S.token) refresh();
</script>
</body>
