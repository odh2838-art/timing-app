<style>
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --fg:#1D1D1F; --fg2:#6E6E73; --fg3:#AEAEB2; --line:#E5E5EA; --fill:#F2F2F7;
  --blue:#0071E3; --up:#DC2F3D; --down:#1F6FE5;
  --buy:#167A40; --buy-bg:#E8F7EE; --sell:#D22F3C; --sell-bg:#FDEBEC;
  --wait:#975A00; --wait-bg:#FFF4E0; --info:#1B64DA; --info-bg:#EAF2FE;
  /* 글자: 6단계 · 굵기 700/600/400 · 기준 17px(rem이라 시스템 글자 크기를 따라감) */
  --t-display:calc(36rem/17); --t-title:calc(24rem/17); --t-heading:calc(20rem/17); --t-body:1rem; --t-detail:calc(16rem/17); --t-small:calc(15rem/17);
  /* 간격 */
  --gap-eyebrow:4px; --gap-sub:8px; --gap-text:4px; --gap-inner:16px;
  --pad-card:18px; --gap-caption:8px; --gap-block:20px; --gap-section:28px; --gutter:22px;
  --r-card:20px; --r-control:12px; --r:var(--r-card);
  --ease:cubic-bezier(.32,.72,0,1);      /* 시트·화면 전환 곡선 (튕기지 않음) */
  --ease-back:cubic-bezier(.34,1.4,.64,1); /* 끌다 놓아 제자리로 돌아올 때만 살짝 튕김 */
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --bar:rgba(245,245,247,.92); --tab:rgba(255,255,255,.94); --thumb:#FFFFFF; --sheet:#FFFFFF; --field:rgba(118,118,128,.12); --toast:rgba(29,29,31,.94);
  color-scheme:light;
}
/* 다크 모드: 아이폰 설정을 따라감 (애플 다크 팔레트) */
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#1C1C1E; --fg:#F5F5F7; --fg2:#98989D; --fg3:#636366; --line:#38383A; --fill:#2C2C2E;
    --blue:#0A84FF; --up:#FF5A66; --down:#4C9AFF;
    --buy:#30D158; --buy-bg:#0F2E1B; --sell:#FF6961; --sell-bg:#3A1416;
    --wait:#FFB340; --wait-bg:#3A2A0E; --info:#64A8FF; --info-bg:#132A4A;
    --bar:rgba(22,22,24,.92); --tab:rgba(28,28,30,.94); --thumb:#636366; --sheet:#1C1C1E; --field:rgba(118,118,128,.24); --toast:rgba(58,58,60,.96);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:17px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:var(--t-body);line-height:1.45;word-break:keep-all;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}   /* 두 번 탭 확대 막기 */
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
input,select,textarea{font-size:max(16px,1em)}   /* 16px보다 작으면 iOS가 입력할 때 화면을 확대한다 */
b,strong{font-weight:600}
button{cursor:pointer;border:0;background:none;padding:0;-webkit-user-select:none;user-select:none}
:focus{outline:none} :focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:10px}
.wrap{max-width:640px;margin:0 auto;padding:0 max(var(--gutter),env(safe-area-inset-right,0px)) 120px max(var(--gutter),env(safe-area-inset-left,0px))}

/* 화면 전환 (아이폰처럼: 새 화면은 오른쪽에서, 뒤 화면은 살짝 물러나며 어두워짐) */
html,body{overflow-x:clip}
#app{position:relative;z-index:2;background:var(--bg);min-height:100vh;min-height:100dvh;transform-origin:50% 50%}
.ghost{position:fixed;left:0;right:0;z-index:1;background:var(--bg);pointer-events:none;min-height:100vh}
.ghost.top{z-index:4;box-shadow:-8px 0 24px rgba(0,0,0,.08)}
#app.over{box-shadow:-8px 0 24px rgba(0,0,0,.08)}
.shade{position:fixed;inset:0;z-index:3;background:rgba(0,0,0,.1);pointer-events:none;opacity:0}
body.sheet-open{background:#1D1D1F}
.v-push{animation:push .38s var(--ease) both}
.v-pop{animation:pop .34s var(--ease) both}
.v-fade{animation:fade .24s var(--ease-out) both}
@keyframes push{from{transform:translateX(28%);opacity:.0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translateX(-12%);opacity:.0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 누름 반응 */
.press{transition:transform .16s var(--ease-out),background-color .16s,opacity .16s}
.press:active{transform:scale(.97)}
.row.press:active{transform:none;background:var(--fill)}

/* 큰 제목 + 스크롤하면 나타나는 작은 제목 */
.navbar{position:sticky;top:0;z-index:15;margin:0 calc(-1*max(var(--gutter),env(safe-area-inset-left,0px))) 0;padding:0 max(var(--gutter),env(safe-area-inset-right,0px)) 0 max(var(--gutter),env(safe-area-inset-left,0px));height:52px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:transparent;transition:background-color .2s,box-shadow .2s}
.navbar.solid{background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--line)}
.navbar .mini{position:absolute;left:50%;transform:translate(-50%,4px);font-size:var(--t-body);font-weight:600;opacity:0;transition:opacity .2s,transform .2s var(--ease-out);white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}

.navbar .side.r{justify-content:flex-end}
.big{font-size:var(--t-display);font-weight:700;letter-spacing:-.03em;margin:0;line-height:1.1;text-wrap:balance}
.sub{color:var(--fg2);font-size:var(--t-small)}
.title-block .sub{display:block;margin-top:var(--gap-sub)}
.title-block{padding:var(--gap-eyebrow) 0 var(--gap-block)}
.icon-btn{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:2px;color:var(--blue);font-size:var(--t-body);white-space:nowrap}
.text-btn{min-height:44px;display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-size:var(--t-body);font-weight:600;margin-right:-6px;padding:0 6px}
.text-btn:disabled{opacity:.45}
.pill-btn{min-height:44px;background:var(--card);border-radius:999px;padding:6px 14px;font-size:var(--t-small);font-weight:600;color:var(--blue);box-shadow:0 0 0 1px var(--line) inset;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill-btn.primary{background:var(--info-bg);color:var(--blue);box-shadow:none}
.pill-btn:disabled{opacity:.45}

.card{background:var(--card);border-radius:var(--r-card);padding:var(--pad-card)}
.stack{display:flex;flex-direction:column;gap:var(--gap-block)}
.regimes{display:flex;gap:var(--gap-sub);flex-wrap:wrap;margin-bottom:var(--gap-block)}
.regime{display:flex;align-items:center;gap:var(--gap-sub);background:var(--card);border-radius:999px;padding:var(--gap-sub) 14px;font-size:var(--t-small)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.list{background:var(--card);border-radius:var(--r-card);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:var(--pad-card);width:100%;text-align:left;min-height:44px}
.row+.row{box-shadow:0 -1px 0 var(--line)}
/* 밀어서 삭제 · 편집 */
.swipe{position:relative;overflow:hidden;background:var(--card)}
.swipe+.swipe::before{content:"";position:absolute;top:0;left:var(--pad-card,18px);right:0;height:1px;background:var(--line);z-index:2;pointer-events:none}
.swipe>.row{background:var(--card);position:relative;z-index:1;transition:transform .35s var(--ease);will-change:transform}
.swipe .act{visibility:hidden;position:absolute;right:0;top:0;bottom:0;min-width:88px;background:var(--sell);color:#fff;font-weight:600;font-size:var(--t-body);display:flex;align-items:center;justify-content:flex-end;padding-right:22px}
.swipe.gone{transition:height .3s var(--ease),opacity .3s}
.minus{width:0;height:24px;flex:none;border-radius:50%;background:var(--sell);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-right:-12px;transform:scale(.4);opacity:0;transition:width .3s var(--ease),margin .3s var(--ease),transform .3s var(--ease),opacity .2s}
.minus::before{content:"";width:11px;height:2.5px;border-radius:2px;background:#fff}
.editing .minus{width:24px;margin-right:0;transform:none;opacity:1}
.editing .px .spark{display:none}
.enter{animation:rowin .5s var(--ease) both}
@keyframes rowin{from{opacity:0;transform:translateY(-10px)}}
.row .main{flex:1;min-width:0} a.row{text-decoration:none;color:inherit}
.row .name{font-size:var(--t-body);font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:nowrap;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .head .dist{color:var(--fg2);margin-left:6px;font-variant-numeric:tabular-nums} .today .gate{margin-top:var(--gap-sub);padding-top:var(--gap-sub);border-top:1px solid var(--line);font-size:var(--t-small);color:var(--fg2);line-height:1.5} .today .gate b{color:var(--fg);font-weight:600} .row .head{flex-wrap:nowrap;min-width:0} .row .head .pill{flex:none} .row .head .act1{font-size:var(--t-detail);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sumline{font-size:var(--t-heading);font-weight:700;margin:0 4px var(--gap-inner)}

.row .head{font-size:var(--t-detail);margin-top:var(--gap-text);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .px{text-align:right;flex:none;display:flex;align-items:center;gap:10px}
.row .px b{display:block;font-size:var(--t-body);font-weight:600}
.spark{width:56px;height:28px;flex:none}

.empty{font-size:var(--t-detail)}

.sec-title{font-size:var(--t-heading);font-weight:600;line-height:1.3;color:var(--fg);margin:var(--gap-section) var(--pad-card) var(--gap-caption);display:flex;justify-content:space-between;align-items:baseline;gap:12px}

/* 뼈대 (불러오는 동안) */

.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--tab);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--line);display:flex;justify-content:center;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20;transition:transform .3s var(--ease)}

.tabbar button.on{color:var(--blue)}

/* 상세 */
.hero .bigpx{font-size:var(--t-title);font-weight:700;line-height:1.25;letter-spacing:-.02em;margin-top:var(--gap-inner);display:flex;align-items:baseline;gap:10px}

.mdot{width:7px;height:7px;border-radius:50%;background:var(--fg3)} .mdot.good{background:var(--buy)} .mdot.weak{background:var(--wait)}

.fgbar{position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--down),var(--line) 50%,var(--up));margin-top:2px}
.fgbar i{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--card);border:3px solid var(--fg);box-sizing:border-box}

#fseg button.on{background:var(--thumb);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.frow{align-items:flex-start}.fsig{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}.fmeta{margin-top:4px;display:flex;flex-wrap:wrap;column-gap:10px;row-gap:2px}.fmeta>span{white-space:nowrap}.fmeta .sig{color:var(--fg);font-weight:500}.frow .name .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}.frow .name .tk{flex:none}
.fpx{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right;font-variant-numeric:tabular-nums}
.frow{align-items:center!important;gap:12px}
.sepa .sp-h{display:flex;align-items:baseline;justify-content:space-between} .sepa .sp-h b{font-size:var(--t-body);font-weight:700}
.sepa .sp-n{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px} .sepa .sp-n small{font-size:var(--t-body);color:var(--fg3);font-weight:600}
.sepa .sp-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:10px} .sepa .sp-bar i{height:6px;border-radius:3px;background:var(--fill)} .sepa .sp-bar i.on{background:var(--buy)}

.why .wpx{font-size:var(--t-title3,20px);font-variant-numeric:tabular-nums} .why .wpx .chg{font-size:var(--t-small)} .why .wpx .chg.up{color:var(--up)} .why .wpx .chg.down{color:var(--down)} .why .tk{color:var(--fg3);font-size:var(--t-small)}

<script>
"use strict";
/* ───────── 저장 (이 기기에만) ───────── */
const LS = {
  get(k, d=null){ try{ const v = localStorage.getItem(k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const S = { token: LS.get("tok", ""), repo: LS.get("repo", "odh2838-art/timing-agent"),
  tab: "home", detail: null, dash: LS.get("dash"), csv: null, alerts: null, err: "", busy: null, loading: true, dirty: false };
const CSV_PATH = "종목.csv";
const HEAD = ["시장","티커","이름","박스하단","박스상단","저항","1차매수일","1차가격","2차매수일","2차가격","3차매수일","3차가격","조절분상태","조절분매도일","메모"];
let REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
try{ matchMedia("(prefers-reduced-motion: reduce)").addEventListener("change", e => REDUCED = e.matches); }catch(e){}

/* ───────── GitHub ───────── */
const enc = p => p.split("/").map(encodeURIComponent).join("/");
async function gh(path, opt={}){
  let res;
  try{ res = await fetch("https://api.github.com/repos/" + S.repo + path, {
    ...opt, cache:"no-store", signal: opt.signal || (AbortSignal.timeout ? AbortSignal.timeout(15000) : undefined),
    headers:{ "Authorization":"Bearer " + S.token, "X-GitHub-Api-Version":"2022-11-28",
              "Accept": opt.raw ? "application/vnd.github.raw+json" : "application/vnd.github+json",
              ...(opt.body ? {"Content-Type":"application/json"} : {}) }
  }); }catch(e){ throw new Error("연결할 수 없어요 · 인터넷을 확인해 주세요"); }
  if (res.status === 401) throw new Error("토큰이 맞지 않거나 만료됐어요");
  if (res.status === 403) throw new Error("토큰 권한이 부족해요 · Contents·Actions 읽기/쓰기 허용");
  if (res.status === 404) { const e = new Error("없음"); e.nf = true; throw e; }
  if (res.status === 409) throw new Error("다른 곳에서 먼저 바뀌었어요 · 다시 시도해 주세요");
  if (!res.ok) throw new Error("잠시 문제가 있어요 · 다시 시도해 주세요");
  if (res.status === 204) return null;
  return opt.raw ? res.text() : res.json();
}
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")), c => c.charCodeAt(0)));
const b64enc = s => { const b = new TextEncoder().encode(s); let x=""; for (let i=0;i<b.length;i+=0x8000) x += String.fromCharCode.apply(null, b.subarray(i,i+0x8000)); return btoa(x); };
async function readJSON(path, d){ try{ return JSON.parse(await gh("/contents/" + enc(path) + "?ref=main", {raw:true})); }catch(e){ if (e.nf) return d; throw e; } }

/* ───────── CSV ───────── */
function parseCSV(t){
  const rows=[]; let row=[], f="", q=false;
  for (let i=0;i<t.length;i++){
    const c=t[i];
    if (q){ if (c==='"'){ if (t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if (c==='"') q=true;
    else if (c===','){ row.push(f); f=""; }
    else if (c==='\n' || c==='\r'){ if (c==='\r' && t[i+1]==='\n') i++; row.push(f); f=""; if (row.some(x=>x!=="")) rows.push(row); row=[]; }
    else f+=c;
  }
  row.push(f); if (row.some(x=>x!=="")) rows.push(row);
  return rows;
}
const cell = v => /[",\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
const csvText = (head, rows) => [head, ...rows.map(r => head.map(h => r[h] ?? ""))].map(r => r.map(x => cell(String(x))).join(",")).join("\n") + "\n";
async function loadCSV(){
  const j = await gh("/contents/" + enc(CSV_PATH) + "?ref=main");
  let txt = b64dec(j.content); const bom = txt.charCodeAt(0) === 0xFEFF; if (bom) txt = txt.slice(1);
  const rows = parseCSV(txt); const head = rows.shift() || HEAD;
  S.csv = { sha:j.sha, bom, head, rows: rows.map(r => Object.fromEntries(head.map((h,i)=>[h, (r[i]??"").trim()]))) };
  return S.csv;
}
async function saveCSV(msg){
  const c = S.csv; const txt = (c.bom ? "﻿" : "") + csvText(c.head, c.rows);
  const r = await gh("/contents/" + enc(CSV_PATH), { method:"PUT", body: JSON.stringify({ message: msg, content: b64enc(txt), sha: c.sha, branch:"main" }) });
  c.sha = r.content.sha;
}
const symOf = (mk, tk) => mk === "코스피" ? tk + ".KS" : mk === "코스닥" ? tk + ".KQ" : tk;

/* ───────── 점검 실행 ───────── */
async function dispatch(cmd, symbol){
  const since = Date.now() - 5000;
  await gh("/actions/workflows/agent.yml/dispatches", { method:"POST", body: JSON.stringify({ ref:"main", inputs: symbol ? {cmd, symbol} : {cmd} }) });
  return since;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function waitRun(since, label){
  S.busy = label; toast(label + " · 1분 정도", true); syncBusy();
  let id = null;
  for (let i=0;i<60;i++){
    await sleep(i < 6 ? 3000 : 5000);
    try{
      const j = await gh("/actions/runs?event=workflow_dispatch&per_page=5");
      const run = id ? j.workflow_runs.find(r => r.id === id) : j.workflow_runs.find(r => Date.parse(r.created_at) >= since);
      if (!run) continue;
      id = run.id;
      if (run.status === "completed"){
        S.busy = null; syncBusy();
        if (run.conclusion === "success"){ await refresh(); toast("다시 계산했어요"); }
        else toast("계산하지 못했어요. 설정 > 고급 > 실행 기록을 확인해 주세요.");
        return;
      }
    }catch(e){}
  }
  S.busy = null; syncBusy(); toast("아직 계산 중이에요. 잠시 뒤 새로고침해 주세요.");
}
function syncBusy(){ document.querySelectorAll("[data-busy]").forEach(b => b.disabled = !!S.busy); }

/* ───────── 데이터 ───────── */
async function refresh(){
  S.err = "";
  try{
    const [d] = await Promise.all([readJSON("상태/대시보드.json", {stocks:{}, regimes:{}}), loadCSV()]);
    S.dash = d; S.alerts = null; S.find = {}; LS.set("dash", d); applyQuotes();
  }catch(e){ S.err = e.message; }
  S.loading = false;
  if (!S.dirty) render("none");   // 입력 중이면 화면을 덮어쓰지 않는다
  liveTick(true);                 // 열 때 한 번은 장 시간과 상관없이 최신 시세
  preloadFind();
}
/* ───────── 실시간 시세 (설정의 '실시간 시세 주소' = 내 Cloudflare 중계) ─────────
   한국은 네이버 실시간, 미국은 야후 1분봉. 장이 열린 동안 1분마다, 새로고침 버튼으로 즉시. */
S.q = {};
const IDX_SYM = {"코스피": "^KS11", "코스닥": "^KQ11", "S&P 500": "^GSPC", "나스닥": "^IXIC"};
const isKRsym = sym => /\.K[SQ]$/.test(sym) || sym === "^KS11" || sym === "^KQ11";
function marketOpenNow(kr){
  const tz = kr ? "Asia/Seoul" : "America/New_York";
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", {timeZone: tz, weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false}).formatToParts(new Date()).map(x => [x.type, x.value]));
  const m = (+p.hour % 24) * 60 + +p.minute, wd = !["Sat", "Sun"].includes(p.weekday);
  return wd && (kr ? m >= 540 && m < 930 : m >= 570 && m < 960);
}
function quoteSyms(){
  const st = Object.keys(S.dash?.stocks || {});
  return [...new Set([...st, ...Object.keys(S.dash?.regimes || {}).map(n => IDX_SYM[n]).filter(Boolean)])];
}
function applyOne(s, q, prevKey){
  if (!s || !q || !q.p) return;
  const bars = s.bars || (s.bars = []), last = bars[bars.length - 1];
  if (last && q.d < last[0]) return;                       // 엔진 자료가 더 새것
  if (last && last[0] === q.d){
    last[4] = q.p; if (q.o) last[1] = q.o;
    last[2] = Math.max(q.h ?? q.p, q.p, last[1]); last[3] = Math.min(q.l ?? q.p, q.p, last[1]);
    if (q.v) last[7] = q.v;
  } else if (last){
    bars.push([q.d, q.o ?? q.p, Math.max(q.h ?? q.p, q.p), Math.min(q.l ?? q.p, q.p), q.p, last[5], last[6], q.v ?? null]);
    if (bars.length > 500) bars.shift();
  }
  const prev = q.prev ?? (bars.length > 1 ? bars[bars.length - 2][4] : null);
  s.price = q.p; if (prev) s.chg = (q.p / prev - 1) * 100;
  s.qt = q.t;
}
function applyQuotes(){
  const d = S.dash; if (!d) return;
  for (const [sym, s] of Object.entries(d.stocks || {})) applyOne(s, S.q[sym]);
  for (const [n, g] of Object.entries(d.regimes || {})){
    const q = S.q[IDX_SYM[n]]; if (!q || !q.p) continue;
    const prev = q.prev ?? (g.close && g.chg != null ? g.close / (1 + g.chg / 100) : null);
    if (prev) g.chg = (q.p / prev - 1) * 100;
    g.close = q.p; if (Array.isArray(g.spark) && g.spark.length) g.spark[g.spark.length - 1] = q.p;
    if (q.day && q.day.pts?.length) g.day = q.day; g.qt = q.t;
  }
}
const hhmm = t => { try{ return new Date(t).toLocaleTimeString("ko-KR", {hour: "2-digit", minute: "2-digit", hour12: false}); }catch(e){ return ""; } };
async function pullQuotes(syms){
  const base = (LS.get("qurl", "") || "").trim().replace(/\/+$/, "");
  if (!base || !syms.length) return false;
  let j;
  try{
    const r = await fetch(base + "?s=" + encodeURIComponent(syms.join(",")), {cache: "no-store", signal: AbortSignal.timeout ? AbortSignal.timeout(10000) : undefined});
    if (!r.ok) throw 0; j = await r.json();
  }catch(e){ throw new Error("실시간 시세를 받지 못했어요"); }
  for (const [k, v] of Object.entries(j)) if (v && v.p) S.q[k] = v;
  applyQuotes(); return true;
}
/* 화면에 반영: 홈은 다시 그리고, 상세는 가격·차트만 고친다 (보던 위치 유지) */
function showQuotes(){
  if (S.dirty) return;
  if (S.detail){
    const s = S.dash?.stocks?.[S.detail]; if (!s) return;
    const px = document.getElementById("dpx"), sub = document.getElementById("dsub");
    const mk = s.market;
    if (px) px.innerHTML = `${num(s.price, mk)} <span class="chg ${s.chg>=0?"up":"down"}" style="font-size:var(--t-body)">${pct(s.chg)}</span>`;
    if (sub && s.qt) sub.dataset.live = "1", sub.lastChild.textContent = ` · 실시간 ${hhmm(s.qt)}`;
    if (S.chart && !S.chart.tick()) S.chart = mountChart($app.querySelector("#chartBox"), s);
  } else if (S.tab === "home") render("none");
}
async function liveTick(force){
  if (document.hidden || !S.token || !S.dash) return;
  const syms = quoteSyms().filter(x => force || marketOpenNow(isKRsym(x)));
  if (!syms.length) return;
  try{ if (await pullQuotes(syms)) showQuotes(); }catch(e){ if (force) toast(e.message); }
}
setInterval(() => liveTick(false), 60000);
/* 화면 확대 막기 (iOS는 user-scalable=no를 무시하므로 손가락 두 개 확대를 직접 막는다). 차트 안의 확대·축소는 그대로 */
["gesturestart", "gesturechange", "gestureend"].forEach(t => document.addEventListener(t, e => { if (!e.target.closest?.(".plot")) e.preventDefault(); }, {passive: false}));
/* 손가락 두 개: 차트 밖이면 화면 확대를 막고, 차트 안이면 화면이 위아래로 움직이지 않게 막아 차트 확대·축소로 쓴다 */
if (/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)){
  document.addEventListener("touchstart", e => { if (e.touches.length > 1) e.preventDefault(); }, {passive: false});
  document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, {passive: false});
}
async function catalog(){
  const c = LS.get("catalog");
  if (c && Date.now() - c.t < 7*864e5) return c.rows;
  const rows = await readJSON("상태/종목사전.json", []);
  if (rows.length) LS.set("catalog", {t:Date.now(), rows});
  return rows;
}
const KALIAS = {"네이버":"035420", "삼전":"005930", "하이닉스":"000660", "하닉":"000660", "엘지전자":"066570", "현대차":"005380", "엘지엔솔":"373220", "포스코":"005490"};   // 한국 종목 별칭 (영문 이름·줄임말)
const ALIAS = {"엔비디아":"NVDA","애플":"AAPL","테슬라":"TSLA","마이크로소프트":"MSFT","마소":"MSFT","아마존":"AMZN","알파벳":"GOOGL","구글":"GOOGL","메타":"META","페이스북":"META","넷플릭스":"NFLX","브로드컴":"AVGO","에이엠디":"AMD","팔란티어":"PLTR","티에스엠씨":"TSM","대만반도체":"TSM","코스트코":"COST","일라이릴리":"LLY","릴리":"LLY","노보노디스크":"NVO","버크셔":"BRK-B","제이피모건":"JPM","비자":"V","마스터카드":"MA","월마트":"WMT","오라클":"ORCL","어도비":"ADBE","세일즈포스":"CRM","인텔":"INTC","퀄컴":"QCOM","마이크론":"MU","에이에스엠엘":"ASML","슈퍼마이크로":"SMCI","코인베이스":"COIN","스타벅스":"SBUX","나이키":"NKE","디즈니":"DIS","코카콜라":"KO","펩시":"PEP","맥도날드":"MCD","아이온큐":"IONQ","로켓랩":"RKLB","유니티":"U","쇼피파이":"SHOP","우버":"UBER","에어비앤비":"ABNB","로빈후드":"HOOD","소파이":"SOFI","리비안":"RIVN","루시드":"LCID","크라우드스트라이크":"CRWD","스노우플레이크":"SNOW","팔로알토":"PANW","암":"ARM","델":"DELL","아이비엠":"IBM","시스코":"CSCO","보잉":"BA","캐터필러":"CAT","엑슨모빌":"XOM","셰브론":"CVX","화이자":"PFE","모더나":"MRNA","존슨앤존슨":"JNJ","유나이티드헬스":"UNH","버티브":"VRT","비스트라":"VST","컨스텔레이션":"CEG","마이크로스트래티지":"MSTR","스트래티지":"MSTR","앱러빈":"APP","써클":"CRCL"};

/* ───────── 공통 ───────── */
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isKR = m => m === "코스피" || m === "코스닥";
const tick = v => v < 2000 ? 1 : v < 5000 ? 5 : v < 20000 ? 10 : v < 50000 ? 50 : v < 200000 ? 100 : v < 500000 ? 500 : 1000;   // 한국 호가 단위 (2023~)
const num = (v, mk) => v == null || !isFinite(v) ? "-" : (isKR(mk) ? (Math.round(v / tick(v)) * tick(v)).toLocaleString("ko-KR") : Math.abs(v) < 1 ? (+v).toPrecision(4) : (+v).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2}));
const pct = v => { if (v == null || !isFinite(v)) return "-"; const r = +(+v).toFixed(1); return (r > 0 ? "+" : r < 0 ? "−" : "") + Math.abs(r).toFixed(1) + "%"; };

/* 지금 화면을 통째로 떼어 고정 (전환하는 동안 뒤/앞 화면 역할).
   복사하지 않고 옮기므로 손가락이 닿아 있던 요소도 그대로 살아 있다. */
function snapshot(){
  const g = document.createElement("div"); g.className = "ghost"; g.setAttribute("aria-hidden", "true");
  g.style.top = $app.getBoundingClientRect().top + "px";
  while ($app.firstChild) g.appendChild($app.firstChild);
  document.body.appendChild(g); return g;
}
const PAGE_MS = 500, PAGE_EASE = "cubic-bezier(.32,.72,0,1)";
function slidePages(how, ghost, from = 0){
  const shade = document.createElement("div"); shade.className = "shade"; document.body.appendChild(shade);
  const W = innerWidth, o = { duration: PAGE_MS * (1 - from), easing: PAGE_EASE, fill: "forwards" };
  let anims;
  if (how === "push"){   // 새 화면이 위로 덮으며 들어옴
    $app.classList.add("over");
    anims = [ $app.animate([{transform:`translateX(${W}px)`}, {transform:"none"}], o),
              ghost.animate([{transform:"none"}, {transform:`translateX(${-W*.3}px)`}], o),
              shade.animate([{opacity:0}, {opacity:1}], o) ];
  } else {               // 앞 화면이 오른쪽으로 빠지고 뒤 화면이 돌아옴
    ghost.classList.add("top");
    anims = [ ghost.animate([{transform:`translateX(${W*from}px)`}, {transform:`translateX(${W}px)`}], o),
              $app.animate([{transform:`translateX(${-W*.3*(1-from)}px)`}, {transform:"none"}], o),
              shade.animate([{opacity:1-from}, {opacity:0}], o) ];
  }
  Promise.all(anims.map(a => a.finished)).then(() => { anims.forEach(a => a.cancel()); ghost.remove(); shade.remove(); $app.classList.remove("over"); });
}

  const X = m => (Math.min(390, Math.max(0, m)) / 390 * W).toFixed(1), Y = v => (H - pad - (v - lo) / ((hi - lo) || 1) * (H - pad * 2)).toFixed(1);

/* 목록용 짧은 할 일: '대기 · 148.18 오면 1차 40% 매수' → '148.18 오면 1차 40% · −2.6%' */
const shortAct = (a, price) => {
  const t = a.title || "", m = t.match(/^대기 · ([\d,.]+) 오면/);
  if (a.start){   // 아직 안 산 종목: '1차 40% · 2차 −10%'

    return `지금 1차 ${w || 40}%`;   // 2차 자리는 상세 화면에
  }
  if (m && price){   // 거리는 지금(실시간) 가격 기준으로 다시 잰다
    const v = (+m[1].replace(/,/g, "") / price - 1) * 100;
    return `${m[1]}까지 ${(v > 0 ? "+" : "") + (Math.abs(v) >= 10 ? Math.round(v) : v.toFixed(1))}%`;
  }
  if (m) return /^지금보다/.test(a.detail || "") ? `${m[1]}까지 ${a.detail.replace("지금보다 ", "").replace(/^([+-]?\d{2,})\.\d%$/, "$1%")}` : `${m[1]} 오면 매수`;
  const w = t.match(/^이번 주 ([\d,.]+) 위로 끝나면/);
  if (w) return `이번 주 ${w[1]} 위면 매수`;
  return t.replace(/ 매수/, "").replace(/ \(절반만\)/, " 절반");
};

/* 종목 줄: 왼쪽으로 밀면 삭제 버튼, 끝까지 밀면 바로 삭제 */
let openRow = null;
function closeSwipes(except){ $app.querySelectorAll(".swipe>.row").forEach(r => { if (r !== except){ r.style.transform = ""; const a = r.parentElement.querySelector(".act"); a.style.width = ""; clearTimeout(a._h); a._h = setTimeout(() => a.style.visibility = "", 360); } }); if (!except) openRow = null; }
function bindSwipes(list){
  $app.querySelectorAll(".swipe").forEach(sw => {
    const row = sw.querySelector(".row"), act = sw.querySelector(".act"), sym = sw.dataset.sym;
    let x0 = null, y0 = 0, base = 0, dx = 0, dir = null, swiped = 0;
    const set = (t, anim) => { row.style.transition = anim ? "" : "none"; act.style.transition = anim ? "width .35s var(--ease)" : "none"; row.style.transform = t ? `translateX(${t}px)` : ""; act.style.width = Math.max(88, -t) + "px";
      clearTimeout(act._h); if (t) act.style.visibility = "visible"; else act._h = setTimeout(() => act.style.visibility = "", anim ? 360 : 0); };
    sw.addEventListener("touchstart", e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; dx = 0; dir = null; base = openRow === row ? -88 : 0; }, {passive:true});
    sw.addEventListener("touchmove", e => {
      if (x0 == null) return; const t = e.touches[0]; dx = t.clientX - x0;
      if (!dir){ if (Math.abs(dx) < 8 && Math.abs(t.clientY - y0) < 8) return; dir = Math.abs(dx) > Math.abs(t.clientY - y0) ? "h" : "v"; if (dir === "h") closeSwipes(row); }
      if (dir !== "h") return;
      e.preventDefault(); const W = sw.clientWidth; let tx = Math.min(0, base + dx); if (tx < -W) tx = -W;
      set(tx < 0 ? tx : 0, false);
    }, {passive:false});
    sw.addEventListener("touchend", () => {
      if (dir !== "h"){ x0 = null; return; }
      x0 = null; swiped = Date.now(); const W = sw.clientWidth, tx = Math.min(0, base + dx);
      if (-tx > W * 0.55) removeRow(sw, sym);                     // 끝까지 밀었으면 바로 삭제
      else if (-tx > 44){ set(-88, true); openRow = row; }         // 버튼이 보이게 멈춤
      else { set(0, true); if (openRow === row) openRow = null; }
    });
    row.addEventListener("click", e => {
      if (Date.now() - swiped < 400) return;                     // 방금 민 손가락이 만든 탭은 무시
      if (e.target.closest(".minus")){ e.stopPropagation(); closeSwipes(row); set(-88, true); openRow = row; return; }
      if (openRow){ e.preventDefault(); closeSwipes(); return; }  // 열린 줄이 있으면 닫기만
      go("push", () => S.detail = sym);
    });
    row.addEventListener("keydown", e => { if (e.key === "Enter") row.click(); });
    act.onclick = () => removeRow(sw, sym);
  });
}
/* 줄이 왼쪽으로 빠지고 접히듯 사라진 뒤, 실제 삭제는 뒤에서 */
function removeRow(sw, sym){
  const row = sw.querySelector(".row"), h = sw.offsetHeight;
  row.style.transition = REDUCED ? "none" : ""; row.style.transform = `translateX(-100%)`;
  sw.querySelector(".act").style.width = "100%";
  sw.style.height = h + "px"; sw.classList.add("gone");
  requestAnimationFrame(() => requestAnimationFrame(() => { sw.style.height = "0px"; sw.style.opacity = "0"; }));
  setTimeout(() => sw.remove(), REDUCED ? 0 : 320);
  openRow = null;
  removeStock(sym).catch(e => { toast(e.message); refresh(); });
}
async function removeStock(sym){
  await loadCSV(); const gone = S.csv.rows.find(v => symOf(v["시장"], v["티커"]) === sym);
  const name = S.dash?.stocks?.[sym]?.name || gone?.["이름"] || sym;
  S.csv.rows = S.csv.rows.filter(v => symOf(v["시장"], v["티커"]) !== sym);
  await saveCSV(`앱: ${name} 삭제`);
  if (gone){ const bin = LS.get("removed", {}); bin[sym] = gone; LS.set("removed", bin); }
  if (S.dash?.stocks) delete S.dash.stocks[sym];
  toast(name + " 삭제 · 다시 추가하면 설정도 돌아와요");
}

function calcInd(bars){
  const n = bars.length, c = bars.map(b => b[4]), h = bars.map(b => b[2]), l = bars.map(b => b[3]);
  const ema = (k) => { const a = 2/(k+1), o = []; let e = null; c.forEach((v,i) => { e = e == null ? v : v*a + e*(1-a); o.push(i >= k-1 ? e : null); }); return o; };
  const sma = (k) => { const o = []; let s = 0; c.forEach((v,i) => { s += v; if (i >= k) s -= c[i-k]; o.push(i >= k-1 ? s/k : null); }); return o; };
  const mid = (k, i) => { if (i < k-1) return null; let H = -Infinity, L = Infinity; for (let j = i-k+1; j <= i; j++){ H = Math.max(H, h[j]); L = Math.min(L, l[j]); } return (H+L)/2; };
  const m20 = sma(20), bbU = [], bbL = [];
  c.forEach((v,i) => { if (m20[i] == null){ bbU.push(null); bbL.push(null); return; } let q = 0; for (let j = i-19; j <= i; j++) q += (c[j]-m20[i])**2; const sd = Math.sqrt(q/20); bbU.push(m20[i]+2*sd); bbL.push(m20[i]-2*sd); });
  const ten = c.map((_,i) => mid(9,i)), kij = c.map((_,i) => mid(26,i)), sB = c.map((_,i) => mid(52,i));

      { const dm = (s.marks || []).filter(m => m[0] === b[0]); if (dm.length) $read.innerHTML += dm.map(m => { const a = (s.sig_help || {})[m[1]]?.act; return `<span class="mk c-${a ? ({buy:"buy", trim:"wait"}[a] || "sub") : m[2] === "buy" ? "buy" : m[2] === "sell" ? "sell" : "info"}">${esc(m[1])}</span>`; }).join(""); }

    if (REDUCED){ V.n = n1; V.end = e1; draw(); segSync(); return; }
    const n0 = V.n, e0 = V.end, t0 = performance.now(), D = 380, ease = t => 1 - Math.pow(1 - t, 3);
    const step = now => { const t = Math.min(1, (now - t0) / D), k = ease(t); V.n = n0 + (n1 - n0) * k; V.end = e0 + (e1 - e0) * k; draw(); if (t < 1) requestAnimationFrame(step); else segSync(); };

  document.getElementById("drefresh").onclick = async (ev) => {

  };

  S.drafts = S.drafts || {};

  if (draft){ for (const el of form.querySelectorAll("[data-k]")) if (el.dataset.k in draft) el.value = draft[el.dataset.k]; markDirty(); document.getElementById("draftNote").hidden = false; }
  form.addEventListener("input", () => { markDirty(); S.drafts[sym] = Object.fromEntries([...form.querySelectorAll("[data-k]")].map(el => [el.dataset.k, el.value])); });
  document.getElementById("back").onclick = back;
  const doSave = async () => {

function back(){ if (history.state?.v === "d"){ history.back(); return; } go("pop", () => S.detail = null); }  // 입력 중이던 내용은 S.drafts에 남아 있다

/* 왼쪽 가장자리에서 밀면 뒤로: 손가락을 따라 앞 화면이 밀리고 뒤 화면이 드러남 */
(() => {
  let x0 = null, y0 = 0, on = false, ghost = null, shade = null, last = [], detailY = 0, sym = null, cur = 0;
  addEventListener("touchstart", e => { const t = e.touches[0]; x0 = (S.detail && t.clientX < 24 && !document.querySelector(".sheet-bg") && !REDUCED) ? t.clientX : null; y0 = t.clientY; on = false; last = [[t.clientX, e.timeStamp]]; }, {passive:true});
  addEventListener("touchmove", e => {
    if (x0 == null) return; const t = e.touches[0], dx = t.clientX - x0, W = innerWidth;
    if (!on){
      if (Math.abs(t.clientY - y0) > Math.abs(dx)){ x0 = null; return; }
      if (dx < 8) return;
      on = true; sym = S.detail; detailY = scrollY;
      ghost = snapshot(); ghost.classList.add("top");
      if (history.state?.v === "d"){ skipPop++; history.back(); }   // 손가락으로 넘긴 뒤로도 기록과 맞춘다
      S.listY = S.listY || 0; S.detail = null; render("none"); scrollTo(0, S.listY);
      shade = document.createElement("div"); shade.className = "shade"; document.body.appendChild(shade);
    }
    const p = Math.max(0, Math.min(1, dx / W)); cur = Math.max(0, dx);
    ghost.style.transform = `translateX(${dx}px)`; $app.style.transform = `translateX(${-W*.3*(1-p)}px)`; shade.style.opacity = 1 - p;
    last.push([t.clientX, e.timeStamp]); if (last.length > 5) last.shift();
  }, {passive:true});
  addEventListener("touchend", () => {
    if (!on){ x0 = null; return; }
    x0 = null; on = false;
    const W = innerWidth, a = last[0], b = last[last.length - 1], v = (b[0] - a[0]) / Math.max(1, b[1] - a[1]);
    const p = Math.min(1, cur / W);
    ghost.style.transform = ""; $app.style.transform = ""; shade.remove();
    if (p > 0.35 || v > 0.4) slidePages("pop", ghost, p);          // 끝까지 넘김
    else {                                                          // 제자리로
      const o = { duration: 300, easing: PAGE_EASE, fill: "forwards" }, sh = document.createElement("div"); sh.className = "shade"; document.body.appendChild(sh);
      const an = [ ghost.animate([{transform:`translateX(${p*W}px)`}, {transform:"none"}], o), $app.animate([{transform:`translateX(${-W*.3*(1-p)}px)`}, {transform:`translateX(${-W*.3}px)`}], o), sh.animate([{opacity:1-p}, {opacity:1}], o) ];
      Promise.all(an.map(x => x.finished)).then(() => {   // 떼어 둔 상세 화면을 그대로 되돌림 (입력·차트 상태 유지)
        S.detail = sym; $app.innerHTML = ""; while (ghost.firstChild) $app.appendChild(ghost.firstChild);
        document.getElementById("tabbar").classList.add("away"); bindNavbar(); scrollTo(0, detailY);
        an.forEach(x => x.cancel()); ghost.remove(); sh.remove(); });
    }
  });
})();

/* 아래에서 올라오는 창: 같은 곡선(.32,.72,0,1)으로 열림 0.4초 · 닫힘 0.28초(끌다 놓으면 손가락 속도를 이어받아 0.12~0.28초)
   닫는 길 네 가지: ✕ · 바깥 터치 · 아래로 끌기(높이 1/3 또는 빠른 튕김) · Escape. 목록이 맨 위일 때만 끌려 내려간다. */
function openSheet(label, inner){
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  bg.innerHTML = `<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}"><div class="grab" aria-hidden="true"></div>
    <div class="sheet-top"><h2 class="sh3">${esc(label)}</h2><button class="icon-btn press" data-x aria-label="닫기" style="margin-right:-12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>${inner}</div>`;
  const opener = document.activeElement;
  document.body.appendChild(bg); document.body.style.overflow = "hidden"; document.body.classList.add("sheet-open");
  $app.inert = true; document.getElementById("tabbar").inert = true;   // 시트 밖으로 포커스가 새지 않게
  const sheet = bg.querySelector(".sheet"), scrim = bg.querySelector(".scrim");
  const H = () => sheet.getBoundingClientRect().height;
  const move = (y, dur, curve) => {
    const t = REDUCED ? "none" : (dur ? `transform ${dur}ms ${curve}` : "none");
    sheet.style.transition = t; scrim.style.transition = REDUCED ? "none" : (dur ? `opacity ${dur}ms ${curve}` : "none");
    sheet.style.transform = `translateY(${y}px)`; scrim.style.opacity = Math.max(0, 1 - y / H());
    const p = Math.max(0, 1 - y / H());   // 창이 올라온 만큼 뒤 화면이 작아지고 모서리가 둥글어짐
    $app.style.transition = t.replace("transform", "transform") ; $app.style.transformOrigin = `50% ${scrollY + innerHeight / 2}px`;
    $app.style.transform = p ? `scale(${1 - 0.06 * p})` : ""; $app.style.borderRadius = p ? `${14 * p}px` : ""; $app.style.overflow = p ? "hidden" : "";
  };
  requestAnimationFrame(() => requestAnimationFrame(() => move(0, 400, "var(--ease)")));
  let closed = false;
  try{ history.pushState({v: "s"}, ""); }catch(e){}
  const close = (v = 0, fromPop = false) => {
    if (closed) return; closed = true; bg.classList.add("closing");
    if (!fromPop && history.state?.v === "s"){ skipPop++; history.back(); }
    const cur = new DOMMatrix(getComputedStyle(sheet).transform).m42, rest = H() - cur;
    const dur = v > 0 ? Math.max(120, Math.min(280, rest / v)) : 280;
    move(H(), dur, "var(--ease)"); document.body.style.overflow = "";
    removeEventListener("keydown", onKey);
    $app.inert = false; document.getElementById("tabbar").inert = !!S.detail; try{ opener?.focus?.(); }catch(e){}
    setTimeout(() => { bg.remove(); document.body.classList.remove("sheet-open"); $app.style.transition = ""; $app.style.transform = ""; $app.style.borderRadius = ""; $app.style.overflow = ""; }, REDUCED ? 0 : dur);
  };
  bg._close = fromPop => close(0, fromPop);
  const onKey = e => { if (e.key === "Escape") close(); };
  addEventListener("keydown", onKey);
  scrim.onclick = () => close();
  bg.querySelector("[data-x]").onclick = () => close();
  /* 끌기 */
  let y0 = null, dy = 0, dragging = false, samples = [];
  const scroller = () => sheet.querySelector(".results");
  sheet.addEventListener("touchstart", e => { y0 = e.touches[0].clientY; dy = 0; dragging = false; samples = [[y0, e.timeStamp]]; }, {passive:true});
  sheet.addEventListener("touchmove", e => {
    if (y0 == null) return;
    const y = e.touches[0].clientY; dy = y - y0;
    const sc = scroller(), inList = sc && sc.contains(e.target);
    if (!dragging){
      if (dy > 4 && (!inList || sc.scrollTop <= 0)) dragging = true;   // 목록이 맨 위일 때만 창이 내려감
      else if (Math.abs(dy) > 4){ y0 = null; return; }                  // 아니면 목록 스크롤
    }
    if (dragging){ e.preventDefault(); move(Math.max(0, dy), 0); samples.push([y, e.timeStamp]); if (samples.length > 5) samples.shift(); }
  }, {passive:false});
  sheet.addEventListener("touchend", () => {
    if (!dragging){ y0 = null; return; }
    const [a, b] = [samples[0], samples[samples.length - 1]], v = (b[0] - a[0]) / Math.max(1, b[1] - a[1]); // px/ms
    y0 = null; dragging = false;
    if (dy > H() / 3 || v > 0.5) close(v > 0 ? v : 0);
    else move(0, 400, "var(--ease-back)");   // 제자리로 돌아올 때만 살짝 튕김
  });
  return { bg, sheet, close };
}

/* 내 종목에 추가 (검색·발견 공용): 종목.csv에 한 줄 더하고 그 종목만 바로 계산 */
async function addStock(m, c, n0){
  const krName = Object.entries(ALIAS).find(([k,v]) => v === c && m === "미국")?.[0];
  const name = m === "미국" ? (krName || n0.replace(/,?\s+(Inc\.?|Corporation|Corp\.?|Ltd\.?|Holdings?|plc|N\.V\.|Co\.?)$/i, "").replace(/\s+Class [A-Z].*$/i,"").replace(/\s+/g, " ").trim()) : n0;
  await loadCSV();
  if (S.csv.rows.some(v => symOf(v["시장"], v["티커"]) === symOf(m, c))) throw new Error("이미 추가한 종목이에요");
  const bin = LS.get("removed", {}), old = bin[symOf(m, c)];
  S.csv.rows.push(old ? Object.fromEntries(S.csv.head.map(h => [h, old[h] ?? ""])) : Object.fromEntries(S.csv.head.map(h => [h, h==="시장"?m : h==="티커"?c : h==="이름"?name : ""])));
  await saveCSV(`앱: ${name} 추가`);
  if (old){ delete bin[symOf(m, c)]; LS.set("removed", bin); toast("예전 설정도 되살렸어요"); }
  S.justAdded = symOf(m, c);
  render("none");
  const t = await dispatch("status", symOf(m, c));
  waitRun(t, name + " 계산 중");
}
async function openSearch(){
  const { bg } = openSheet("종목 추가", `<div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="삼성전자, 엔비디아, NVDA, 005930" autocomplete="off" enterkeyhint="search" aria-label="기업 검색"></div>
    <div class="results" id="res"><div class="list">${[0,1,2,3].map(() => `<div class="row"><div class="main"><div class="sk" style="width:45%;height:16px"></div><div class="sk" style="width:30%;height:12px;margin-top:8px"></div></div></div>`).join("")}</div></div>`);
  const $q = bg.querySelector("#q"), $r = bg.querySelector("#res");
  setTimeout(() => $q.focus(), REDUCED ? 0 : 300);
  let rows = [];
  try{ rows = await catalog(); }catch(e){ $r.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  const have = new Set(stockList().map(v => v.sym));
  const run = () => {
    if (!rows.length){ $r.innerHTML = `<div class="empty"><b>종목 목록이 아직 없어요</b>잠시 뒤 다시 열어 주세요</div>`; return; }
    const q = $q.value.trim(); if (!q){ $r.innerHTML = `<div class="empty">이름이나 코드로 찾으세요<br><span class="note">미국 주식도 한글로 찾아요 · 엔비디아, 애플</span></div>`; return; }
    const qk = q.replace(/\s/g,""), ql = qk.toLowerCase();
    const aliases = new Set(Object.entries(ALIAS).filter(([k]) => k.startsWith(qk)).map(([,v]) => v));
    const scored = [];
    for (const r of rows){
      const [m, c, n] = r; const nl = n.toLowerCase().replace(/\s/g, ""), cl = c.toLowerCase();
      let sc = 0;
      if (m === "미국" && aliases.has(c)) sc = ALIAS[qk] === c ? 100 : 80;
      else if (KALIAS[qk] === c) sc = 100;
      else if (cl === ql) sc = 90; else if (nl === ql) sc = 85;
      else if (nl.startsWith(ql)) sc = 70; else if (cl.startsWith(ql)) sc = 60; else if (nl.includes(ql)) sc = 40;
      if (sc){ if (m !== "미국") sc += 3; scored.push([sc, r]); }
    }
    scored.sort((a,b) => b[0]-a[0] || a[1][2].length - b[1][2].length);
    const top = scored.slice(0, 40).map(v => v[1]);
    $r.innerHTML = top.length ? `<div class="list">${top.map((r,i) => { const s = symOf(r[0], r[1]); const on = have.has(s);
      return `<button class="row press" data-i="${i}" ${on?"disabled":""}><div class="main"><div class="name">${esc((r[0] === "미국" && Object.entries(ALIAS).find(([k, v]) => v === r[1] && k.startsWith(qk))?.[0]) || shortName(r[2], r[1], r[0]))}</div><div class="sub">${esc(r[0])} · ${esc(r[1])}</div></div><span class="pill-btn ${on?"":"primary"}" style="padding:6px 14px">${on?"등록됨":"추가"}</span></button>`; }).join("")}</div>` : `<div class="empty"><b>찾는 기업이 없습니다</b>종목코드(005930)나 영문 티커(NVDA)로도 찾아보세요.</div>`;
    $r.querySelectorAll(".row:not([disabled])").forEach(b => b.onclick = () => add(top[+b.dataset.i], b));
  };
  const add = async (r, b) => {
    const pill = b.querySelector(".pill-btn");
    b.disabled = true; pill.innerHTML = `<span class="spin"></span>`;
    try{ await addStock(r[0], r[1], r[2]); have.add(symOf(r[0], r[1])); pill.textContent = "추가됨"; pill.classList.remove("primary"); }
    catch(e){ toast(e.message); b.disabled = false; pill.textContent = "추가"; }
  };
  let tm; $q.oninput = () => { clearTimeout(tm); tm = setTimeout(() => { run(); $r.scrollTop = 0; }, 120); };
  $q.onfocus = () => { $r.scrollTop = 0; requestAnimationFrame(() => $q.scrollIntoView({block: "nearest"})); };
  $r.addEventListener("touchmove", () => { if (document.activeElement === $q) $q.blur(); }, {passive: true});   // 결과를 넘기면 키보드를 내린다
  const vv = window.visualViewport;
  if (vv){ const fit = () => { bg.style.height = vv.height + "px"; bg.style.top = vv.offsetTop + "px"; bg.style.bottom = "auto"; };
    vv.addEventListener("resize", fit); vv.addEventListener("scroll", fit); fit();
    const stop = new MutationObserver(() => { if (!bg.isConnected){ vv.removeEventListener("resize", fit); vv.removeEventListener("scroll", fit); stop.disconnect(); } }); stop.observe(document.body, {childList: true}); }
  run();
}

const ICON = {jl:"📈", entry:"✅", breakout:"🚀", arrive:"📍", breakdown:"🚫", trim:"✂️", rebuy:"🔁", momentum:"📉", fail:"↩️", news:"📰", entry_hold:"⏸️", trim14:"✂️", trim21:"✂️", final:"🛑", overheat:"🔥", reclaim21:"🔁", arrive_deep:"🎯", leader:"👑", st:"🧪", pull_buy:"🪃", vcp_buy:"🌀", dnend_buy:"🌤️", mr_buy:"🔂", sc:"🌊", wash:"🧯", reclaim:"🔓", wallbreak:"🧱", reclaim50:"🔁", entry_weak:"⚠️"};
const BUY_K = new Set(["jl","entry_weak","entry","leader","wash","mr_buy","pull_buy","vcp_buy","dnend_buy","arrive_deep","breakout","st","sc","arrive","reclaim","wallbreak","reclaim50"]);
const SELL_K = new Set(["breakdown","momentum","fail","final","overheat","trim"]);
let alertFilter = "all";
function scorecard(list){
  const stat = (arr, k) => { const v = arr.map(h => h[k]).filter(x => x != null); if (!v.length) return null;
    return { n: v.length, avg: v.reduce((a,b) => a+b, 0) / v.length, win: v.filter(x => x > 0).length / v.length * 100 }; };
  const buys = list.filter(h => BUY_K.has(h.kind)), sells = list.filter(h => SELL_K.has(h.kind));
  const cell = (st, label) => st ? `<div class="sc-cell"><div class="sub">${label}</div><div class="sc-v ${st.avg>=0?"up":"down"}">${pct(st.avg)}</div><div class="sub">${st.n}건 · 오름 ${Math.round(st.win)}%</div></div>`
                                  : `<div class="sc-cell"><div class="sub">${label}</div><div class="sc-v" style="color:var(--fg3)">–</div><div class="sub">기록 중</div></div>`;
  if (![stat(buys,"r20"), stat(buys,"r60"), stat(sells,"r20")].some(Boolean)) return "";   // 쌓이기 전엔 숨김
  if ((stat(buys,"r20")?.n || 0) < 30) return `<div class="card"><b>알림 성적</b><p class="note" style="margin:6px 0 0">아직 판단하기 일러요 · 30건이 쌓이면 보여 드려요</p></div>`;
  if (false)
    return `<div class="card"><b>알림 성적표</b><p class="note" style="margin:6px 0 0">보낸 알림의 20일 뒤 결과가 쌓이면 여기에 평균과 오른 비율이 나와요.</p></div>`;
  return `<div class="card"><div class="sc-grid">${cell(stat(buys,"r20"),"매수 · 20일")}${cell(stat(buys,"r60"),"매수 · 60일")}${cell(stat(sells,"r20"),"주의 · 20일")}</div>

}

/* 알림을 날짜별로: 오늘 · 어제 · 10월 14일 (목) */
function groupByDay(list){
  const kst = new Date(Date.now() + 9 * 3600e3), today = kst.toISOString().slice(0, 10), y = new Date(kst - 864e5).toISOString().slice(0, 10);
  const lab = d => d === today ? "오늘" : d === y ? "어제" : (() => { const t = new Date(d + "T00:00:00"); return `${t.getMonth() + 1}월 ${t.getDate()}일 (${"일월화수목금토"[t.getDay()]})`; })();
  const out = [];
  list.forEach(h => { const d = String(h.t).slice(0, 10), last = out[out.length - 1]; if (last && last[2] === d) last[1].push(h); else out.push([lab(d), [h], d]); });
  return out;
}

/* 발견 목록이 비었을 때: 왜 비었는지 한 줄 */
function emptyWhy(d, mk){
  const st = d.stats || {}, n = st["신호"] || 0, weak = st["힘 약함"] || 0, per = st["PER 높음"] || 0;
  const wk = st["약한 신호"] || 0;
  if (n && wk >= n) return `신호 ${n}개가 떴지만 모두 단독으론 평소와 비슷한 신호라 뺐어요.`;
  if (n && weak >= n) return `신호 ${n}개가 떴지만 모두 힘이 약해 뺐어요. 힘 약한 종목은 신호 뒤에도 평소보다 못했어요.`;
  if (n && per >= n) return `신호 ${n}개가 떴지만 모두 PER 30 이상이라 뺐어요.`;
  if (n) return `신호 ${n}개 중 ${[weak && `힘 약함 ${weak}개`, wk && `약한 신호 ${wk}개`, per && `PER 높음 ${per}개`].filter(Boolean).join(" · ")}를 뺐어요.`;
  if (st["시장"] === "약세") return `${d.n ? d.n + "종목 중 " : ""}오늘 신호가 뜬 곳이 없어요. 시장이 약할 땐 신호가 드물어요.`;
  return `${d.n ? d.n + "종목 중 " : ""}오늘 신호가 뜬 곳이 없어요. 장 마감 뒤 다시 확인해 주세요.`;
}
/* 발견 종목을 누르면: 왜 떴는지 · 검증 · 위치 */
function whySheet(it, o){
  const sym = symOf(o.mk, o.code), on = o.have.has(sym), px = it.price;
  const gap = v => v ? pct((px / v - 1) * 100) : "-";
  const kv = [["고점 대비", it.hi52 != null ? pct(it.hi52) : "-"], ["50일선", gap(it.ma?.["50"])], ["200일선", gap(it.ma?.["200"])],
    it.pe ? ["PER", String(it.pe)] : it.rs != null ? ["힘 순위", `상위 ${Math.max(1, 100 - it.rs)}%`] : null].filter(Boolean);
  const sigs = it.signals || [];
  const { sheet, close } = openSheet(o.name || it.sym, `<div class="why">
    <div class="wpx"><b>${num(px, o.mk)}</b> <span class="chg ${it.chg >= 0 ? "up" : "down"}">${pct(it.chg)}</span> <span class="tk">${esc(o.code)}</span></div>
    <div class="wsig">${sigs.map(t => `<span class="pill p-buy">${esc(easy(t))}</span>`).join("")}</div>
    ${it.why || it.what ? `<p class="wwhy">${esc(it.why || it.what)}</p>` : ""}
    ${it.proof ? `<p class="wproof">${esc(it.proof)}</p>` : ""}
    <div class="kv">${kv.map(([k, v]) => `<div><span>${k}</span><b>${esc(v)}</b></div>`).join("")}</div>
    <button class="btn primary press" id="wgo" style="margin-top:20px">${on ? "종목 보기" : "내 종목에 추가"}</button>
    <p class="note" style="margin:10px 0 0;text-align:center">참고용 · 투자 권유 아님</p></div>`);
  sheet.classList.add("fit");
  const b = sheet.querySelector("#wgo");
  b.onclick = async () => {
    if (o.have.has(sym)){ close(); setTimeout(() => go("push", () => S.detail = sym), 300); return; }
    b.disabled = true; b.innerHTML = `<span class="spin"></span>`;
    try{ await addStock(o.mk, o.code, it.name); o.have.add(sym); b.disabled = false; b.textContent = "종목 보기"; o.onAdd?.(); }
    catch(e){ toast(e.message); b.disabled = false; b.textContent = "내 종목에 추가"; }
  };
}

    if (v && !/^https:\/\/[\w.-]+(\/[\w./-]*)?$/.test(v)){ toast("https:// 로 시작하는 주소를 넣어 주세요"); return; }
    LS.set("qurl", v);
    if (!v){ toast("실시간 시세를 껐어요"); return; }
    try{ const ok = await pullQuotes(quoteSyms().slice(0, 3)); toast(ok ? "연결됐어요 · 장중 1분마다 갱신" : "종목을 먼저 추가해 주세요"); }
    catch(e){ toast("연결 실패: 주소를 확인해 주세요"); }
  };
  const out = document.getElementById("out");
  out.onclick = () => {
    LS.del("tok"); LS.del("dash"); S.token = ""; S.dash = null; S.csv = null; render("fade");
  };
}

let toastT;

/* 지금 할 일 카드: 상태 표시 + 한 줄 + (대기면) 거리 막대 + 살 가격·손절가·목표·손익비 */
/* 할 일 카드 (타이밍만): 큰 한 단어(매수·소량 매수·대기·확인 중·관망) + 짧은 이유 + 기다릴 가격.
   보유·차수·비중은 보여 주지 않는다 — 언제 사면 좋은지만. */
const WDEF = [["매수", "규칙상 사는 자리"], ["소량 매수", "사도 되지만 평소보다 적게"], ["마감 확인", "금요일 종가가 기준 위면 매수"], ["대기", "추세는 살아 있음 · 신호나 가격 기다리기"], ["관망", "추세 꺾임 · 지금은 사지 않기"], ["덜기", "들고 있다면 일부 팔기 (미국 청산)"], ["팔기", "들고 있다면 전부 팔고 다음 매수로"]];
function timingCard(s, pl, mk){
  const t = s.timing, tone = t.tone, p = t.price;
  const z = zsOf(s).find(z => z.label !== "지지" && z.state === "above");
  const chk = t.title === "확인 중" || t.title === "마감 확인";
  let bar = "";
  if (false){   // 거리 막대는 차트 풀이 사다리와 같은 정보라 뺀다
    const lo = Math.min(z.lo, z.hi) * 0.99, hi = Math.max(s.price, z.hi) * 1.01, pos = v => Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
    bar = `<div class="dist"><div class="track"><span class="seg-z" style="left:${pos(z.lo)}%;width:${Math.max(2, pos(z.hi) - pos(z.lo))}%"></span><span class="dot now" style="left:${pos(s.price)}%"></span></div>
      <div class="dl"><span class="c-buy">매수 가격대</span><span>지금</span></div></div>`;
  }
  const rel = v => v ? pct((v / s.price - 1) * 100) : "";
  const krm = /\.K[SQ]$/.test(s.symbol || "") || ["코스피", "코스닥"].includes(s.market);
  const rrw = pl?.rr == null ? "" : pl.rr >= 2 ? "좋음" : pl.rr >= 1 ? "보통" : krm ? "낮음" : "낮음 · 미국은 영향 적음";
  const kv = tone === "buy" && pl ? [["손절가", num(pl.stop, mk), "", rel(pl.stop)],
    ["손익비", pl.rr == null ? "-" : "1 : " + pl.rr.toFixed(1), "", rrw]] : [];
  return `<div class="card act tm-${chk ? "check" : t.cut ? "cut" : esc(tone)}" role="status">
    <div class="tmain"><div class="tl"><button class="tword press" data-wdef aria-expanded="false">${esc(t.title)}<span class="ti" aria-hidden="true">i</span></button>${t.why ? `<div class="twhy">${esc(t.why)}</div>` : ""}</div>
      ${p && tone !== "buy" ? `<div class="tpx"><small>${tone === "sell" ? "지켜볼 가격" : "매수 가격"}</small><b>${num(p, mk)}</b><small>${rel(p)}</small></div>` : ""}</div>
    ${bar}
    <div class="wdef" hidden>${WDEF.map(([w, d]) => `<div class="${w === t.title || (w === "마감 확인" && chk) ? "on" : ""}"><b>${w}</b><span>${d}</span></div>`).join("")}</div>
    ${kv.length ? `<div class="kv k3">${kv.map(([k, v, c, sm]) => `<div><span>${k}</span><b class="${c}">${v}</b>${sm ? `<small>${esc(sm)}</small>` : ""}</div>`).join("")}</div>` : ""}
    ${t.title === "대기" && p ? `<div class="tmiss">60일 안에 닿은 건 10번 중 ${krm ? 6 : 5}번 · 오래 기다리면 놓칠 수 있어요</div>` : ""}
    ${tone === "buy" && (s.cautions || []).length ? `<div class="trisk">! ${esc((s.cautions.find(c => /약세|실적/.test(c)) || s.cautions[0]))}</div>` : ""}
    <div class="tdisc">참고용 · 투자 권유 아님</div></div>`;
}
function actCard(s, pl, mk){
  if (s.timing) return timingCard(s, pl, mk);
  return `<div class="card act tm-sell" role="status"><div class="tmain"><div class="tl"><div class="tword">계산 대기</div><div class="twhy">다음 점검 때 나와요</div></div></div></div>`;
  const a = s.action, tone = a.tone, pill = stName(a.state, !!s.p1) || ({buy:"추가 매수", wait:"관찰", sell:"주의", hold:"보유"}[tone] || "관찰");
  const title = a.title.replace(/^대기 · /, "");
  const z = zsOf(s).find(z => z.label !== "지지" && z.state === "above");
  let bar = "";
  if (tone === "wait" && z){
    const lo = Math.min(z.hi, pl?.stop ?? z.lo) * 0.995, hi = s.price * 1.01, pos = v => Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
    bar = `<div class="dist"><div class="track"><span class="seg-z" style="left:${pos(z.lo)}%;width:${pos(z.hi) - pos(z.lo)}%"></span><span class="dot now" style="left:${pos(s.price)}%"></span></div>
      <div class="dl"><span class="c-buy">${esc(zoneName(s, z))} ${num(z.hi, mk)}</span><span><b>${pct(z.dist)}</b> 남음</span><span>지금 ${num(s.price, mk)}</span></div></div>`;
  }
  const rel = v => pl && pl.entry && v ? pct((v / pl.entry - 1) * 100) : "";
  const krm = /\.K[SQ]$/.test(s.symbol || "") || ["코스피", "코스닥"].includes(s.market);
  // 손익비: 한국은 1 미만이면 1차를 절반으로 줄인다(백테스트). 미국은 손익비가 결과와 상관이 없었다 → 그렇게 알려 준다
  const rrw = pl?.rr == null ? "" : pl.rr >= 2 ? "좋음" : pl.rr >= 1 ? "보통" : krm ? "낮음" : "낮음 · 미국은 영향 적음";
  const kv = pl ? [["살 가격", num(pl.entry, mk), "", Math.abs(pl.entry / s.price - 1) < 0.002 ? "지금 가격" : pct((pl.entry / s.price - 1) * 100)],
    [(pl.mode || "").startsWith("보유") ? "50일선" : "손절가", num(pl.stop, mk), "c-sell", [rel(pl.stop), pl.stop_judge].filter(Boolean).join(" · ")],
    ["목표", num(pl.target, mk), "c-buy", rel(pl.target)],
    ["손익비", pl.rr == null ? "-" : "1 : " + pl.rr.toFixed(1), "", rrw]] : [];
  const ex = a.exec, cv = s.conv, kr = /\.K[SQ]$/.test(s.symbol || "") || ["코스피", "코스닥"].includes(s.market);
  // 이평선 배열을 쉬운 말로 (정배열 = 추세 좋음, 역배열 = 추세 나쁨, 꼬임 = 방향 정하는 중)
  const AL = {"정배열": "추세 좋음", "역배열": "추세 나쁨", "꼬임": "방향 정하는 중"};
  const al = !cv?.align ? "" : cv.align.prev === "꼬임" && cv.align.now === "정배열" ? "추세 막 좋아짐"
    : cv.align.prev === "정배열" && cv.align.now === "꼬임" ? "추세 약해지는 중"
    : cv.align.prev === "꼬임" && cv.align.now === "역배열" ? "추세 막 나빠짐"
    : cv.align.prev === "역배열" && cv.align.now === "꼬임" ? "추세 나아지는 중" : (AL[cv.align.now] || "");
  const rsw = s.rs_rank != null ? `힘 상위 ${Math.max(1, Math.round(100 - s.rs_rank))}%` : "";
  const meta = [kr && cv ? `확신 ${cv.grade}${cv.reasons?.length ? " (" + cv.reasons.join("·") + ")" : ""}` : "", al, rsw, s.leader ? "👑 하락장 주도주" : ""].filter(Boolean).join(" · ");
  return `<div class="card act a-${esc(tone)}" role="status"><div class="r1"><span class="pill p-${esc(tone)}">${pill}</span>${ex ? `<span class="exec">${esc(ex[0])}${ex[1] ? ` · ${esc(ex[1])}` : ""}</span>` : ""}</div>
    <div class="ttl">${esc(title)}</div>${a.detail && tone !== "wait" ? `<div class="dt">${esc(a.detail)}</div>` : ""}${bar}

    ${meta ? `<div class="ameta">${esc(meta)}</div>` : ""}
    ${a.next && !s.story?.levels ? `<div class="nxt"><span class="sub">다음 확인</span>${esc(a.next)}</div>` : ""}
    ${kv.length ? `<div class="kv">${kv.map(([k, v, c, sm]) => `<div><span>${k}</span><b class="${c}">${v}</b>${sm ? `<small>${esc(sm)}</small>` : ""}</div>`).join("")}</div>` : ""}</div>`;
}
/* 매수 구간 이름 = 그 구간에서 살 차수 (엔진이 붙임: 아직 안 산 종목은 1차를 지금 사므로 첫 구간이 2차 자리) */
function zoneName(s, z){
  if (z.label === "지지") return "지지";
  const k = zsOf(s).filter(x => x.label !== "지지").indexOf(z);
  return k === 0 ? "매수 가격대" : "깊은 매수 가격대";
}
/* 차트 풀이: 한 문장 + 상태 꼬리표 + 가격 사다리(위·지금·아래) + 조심할 점 — 엔진 규칙으로 만든 글 */
function storyCard(s, mk){
  const st = { ...s.story }, now = st.levels.find(l => l[1] === "now")?.[0] || s.price, t = s.timing || {};
  // 판정과 사다리가 어긋나지 않게: 매수면 아래 매수 가격 줄을 빼고, 매수가 아니면 손절가 줄을 빼고 기다릴 가격을 넣는다
  let lv = st.levels.filter(l => t.tone === "buy" ? l[1] !== "buy" : l[1] !== "stop");
  if (t.tone !== "buy" && t.price && !lv.some(l => l[1] === "buy" && Math.abs(l[0] / t.price - 1) < 0.002)) lv.push([t.price, "buy", "매수 가격"]);
  if (t.tone === "sell") lv = lv.map(l => l[1] === "buy" ? [l[0], l[1], "지켜볼 가격"] : l);
  st.levels = lv.sort((a, b) => b[0] - a[0]);
  const row = ([p, k, t]) => { const [a, ...b] = t.split(" · ");
    return `<div class="lv ${k}"><i></i><span class="t"><b>${esc(a)}</b>${b.length ? `<small>${esc(b.join(" · "))}</small>` : ""}</span><span class="p">${num(p, mk)}${k === "now" ? "" : `<small>${pct((p / now - 1) * 100)}</small>`}</span></div>`; };
  return `<div class="card story" aria-label="차트 풀이"><div class="cap">차트 풀이</div><div class="sh">${esc(st.head)}</div>
    <div class="stags">${(st.tags || []).map(([t, c]) => `<span class="${c}">${esc(t)}</span>`).join("")}</div>
    <div class="ladder">${st.levels.map(row).join("")}</div>
</div>`;
}
/* 최근 표시: 같은 뜻이면 한 줄로 묶음 */
function notesCard(ns){
  const g = [];
  ns.slice(0, 5).forEach(x => { const o = g.find(y => y.advice === x.advice); o ? o.items.push(x) : g.push({advice: x.advice, score: x.score, items: [x]}); });
  return `<div class="card notes"><div class="cap">최근 차트 표시</div>${g.slice(0, 3).map(o => `<div class="note-i"><div class="nh">${o.items.map(x => `<span class="tag t-${x.tone === "buy" ? "buy" : x.tone === "sell" ? "sell" : "info"}">${esc(x.label)}<span style="font-weight:400;opacity:.75;margin-left:5px">${esc(x.date.slice(5).replace("-", "/"))}</span></span>`).join("")}</div><div class="adv">${esc(o.advice)}${Math.abs(o.score) >= 1 ? ` <span class="sub" style="font-weight:400">(검증 ${o.score > 0 ? "+" : "−"}${Math.abs(o.score).toFixed(1)}%p)</span>` : ""}</div></div>`).join("")}</div>`;
}
/* 새 버전이 올라오면 다시 불러오기 (홈 화면에 추가한 앱은 예전 화면을 오래 들고 있음) */
async function checkVersion(){
  try{
    const mine = document.querySelector('meta[name="app-version"]')?.content;
    const t = await (await fetch(location.pathname + "?v=" + Date.now(), {cache:"no-store"})).text();
    const v = (t.match(/name="app-version" content="([^"]+)"/) || [])[1];
    if (v && mine && v !== mine && !S.dirty){ toast("새 버전으로 바꾸는 중"); setTimeout(() => location.reload(), 600); }
  }catch(e){}
}
addEventListener("visibilitychange", () => { if (!document.hidden) checkVersion(); });
setTimeout(checkVersion, 1500);
try{ LS.set("swipeHint", (LS.get("swipeHint", 0) || 0) + 1); }catch(e){}
function toast(msg, spin){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.setAttribute("aria-live","polite");
  t.innerHTML = (spin ? `<span class="spin"></span>` : "") + `<span>${esc(msg)}</span>`;
  document.body.appendChild(t); clearTimeout(toastT);
  if (!spin) toastT = setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 260); }, 3600);
}

document.querySelectorAll(".tabbar button").forEach(b => b.onclick = () => {
  if (S.tab === b.dataset.tab && !S.detail){ scrollTo({top:0, behavior: REDUCED ? "auto" : "smooth"}); return; }  // 같은 탭 다시 누르면 맨 위로
  if (S.detail && history.state?.v === "d"){ skipPop++; history.back(); }
  if (S.tab === "home" && b.dataset.tab !== "home"){ try{ history.pushState({v: "t"}, ""); }catch(e){} }
  go("fade", () => { S.tab = b.dataset.tab; S.detail = null; });
});
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (S.detail && S.chart) S.chart.redraw(); }, 150); });
addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.token && !S.busy) refresh(); });
/* 열어 둔 동안 2분마다 새 시세 확인 (엔진이 장중 30분마다 갱신). 바뀐 게 있을 때만, 목록 화면에서만 다시 그린다 —
   상세 화면에서 차트를 보고 있으면 덮어쓰지 않고 다음에 열 때 반영 */
setInterval(async () => {
  if (document.hidden || !S.token || S.busy || S.dirty) return;
  try{
    const d = await readJSON("상태/대시보드.json", null);
    if (!d || d.updated === S.dash?.updated) return;
    S.dash = d; LS.set("dash", d); applyQuotes();
    if (!S.detail && S.tab === "home") render("none");
  }catch(e){}
}, 120000);
render("none");
if (S.token) refresh();
</script>
</body>
