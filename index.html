<style>
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --fg:#1D1D1F; --fg2:#6E6E73; --fg3:#AEAEB2; --line:#E5E5EA; --fill:#F2F2F7;

  /* 글자: 6단계 · 굵기 700/600/400 · 기준 17px(rem이라 시스템 글자 크기를 따라감) */

  /* 간격 */
  --gap-eyebrow:4px; --gap-sub:8px; --gap-text:4px; --gap-inner:16px;
  --pad-card:18px; --gap-caption:8px; --gap-block:20px; --gap-section:28px; --gutter:22px;
  --r-card:20px; --r-control:12px; --r:var(--r-card);
  --ease:cubic-bezier(.32,.72,0,1);      /* 시트·화면 전환 곡선 (튕기지 않음) */
  --ease-back:cubic-bezier(.34,1.4,.64,1); /* 끌다 놓아 제자리로 돌아올 때만 살짝 튕김 */
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --bar:rgba(245,245,247,.92); --tab:rgba(255,255,255,.94); --thumb:#FFFFFF; --sheet:#FFFFFF; --sheet-list:#F5F5F7; --field:rgba(118,118,128,.12); --toast:rgba(29,29,31,.94);
  color-scheme:light;
}
/* 다크 모드: 아이폰 설정을 따라감 (애플 다크 팔레트) */
@media (prefers-color-scheme: dark){

    --bg:#000000; --card:#1C1C1E; --fg:#F5F5F7; --fg2:#98989D; --fg3:#8E8E93; --line:#38383A; --fill:#2C2C2E;
    --blue:#0A84FF; --up:#FF5A66; --down:#4C9AFF;
    --buy:#30D158; --buy-bg:#0F2E1B; --sell:#FF6961; --sell-bg:#3A1416;
    --wait:#FFB340; --wait-bg:#3A2A0E; --info:#64A8FF; --info-bg:#132A4A;
    --bar:rgba(22,22,24,.92); --tab:rgba(28,28,30,.94); --thumb:#636366; --sheet:#1C1C1E; --sheet-list:#2C2C2E; --field:rgba(118,118,128,.24); --toast:rgba(58,58,60,.96);
    color-scheme:dark;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:106.25%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:var(--t-body);line-height:1.45;word-break:keep-all;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
html,body{touch-action:manipulation}   /* 두 번 탭 확대 막기 */
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
input,select,textarea{font-size:max(16px,1em)}   /* 16px보다 작으면 iOS가 입력할 때 화면을 확대한다 */
b,strong{font-weight:600}
button{cursor:pointer;border:0;background:none;padding:0;-webkit-user-select:none;user-select:none}
:focus{outline:none} :focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:10px}
.wrap{max-width:640px;margin:0 auto;padding:0 max(var(--gutter),env(safe-area-inset-right,0px)) 120px max(var(--gutter),env(safe-area-inset-left,0px))}

/* 화면 전환 (아이폰처럼: 새 화면은 오른쪽에서, 뒤 화면은 살짝 물러나며 어두워짐) */
html,body{overflow-x:clip}
#app{position:relative;z-index:2;background:var(--bg);min-height:100vh;min-height:100dvh;transform-origin:50% 50%}

.v-push{animation:push .38s var(--ease) both}

/* 누름 반응 */

<script>
"use strict";
/* ───────── 저장 (이 기기에만) ───────── */
const LS = {
  get(k, d=null){ try{ const v = localStorage.getItem(k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },

};
/* 2026-10-17: 탭 = 신호(시장 지표·종목별 매수·매도) · 오동엔진(차트 자리) · 설정. 예전 오동엔진(종목·발견·알림)은 뺐다 */
const HOME = "dh";
const S = { token: LS.get("tok", ""), repo: LS.get("repo", "odh2838-art/timing-agent"),
  tab: HOME, ltd: null, odd: null, ltRange: LS.get("ltRange", 130), detail: null, dash: LS.get("dash"), csv: null, alerts: null, err: "", busy: null, loading: true, dirty: false };

/* ───────── GitHub ───────── */
const enc = p => p.split("/").map(encodeURIComponent).join("/");
async function gh(path, opt={}){
  let res;
  try{ res = await fetch("https://api.github.com/repos/" + S.repo + path, {
    ...opt, cache:"no-store", signal: opt.signal || (AbortSignal.timeout ? AbortSignal.timeout(15000) : undefined),
    headers:{ "Authorization":"Bearer " + S.token, "X-GitHub-Api-Version":"2022-11-28",
              "Accept": opt.raw ? "application/vnd.github.raw+json" : "application/vnd.github+json",
              ...(opt.body ? {"Content-Type":"application/json"} : {}) }
  }); }catch(e){ throw new Error("연결할 수 없어요 · 인터넷을 확인해 주세요"); }
  if (res.status === 429 || (res.status === 403 && res.headers.get("x-ratelimit-remaining") === "0")) throw new Error("요청이 많아요 · 잠시 뒤 다시 해 주세요");
  if (res.status === 401){ const e = new Error("토큰이 맞지 않거나 만료됐어요"); e.auth = true; throw e; }
  if (res.status === 403) throw new Error("토큰 권한이 부족해요 · Contents·Actions 읽기/쓰기 허용");
  if (res.status === 404) { const e = new Error("없음"); e.nf = true; throw e; }
  if (res.status === 409) throw new Error("다른 곳에서 먼저 바뀌었어요 · 다시 시도해 주세요");
  if (!res.ok) throw new Error("잠시 문제가 있어요 · 다시 시도해 주세요");
  if (res.status === 204) return null;
  return opt.raw ? (opt.blob ? res.blob() : res.text()) : res.json();
}
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")), c => c.charCodeAt(0)));
const b64enc = s => { const b = new TextEncoder().encode(s); let x=""; for (let i=0;i<b.length;i+=0x8000) x += String.fromCharCode.apply(null, b.subarray(i,i+0x8000)); return btoa(x); };
async function readJSON(path, d){ try{ return JSON.parse(await gh("/contents/" + enc(path) + "?ref=main", {raw:true})); }catch(e){ if (e.nf) return d; throw e; } }

/* ───────── CSV ───────── */
function parseCSV(t){
  const rows=[]; let row=[], f="", q=false;
  for (let i=0;i<t.length;i++){
    const c=t[i];
    if (q){ if (c==='"'){ if (t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if (c==='"') q=true;
    else if (c===','){ row.push(f); f=""; }
    else if (c==='\n' || c==='\r'){ if (c==='\r' && t[i+1]==='\n') i++; row.push(f); f=""; if (row.some(x=>x!=="")) rows.push(row); row=[]; }
    else f+=c;
  }
  row.push(f); if (row.some(x=>x!=="")) rows.push(row);
  return rows;
}
const cell = v => /[",\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
const csvText = (head, rows) => [head, ...rows.map(r => head.map(h => r[h] ?? ""))].map(r => r.map(x => cell(String(x))).join(",")).join("\n") + "\n";
const symOf = (mk, tk) => mk === "코스피" ? tk + ".KS" : mk === "코스닥" ? tk + ".KQ" : tk;

/* ───────── 점검 실행 ───────── */
async function dispatch(cmd, symbol){
  const since = Date.now() - 5000;
  await gh("/actions/workflows/agent.yml/dispatches", { method:"POST", body: JSON.stringify({ ref:"main", inputs: symbol ? {cmd, symbol} : {cmd} }) });
  return since;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function waitRun(since, label){
  S.busy = label; toast(label + " · 1분 정도", true); syncBusy();
  let id = null, errs = 0;
  for (let i=0;i<60;i++){
    await sleep(i < 6 ? 3000 : 5000);
    try{
      const j = await gh("/actions/runs?event=workflow_dispatch&per_page=5"); errs = 0;
      const run = id ? j.workflow_runs.find(r => r.id === id) : j.workflow_runs.find(r => Date.parse(r.created_at) >= since - 60000);   // 폰 시계가 조금 빨라도 찾게
      if (!run) continue;
      id = run.id;
      if (run.status === "completed"){
        S.busy = null; syncBusy();
        if (run.conclusion === "success"){ await refresh(); toast("다시 계산했어요"); }
        else toast("계산하지 못했어요. 설정 > 고급 > 실행 기록을 확인해 주세요.");
        return;
      }
    }catch(e){ if (++errs >= 3){ S.busy = null; syncBusy(); toast(e.message); return; } }   // 계속 실패하면 5분 기다리지 않고 알림
  }
  S.busy = null; syncBusy(); toast("아직 계산 중이에요. 잠시 뒤 새로고침해 주세요.");
}
function syncBusy(){ document.querySelectorAll("[data-busy]").forEach(b => b.disabled = !!S.busy); }

/* ───────── 데이터 ───────── */
async function refresh(){
  if (isDH(S.tab) && S.dhd && !String(S.dhd).startsWith("h:") && S.dhL[dhTab()]){   // 종목 상세를 보던 중이면: 뒤에서 받아 보고 바뀐 게 있을 때만 다시 그림 (차트 확대·위치 유지, 리뷰 #6)
    const t = dhTab(), key = o => o ? `${o.date || ""}|${o.at || ""}` : "", a = key(S.dhc[t]), b = key(S.dhPre[t]);
    try{ await loadDH(t); }catch(e){ return; }
    if ((key(S.dhc[t]) !== a || key(S.dhPre[t]) !== b) && !S.dirty && !document.querySelector(".sheet-bg")) render("none");
    return;
  }
  if (isDH(S.tab)){   // 동현 목록·보유: 화면의 자료는 그대로 두고 뒤에서 받아서, 성공했을 때만 바꿈 (오프라인이면 그대로, 리뷰 #4)
    const t = dhTab(), sheet = !!document.querySelector(".sheet-bg");
    try{ await Promise.all([loadDH(t), sheet ? null : loadHold()]); S.holdErr = null; }
    catch(e){ if (S.dhc[t]) toast(e.message); else { S.dhL = {}; render("none"); } return; }
    if (!S.dirty && !sheet) render("none");
    return;
  }
  S.err = ""; S.lt = null; S.loading = false; S.dhL = {}; S.holdErr = null; if (!document.querySelector(".sheet-bg")) S.hold = null;
  if (!S.dirty) render("none");   // 입력 중이면 화면을 덮어쓰지 않는다 (목록 화면이 자료를 다시 받음)
}
/* ───────── 실시간 시세 (설정의 '실시간 시세 주소' = 내 Cloudflare 중계) ─────────
   한국은 네이버 실시간, 미국은 야후 1분봉. 장이 열린 동안 1분마다, 새로고침 버튼으로 즉시. */
S.q = {};
const IDX_SYM = {"코스피": "^KS11", "코스닥": "^KQ11", "S&P 500": "^GSPC", "나스닥": "^IXIC"};
const isKRsym = sym => /\.K[SQ]$/.test(sym) || sym === "^KS11" || sym === "^KQ11";
function marketOpenNow(kr){
  const tz = kr ? "Asia/Seoul" : "America/New_York";
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", {timeZone: tz, weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false}).formatToParts(new Date()).map(x => [x.type, x.value]));
  const m = (+p.hour % 24) * 60 + +p.minute, wd = !["Sat", "Sun"].includes(p.weekday);
  return wd && (kr ? m >= 540 && m < 930 : m >= 570 && m < 960);
}
function quoteSyms(){
  return Object.keys(S.lt?.stocks || {});
}
function applyOne(s, q, prevKey){
  if (!s || !q || !q.p) return;
  const bars = s.bars || (s.bars = []), last = bars[bars.length - 1];
  if (last && q.d < last[0]) return;                       // 엔진 자료가 더 새것
  if (last && last[0] === q.d){
    last[4] = q.p; if (q.o) last[1] = q.o;
    last[2] = Math.max(q.h ?? q.p, q.p, last[1]); last[3] = Math.min(q.l ?? q.p, q.p, last[1]);
    if (q.v) last[7] = q.v;
  } else if (last){
    bars.push([q.d, q.o ?? q.p, Math.max(q.h ?? q.p, q.p), Math.min(q.l ?? q.p, q.p), q.p, last[5], last[6], q.v ?? null]);
    if (bars.length > 500) bars.shift();
  }
  const prev = q.prev ?? (bars.length > 1 ? bars[bars.length - 2][4] : null);
  s.price = q.p; if (prev) s.chg = (q.p / prev - 1) * 100;
  s.qt = q.t;
}
function applyQuotes(){
  for (const [sym, s] of Object.entries(S.lt?.stocks || {})){
    const q = S.q[sym]; if (!q || !q.p) continue;
    const prev = q.d > s.date ? (q.prev ?? s.price) : (q.prev ?? (s.chg != null ? s.price / (1 + s.chg / 100) : null));   // 같은 날이면 엔진의 전날 종가
    s.live = { p: q.p, chg: prev ? (q.p / prev - 1) * 100 : null, t: q.t, d: q.d };
  }
}
const hhmm = t => { try{ return new Date(t).toLocaleTimeString("ko-KR", {hour: "2-digit", minute: "2-digit", hour12: false}); }catch(e){ return ""; } };
async function pullQuotes(syms){
  const base = (LS.get("qurl", "") || "").trim().replace(/\/+$/, "");
  if (!base || !syms.length) return false;
  let j;
  try{
    const r = await fetch(base + "?s=" + encodeURIComponent(syms.join(",")), {cache: "no-store", signal: AbortSignal.timeout ? AbortSignal.timeout(10000) : undefined});
    if (!r.ok) throw 0; j = await r.json();
  }catch(e){ throw new Error("실시간 시세를 받지 못했어요"); }
  for (const [k, v] of Object.entries(j)) if (v && v.p) S.q[k] = v;
  applyQuotes(); return true;
}
/* 화면에 반영: 홈은 다시 그리고, 상세는 가격·차트만 고친다 (보던 위치 유지) */
function showQuotes(){
  if (S.dirty || document.querySelector(".sheet-bg:not(.closing)")) return;
  if (S.dhd || isDH(S.tab) || S.tab === "guide") return;   // 동현엔진은 종가 기준이라 실시간으로 다시 그리지 않음
  if (S.odd){ odPrice(); return; }   // 오동엔진 상세: 차트는 그대로 두고 가격만
  const y = scrollY;
  if (S.ltd) renderLTDetail(S.ltd); else if (S.tab === "lt") renderLT(); else if (S.tab === "od") renderOD(); else return;
  scrollTo(0, y);
}
async function liveTick(force){
  if (document.hidden || !S.token || !S.lt) return;
  const syms = quoteSyms().filter(x => force || marketOpenNow(isKRsym(x)));
  if (!syms.length) return;
  try{ if (await pullQuotes(syms)) showQuotes(); }catch(e){ if (force) toast(e.message); }
}
setInterval(() => liveTick(false), 60000);
/* 화면 확대 막기 (iOS는 user-scalable=no를 무시하므로 손가락 두 개 확대를 직접 막는다). 차트 안의 확대·축소는 그대로 */
["gesturestart", "gesturechange", "gestureend"].forEach(t => document.addEventListener(t, e => { if (!e.target.closest?.(".plot, .pro-box")) e.preventDefault(); }, {passive: false}));
/* 손가락 두 개: 차트 밖이면 화면 확대를 막고, 차트 안이면 화면이 위아래로 움직이지 않게 막아 차트 확대·축소로 쓴다 */
if (/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)){
  document.addEventListener("touchstart", e => { if (e.touches.length > 1) e.preventDefault(); }, {passive: false});
  document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, {passive: false});
}

/* 지금 화면을 통째로 떼어 고정 (전환하는 동안 뒤/앞 화면 역할).

function snapshot(){
  const g = document.createElement("div"); g.className = "ghost"; g.setAttribute("aria-hidden", "true");
  g.style.top = $app.getBoundingClientRect().top + "px";
  while ($app.firstChild) g.appendChild($app.firstChild);

const PAGE_MS = 500, PAGE_EASE = "cubic-bezier(.32,.72,0,1)";
function slidePages(how, ghost, from = 0){
  const shade = document.createElement("div"); shade.className = "shade"; document.body.appendChild(shade);
  const W = innerWidth, o = { duration: PAGE_MS * (1 - from), easing: PAGE_EASE, fill: "forwards" };
  let anims;
  if (how === "push"){   // 새 화면이 위로 덮으며 들어옴
    $app.classList.add("over");
    anims = [ $app.animate([{transform:`translateX(${W}px)`}, {transform:"none"}], o),
              ghost.animate([{transform:"none"}, {transform:`translateX(${-W*.3}px)`}], o),
              shade.animate([{opacity:0}, {opacity:1}], o) ];
  } else {               // 앞 화면이 오른쪽으로 빠지고 뒤 화면이 돌아옴
    ghost.classList.add("top");
    anims = [ ghost.animate([{transform:`translateX(${W*from}px)`}, {transform:`translateX(${W}px)`}], o),
              $app.animate([{transform:`translateX(${-W*.3*(1-from)}px)`}, {transform:"none"}], o),
              shade.animate([{opacity:1-from}, {opacity:0}], o) ];
  }
  Promise.all(anims.map(a => a.finished)).then(() => { anims.forEach(a => a.cancel()); ghost.remove(); shade.remove(); $app.classList.remove("over"); });
}

const hN = () => +(history.state?.n || 0);
function hPush(v){ try{ history.pushState({ v, n: hN() + 1 }, ""); }catch(e){} }
let skipPop = 0, popFix = null, BACK_ANIM = false;
function histTo(n, v){   // 기록을 깊이 n(맨 위 항목 v)으로 맞춘다
  const cur = hN();
  try{
    if (cur === n){ if (n) history.replaceState({ v, n }, ""); }
    else if (cur < n){ for (let k = cur + 1; k <= n; k++) history.pushState({ v: k === n ? v : "t", n: k }, ""); }
    else { skipPop++; popFix = n ? () => { try{ history.replaceState({ v, n }, ""); }catch(e){} } : null; history.go(n - cur); }
  }catch(e){}
}
function go(how, fn){ if (how === "push"){ S.listY = scrollY; hPush("d"); } S.dirty = false; try{ S.chart?.destroy?.(); }catch(e){} S.chart = null; clearInterval(S.tfTimer); fn(); render(how); }

    geo = { L, cw, start, W, H, boxes };

    if (cross != null && drag?.cross && IND.sig !== false){   // 손가락으로 길게 눌러 짚은 날에 신호가 있으면 그 뜻을 (없으면 그대로 두어 화면이 들썩이지 않게)
      const d = bars[Math.max(i0, Math.min(i1, cross))][0], m = (s.marks || []).find(m => m[0] === d && (s.sig_help || {})[m[1]]);

  /* 신호 뜻: 이름표를 누르면 그 신호 하나만 — 사라는 건지, 덜라는 건지, 참고만인지 (다시 누르거나 ✕로 닫음) */
  let sel = null, selKey = "";

    const [pc, pv] = {buy: ["p-buy", "매수 신호"], trim: ["p-wait", "일부 매도 신호"], sell: ["p-sell", "매도 신호"]}[h.act] || ["p-hold", "참고"];

      <div class="sm-w">${esc(h.what)}</div><div class="sm-a"><b>${esc(h.advice)}</b> <span class="sub">· ${esc(h.proof.replace("검증: ", ""))}</span></div>`;

  }
  const chipAt = (cx, cy) => {   // 누른 자리의 이름표 (손가락 크기만큼 여유)
    const r = $plot.getBoundingClientRect(), k = geo.W / r.width, px = (cx - r.left) * k, py = (cy - r.top) * k;

    const n0 = V.n, e0 = V.end, t0 = performance.now(), D = 380, ease = t => 1 - Math.pow(1 - t, 3);
    const step = now => { const t = Math.min(1, (now - t0) / D), k = ease(t); V.n = n0 + (n1 - n0) * k; V.end = e0 + (e1 - e0) * k; draw(); if (t < 1) requestAnimationFrame(step); else segSync(); };
    requestAnimationFrame(step);
  };
  $seg.onclick = e => { const b = e.target.closest("button"); if (!b) return; const k = +b.dataset.k; LS.set(PK, b.textContent); tween(k, N - 1); };
  box.querySelector(".inds").onclick = e => { const b = e.target.closest("[data-ind]"); if (!b) return; const k = b.dataset.ind; IND[k] = !IND[k]; LS.set(INDK, IND); b.setAttribute("aria-pressed", IND[k]); legend(); draw(); };

  const idxAt = cx => { const r = $plot.getBoundingClientRect(), px = (cx - r.left) * (geo.W / r.width); return Math.round(geo.start + (px - geo.L) / geo.cw - 0.5); };

    } else if (pts.size === 2){

      const mid = (a.x + b.x) / 2; pinch = { latest: V.end >= N - 1.5, d0: Math.hypot(a.x - b.x, a.y - b.y), n0: V.n, c: geo.start + (((mid - $plot.getBoundingClientRect().left) * geo.W / $plot.getBoundingClientRect().width) - geo.L) / geo.cw, mid };

    if (pinch && pts.size === 2){
      const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y), r = $plot.getBoundingClientRect();
      V.n = pinch.n0 * pinch.d0 / Math.max(20, d); clamp();
      const cw = (geo.W - geo.L - (isKR(s.market) ? 76 : 62)) / V.n, mx = ((a.x + b.x) / 2 - r.left) * geo.W / r.width;
      V.end = pinch.latest ? N - 1 : pinch.c - (mx - geo.L) / cw + V.n - 1;   // 최근 봉을 보고 있었으면 오른쪽 끝은 오늘에 고정
      redraw(); return;

    if (!drag) return;

    const dx = e.clientX - drag.x0;
    if (!drag.moved && Math.abs(dx) > 6){ drag.moved = true; clearTimeout(hold); cross = null; }
    if (drag.moved){ V.end = drag.end0 - dx / geo.cw * ($plot.getBoundingClientRect().width ? geo.W / $plot.getBoundingClientRect().width : 1); drag.hist.push([e.clientX, e.timeStamp]); if (drag.hist.length > 6) drag.hist.shift(); redraw(); }
  });
  const up = e => {
    pts.delete(e.pointerId); clearTimeout(hold);
    if (pts.size < 2) pinch = null;
    if (drag && pts.size === 0){
      if (drag.cross){ cross = null; draw(); }
      else if (drag.moved){   // 놓으면 관성으로 조금 더 흘러가다 멈춤
        const [a, b] = [drag.hist[0], drag.hist[drag.hist.length - 1]], r = $plot.getBoundingClientRect();
        let v = -((b[0] - a[0]) / Math.max(1, b[1] - a[1])) / geo.cw * (geo.W / r.width); let t = performance.now();
        if (!REDUCED && Math.abs(v) > 0.002){ const step = now => { const dt = now - t; t = now; V.end += v * dt; v *= Math.pow(0.94, dt / 16); const e0 = V.end; clamp(); draw(); if (Math.abs(v) > 0.0008 && V.end === e0) inertia = requestAnimationFrame(step); else segSync(); }; inertia = requestAnimationFrame(step); }
        else segSync();
      } else {   // 이름표를 누르면 뜻 · 빈 곳을 두 번 탭하면 원래 기간으로
        const b = IND.sig !== false && chipAt(e.clientX, e.clientY);
        if (b){ const d = bars[b.i][0]; showSig(sel && sel.t === b.t && sel.d === d ? null : {t: b.t, d, i: b.i}); draw(); lastTap = 0; }
        else { const now = performance.now(); if (now - lastTap < 300){ tween(pdef, N - 1); lastTap = 0; } else lastTap = now; }

    tick: () => { if (bars.length !== N) return false; ind = calcInd(bars); draw(); segSync(false); return true; } };
}

/* 왼쪽 가장자리에서 밀면 뒤로: 손가락을 따라 앞 화면이 밀리고 뒤 화면이 드러남.
   아이폰(홈 화면 앱엔 시스템 뒤로가 없음)에서만. 안드로이드는 시스템 뒤로 제스처가 같은 자리를 써서 둘이 부딪히면 화면이 멈춘다 */
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
let SWIPING = false;
if (false) (() => {   // 10/18: 꺼 둠 — 아이폰 시스템 뒤로 제스처가 같은 자리를 써서 화면이 겹치고 멈췄음
  let x0 = null, y0 = 0, on = false, ghost = null, shade = null, last = [], detailY = 0, sym = null, cur = 0;
  addEventListener("touchstart", e => { const t = e.touches[0]; x0 = ((S.odd || S.ltd) && t.clientX < 24 && !document.querySelector(".sheet-bg") && !REDUCED) ? t.clientX : null; y0 = t.clientY; on = false; last = [[t.clientX, e.timeStamp]]; }, {passive:true});
  addEventListener("touchmove", e => {
    if (x0 == null) return; const t = e.touches[0], dx = t.clientX - x0, W = innerWidth;
    if (!on){
      if (Math.abs(t.clientY - y0) > Math.abs(dx)){ x0 = null; return; }
      if (dx < 8) return;
      on = true; SWIPING = true; sym = S.odd ? ["odd", S.odd] : ["ltd", S.ltd]; detailY = scrollY;
      ghost = snapshot(); ghost.classList.add("top");
      if (history.state?.v === "d"){ skipPop++; history.back(); }   // 손가락으로 넘긴 뒤로도 기록과 맞춘다
      S.listY = S.listY || 0; S[sym[0]] = null; render("none"); scrollTo(0, S.listY);
      shade = document.createElement("div"); shade.className = "shade"; document.body.appendChild(shade);
    }
    const p = Math.max(0, Math.min(1, dx / W)); cur = Math.max(0, dx);
    ghost.style.transform = `translateX(${dx}px)`; $app.style.transform = `translateX(${-W*.3*(1-p)}px)`; shade.style.opacity = 1 - p;
    last.push([t.clientX, e.timeStamp]); if (last.length > 5) last.shift();
  }, {passive:true});
  const end = cancel => {
    if (!on){ x0 = null; return; }
    x0 = null; on = false; SWIPING = false;
    const W = innerWidth, a = last[0], b = last[last.length - 1], v = (b[0] - a[0]) / Math.max(1, b[1] - a[1]);
    const p = Math.min(1, cur / W);
    ghost.style.transform = ""; $app.style.transform = ""; shade?.remove();
    if (cancel || p > 0.35 || v > 0.4) slidePages("pop", ghost, p);   // 끝까지 넘김 (시스템이 손가락을 가져가도 뒤로 마무리)
    else {                                                          // 제자리로
      const o = { duration: 300, easing: PAGE_EASE, fill: "forwards" }, sh = document.createElement("div"); sh.className = "shade"; document.body.appendChild(sh);
      const an = [ ghost.animate([{transform:`translateX(${p*W}px)`}, {transform:"none"}], o), $app.animate([{transform:`translateX(${-W*.3*(1-p)}px)`}, {transform:`translateX(${-W*.3}px)`}], o), sh.animate([{opacity:1-p}, {opacity:1}], o) ];
      Promise.all(an.map(x => x.finished)).then(() => {   // 떼어 둔 상세 화면을 그대로 되돌림 (입력·차트 상태 유지)
        S[sym[0]] = sym[1]; $app.innerHTML = ""; while (ghost.firstChild) $app.appendChild(ghost.firstChild);

/* 아래에서 올라오는 창: 같은 곡선(.32,.72,0,1)으로 열림 0.4초 · 닫힘 0.28초(끌다 놓으면 손가락 속도를 이어받아 0.12~0.28초)
   닫는 길 네 가지: ✕ · 바깥 터치 · 아래로 끌기(높이 1/3 또는 빠른 튕김) · Escape. 목록이 맨 위일 때만 끌려 내려간다. */
function openSheet(label, inner){
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  bg.innerHTML = `<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}"><div class="grab" aria-hidden="true"></div>
    <div class="sheet-top"><h2 class="sh3">${esc(label)}</h2><button class="icon-btn press" data-x aria-label="닫기" style="margin-right:-12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>${inner}</div>`;
  const opener = document.activeElement;
  document.body.appendChild(bg); document.body.style.overflow = "hidden"; document.body.classList.add("sheet-open");
  $app.inert = true; document.getElementById("tabbar").inert = true;   // 시트 밖으로 포커스가 새지 않게
  const sheet = bg.querySelector(".sheet"), scrim = bg.querySelector(".scrim");
  const H = () => sheet.getBoundingClientRect().height;
  const move = (y, dur, curve) => {
    const t = REDUCED ? "none" : (dur ? `transform ${dur}ms ${curve}` : "none");
    sheet.style.transition = t; scrim.style.transition = REDUCED ? "none" : (dur ? `opacity ${dur}ms ${curve}` : "none");
    sheet.style.transform = `translateY(${y}px)`; scrim.style.opacity = Math.max(0, 1 - y / H());
    const p = Math.max(0, 1 - y / H());   // 창이 올라온 만큼 뒤 화면이 작아지고 모서리가 둥글어짐
    $app.style.transition = t.replace("transform", "transform") ; $app.style.transformOrigin = `50% ${scrollY + innerHeight / 2}px`;
    $app.style.transform = p ? `scale(${1 - 0.06 * p})` : ""; $app.style.borderRadius = p ? `${14 * p}px` : ""; $app.style.overflow = p ? "hidden" : "";
  };
  requestAnimationFrame(() => requestAnimationFrame(() => move(0, 400, "var(--ease)")));
  let closed = false;
  hPush("s");
  const close = (v = 0, fromPop = false) => {
    if (closed) return; closed = true; bg.classList.add("closing");
    if (!fromPop && history.state?.v === "s"){ skipPop++; history.back(); }
    const cur = new DOMMatrix(getComputedStyle(sheet).transform).m42, rest = H() - cur;
    const dur = v > 0 ? Math.max(120, Math.min(280, rest / v)) : 280;
    move(H(), dur, "var(--ease)"); document.body.style.overflow = "";
    removeEventListener("keydown", onKey);
    $app.inert = false; document.getElementById("tabbar").inert = !!(S.ltd || S.odd || S.dhd); try{ opener?.focus?.(); }catch(e){}
    setTimeout(() => { bg.remove(); document.body.classList.remove("sheet-open"); $app.style.transition = ""; $app.style.transform = ""; $app.style.borderRadius = ""; $app.style.overflow = ""; }, REDUCED ? 0 : dur);
  };
  bg._close = fromPop => close(0, fromPop);
  const onKey = e => { if (e.key === "Escape") close(); };
  addEventListener("keydown", onKey);
  scrim.onclick = () => close();
  bg.querySelector("[data-x]").onclick = () => close();
  /* 끌기 */
  let y0 = null, dy = 0, dragging = false, samples = [];
  const scroller = () => sheet.querySelector(".results");
  sheet.addEventListener("touchstart", e => { y0 = e.touches[0].clientY; dy = 0; dragging = false; samples = [[y0, e.timeStamp]]; }, {passive:true});
  sheet.addEventListener("touchmove", e => {
    if (y0 == null) return;
    const y = e.touches[0].clientY; dy = y - y0;
    const sc = scroller(), inList = sc && sc.contains(e.target);
    if (!dragging){
      if (dy > 4 && (!inList || sc.scrollTop <= 0)) dragging = true;   // 목록이 맨 위일 때만 창이 내려감
      else if (Math.abs(dy) > 4){ y0 = null; return; }                  // 아니면 목록 스크롤
    }
    if (dragging){ e.preventDefault(); move(Math.max(0, dy), 0); samples.push([y, e.timeStamp]); if (samples.length > 5) samples.shift(); }
  }, {passive:false});
  sheet.addEventListener("touchend", () => {
    if (!dragging){ y0 = null; return; }
    const [a, b] = [samples[0], samples[samples.length - 1]], v = (b[0] - a[0]) / Math.max(1, b[1] - a[1]); // px/ms
    y0 = null; dragging = false;
    if (dy > H() / 3 || v > 0.5) close(v > 0 ? v : 0);
    else move(0, 400, "var(--ease-back)");   // 제자리로 돌아올 때만 살짝 튕김
  });
  return { bg, sheet, close };
}

/* 내 종목에 추가 (검색·발견 공용): 종목.csv에 한 줄 더하고 그 종목만 바로 계산 */
async function openSearch(o){

  const $q = bg.querySelector("#q"), $r = bg.querySelector("#res");

async function guideImages(){
  const dark = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  for (const el of $app.querySelectorAll("[data-gimg]")){
    const path = `연구/donghyun/사용법차트/${dark}/${el.dataset.gimg}.png`;

  }
}

      <li>실적 발표일은 한국은 DART 공시(없으면 작년 같은 분기로 추정), 미국은 야후에서 받아요. ‘추정’은 날짜가 며칠 다를 수 있어요.</li>
      <li>뉴스 때문에 파는 날(예: 1/20)은 엔진이 못 잡아요. 그런 날은 직접 판단해요.</li>
      <li>규칙으로 계산한 결과예요. 사고파는 결정은 직접 해요.</li>
    </ul>
  </div>`;
  bindNavbar(); guideImages();
  const gb = document.getElementById("gback"); if (gb) gb.onclick = () => { BACK_ANIM = true; history.back(); };   // 연 곳(종목·목록)으로 (아이폰 홈 화면 앱엔 시스템 뒤로가 없어서)
  if (S.guideAt){ const el = document.getElementById("g-" + S.guideAt); S.guideAt = null; if (el) requestAnimationFrame(() => scrollTo(0, el.getBoundingClientRect().top + scrollY - 60)); }
}

function renderSettings(){
  $app.innerHTML = `<div class="wrap"><div class="navbar"><div class="side"></div><span class="mini">설정</span><div class="side r"></div></div>
    <div class="title-block" data-anchor><h1 class="big">설정</h1></div>
    <div class="list">
      <button class="row press" id="recat"><span class="main" style="color:var(--blue)">검색용 종목 목록 새로 받기</span></button>
    </div>
    <div class="sec-title" role="heading" aria-level="2">자동 계산 (한국 시간)</div>
    <div class="list">
      <div class="row"><div class="main"><b>동현 🇰🇷</b><div class="sub">평일 16:05 (한국장 마감 뒤)</div></div></div>
      <div class="row"><div class="main"><b>동현 🇺🇸</b><div class="sub">화~토 07:20 (미국장 마감 뒤)</div></div></div>
    </div>
    <p class="note" style="margin:var(--gap-caption) var(--pad-card) 0">하루 한 번 종가로 계산해요. 보유 종목은 저장할 때마다 다시 점검해요.</p>
    <details class="adv"><summary class="press">고급 설정 ›</summary>
    <div class="list" style="margin-top:var(--gap-sub)">
      <div class="row"><div class="main"><div class="sub">엔진 저장소</div><b>${esc(S.repo)}</b></div></div>
      <a class="row press" href="https://github.com/${esc(S.repo)}/actions" target="_blank" rel="noopener"><span class="main" style="color:var(--blue)">실행 기록 보기</span><svg class="chev" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg></a>
    </div>
    <div class="sec-title" role="heading" aria-level="2">분봉</div>
    <div class="list">
      <div class="row"><div class="main"><label class="sub" for="qurl">분봉 중계 주소</label>
        <input id="qurl" class="qurl" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://....workers.dev" value="${esc(LS.get("burl", "") || LS.get("qurl", ""))}"></div></div>
      <button class="row press" id="qsave"><span class="main" style="color:var(--blue)">저장하고 시험하기</span></button>
    </div>
    <p class="note" style="margin:var(--gap-caption) var(--pad-card) 0">내 Cloudflare 중계(timing-app 저장소의 relay/worker.js)를 거쳐 분봉을 받아요 (한국 최근 6거래일은 네이버, 그 전·미국은 야후). 종목 화면의 차트 위에서 1분·5분·15분·1시간봉을 고르면 보여요.</p>
    <div class="list" style="margin-top:var(--gap-block)">
      <button class="row press" id="out"><span class="main" style="color:var(--sell)">토큰 지우기</span></button>
    </div>
    <p class="note" style="margin:var(--gap-caption) var(--pad-card) 0">토큰은 이 기기에만 저장돼요. 지워도 다시 넣으면 그대로 돌아와요.</p>
    </details>
    <p class="note" style="margin:18px 4px">내가 정한 규칙으로 계산한 결과예요. 투자 판단은 직접 하세요.</p>
  </div>`;
  document.getElementById("recat").onclick = async (ev) => { const b = ev.currentTarget; b.disabled = true; LS.del("catalog"); try{ const r = await catalog(); toast(r.length.toLocaleString() + "개 종목을 받았어요"); }catch(e){ toast(e.message); } b.disabled = false; };
  const $qs = document.getElementById("qsave"); if ($qs) $qs.onclick = async () => {

    if (v && !/^https:\/\/[\w.-]+(\/[\w./-]*)?$/.test(v)){ toast("https:// 로 시작하는 주소를 넣어 주세요"); return; }

    catch(e){ toast(e.message); }

  const out = document.getElementById("out");
  out.onclick = () => {
    LS.del("tok"); LS.del("dash"); S.token = ""; S.lt = null; render("fade");

let toastT;

function zoneName(s, z){
  if (z.label === "지지") return "지지";
  const k = zsOf(s).filter(x => x.label !== "지지").indexOf(z);
  return k === 0 ? "매수 가격대" : "깊은 매수 가격대";
}
/* 차트 풀이: 한 문장 + 상태 꼬리표 + 가격 사다리(위·지금·아래) + 조심할 점 — 엔진 규칙으로 만든 글 */
/* 새 버전이 올라오면 다시 불러오기 (홈 화면에 추가한 앱은 예전 화면을 오래 들고 있음) */
async function checkVersion(){
  try{
    const mine = document.querySelector('meta[name="app-version"]')?.content;
    const t = await (await fetch(location.pathname + "?v=" + Date.now(), {cache:"no-store"})).text();
    const v = (t.match(/name="app-version" content="([^"]+)"/) || [])[1];
    const busy = S.dirty || S.busy || document.querySelector(".sheet-bg");   // 입력 중·계산 기다리는 중엔 미룸 (다음에 돌아올 때 바꿈)
    let tried = ""; try{ tried = sessionStorage.getItem("verTry") || ""; }catch(e){}
    if (v && mine && v !== mine && !busy && tried !== v){ try{ sessionStorage.setItem("verTry", v); }catch(e){} toast("새 버전으로 바꾸는 중"); setTimeout(() => location.replace(location.pathname + "?v=" + encodeURIComponent(v)), 600); }   // 같은 버전으로 한 번만 (캐시가 늦어도 계속 새로고침하지 않게)
  }catch(e){}
}
addEventListener("visibilitychange", () => { if (!document.hidden) checkVersion(); });
setTimeout(checkVersion, 1500);
try{ LS.set("swipeHint", (LS.get("swipeHint", 0) || 0) + 1); }catch(e){}
function toast(msg, spin){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.setAttribute("aria-live","polite");
  t.innerHTML = (spin ? `<span class="spin"></span>` : "") + `<span>${esc(msg)}</span>`;
  document.body.appendChild(t); clearTimeout(toastT);
  if (!spin) toastT = setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 260); }, 3600);
}

document.querySelectorAll(".tabbar button").forEach(b => b.onclick = () => {
  if (S.tab === b.dataset.tab && !S.ltd && !S.odd && !S.dhd){ scrollTo({top:0, behavior: REDUCED ? "auto" : "smooth"}); return; }  // 같은 탭 다시 누르면 맨 위로
  S.guideFrom = null; histTo(b.dataset.tab === HOME ? 0 : 1, "t");   // 탭을 바꾸면 기록은 '홈' 또는 '홈 + 그 탭' 한 칸만
  go("fade", () => { S.tab = b.dataset.tab; S.ltd = null; S.odd = null; S.dhd = null; });
});
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if ((S.odd || S.dhd) && S.chart) S.chart.redraw(); }, 150); });
addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.token && !S.busy) refresh(); });
{ const v = LS.get("view");   // 보던 탭은 늘, 상세 화면은 10분 안에 다시 열었을 때만
  if (v && ["dh", "dhu", "guide", "settings"].includes(v.tab)){ S.tab = v.tab;
    if (Date.now() - (v.t || 0) < 6e5){ S.dhd = v.dhd || null; }
    histTo((S.tab !== HOME ? 1 : 0) + (S.odd || S.ltd || S.dhd ? 1 : 0), S.odd || S.ltd || S.dhd ? "d" : "t"); } }   // 다시 열 때마다 기록이 쌓이지 않게 깊이를 맞춤
try{ if (LS.get("qurl", "") && !LS.get("burl", "")){ LS.set("burl", LS.get("qurl", "")); LS.del("qurl"); } }catch(e){}   // 예전 주소는 분봉 전용 키로 옮김 (실시간 시세 자동 갱신은 끔)
render("none");   // 첫 화면이 자료를 받으니 시작할 때 refresh는 따로 안 함 (같은 요청 두 번, 오류 두 번 나오던 것)
</script>
